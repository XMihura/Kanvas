      const col = kb.querySelector(".col"), smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;

    const p = endPress();
    if (!p.lifted || e.type !== "pointerup") return;
    longPress.at = Date.now();
    swallowUntil = Date.now() + 600;
    if (p.ghost) { if (p.over) dropCard(p.id, p.over.dataset.state); }
    else if (kanbanCardEl(p.id)) contextMenuAt(kanbanCardEl(p.id), p.x, p.y);
  };
  document.addEventListener("pointerup", release);
  document.addEventListener("pointercancel", release);
}

// Detail panel ---------------------------------------------------------------

// On phones the panel covers the board, so opening it adds a history entry and the phone's back gesture closes it.
function select(id) {
  const t = id ? get(id) : null, was = ui.selected;
  // The graph keeps focus where it was, and the panel does not refresh while one of its text fields has it.
  const panel = $("#panel"), field = document.activeElement;
  if ((t ? t.id : null) !== was && field !== panel && panel.contains(field)) field.blur();
  const keptTitle = drafts.title;
  ui.selected = t ? t.id : null;
  ui.editingDesc = false;
  drafts.desc = drafts.descBase = null;
  ui.editingNote = null;
  drafts.noteEdit = null;
  drafts.title = null;
  if (keptTitle != null && was) giveBack(was, () => { drafts.title = keptTitle; });
  const back = ui.selected ? drafts.back.get(key(ui.selected)) : null;
  if (back) { drafts.back.delete(key(ui.selected)); for (const put of back) giveBack(ui.selected, put); }
  const url = ui.selected ? `#${encodeURIComponent(ui.selected)}` : location.pathname + location.search;
  if (!was && ui.selected && phone.matches) history.pushState({ panel: true }, "", url);

// Text from a save that failed goes back into its editor: at once when its task is open, else when it opens again.

function giveBack(id, put) {

  drafts.back.set(k, [...(drafts.back.get(k) || []), put]);

// A note that failed to save goes back into its task's note box, ahead of anything typed there since.
function noteBack(id, text) {
  const box = same(ui.selected, id) ? $("#panel .note-form textarea") : null;
  const now = box ? box.value : drafts.note.get(id) || "";

function yoloAction(t) {

async function toggleYolo(t) {

  }

    const inner = before.filter((x) => x.yolo).map((x) => x.id);
    const count = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
    const names = (ids) => (ids.length > 1 ? `${ids.slice(0, -1).join(", ")} and ${ids[ids.length - 1]}` : ids[0]);

function zap(id) {
  if (!lastLayout) return;
  const chain = [...upstreamOf(board, id)].filter((k) => cardEls.has(k) && lastLayout.pos.has(k) && IX.get(k).state !== "done");
  const along = (k) => (lastLayout.vertical ? lastLayout.pos.get(k).y : lastLayout.pos.get(k).x);
  const start = Math.min(...chain.map(along));
  for (const k of chain) {
    const el = cardEls.get(k);
    el.classList.remove("zap");
    void el.offsetWidth;
    el.style.animationDelay = `${Math.min(1200, (along(k) - start) * 0.9)}ms`;
    el.classList.add("zap");

// The panel sits left of the graph, so opening or closing it moves the viewport; the view shifts to keep the cards still.
function showPanel(panel, open) {
  if (panel.hidden === !open) return;

  const moved = open ? panel.offsetWidth : -closing;

const tabbables = (root) => [...root.querySelectorAll("a[href], button, input, textarea, select, [tabindex]")]
  .filter((el) => el.tabIndex >= 0 && !el.disabled && el.getClientRects().length);

  render();

function renderPanel() {

// Marking the open task done or sending it back in the board view opens the next task in review once the change is
// saved, so the human goes through the Review column one task after another. Undoing it comes back to the task.
async function review(t, state, note = "", onFail = null) {
  const flow = ui.view === "board" && same(ui.selected, t.id), before = edits.undo[edits.undo.length - 1];
  const said = document.createTextNode(moveWords(t.state, state)[0].replace("%", t.id));
  let failed = false;
  const ok = await undoable(ops.state(t.id, seenOf(t), state, note), said, { onFail: (e) => { failed = true; if (onFail) onFail(e); } });
  const entry = edits.undo[edits.undo.length - 1];
  if (!ok || !flow) return ok;
  await saveQueue;
  const field = document.activeElement;
  if (failed || ui.view !== "board" || !same(ui.selected, t.id) || ui.editingDesc || ui.editingNote
    || ($("#panel").contains(field) && field.matches("input:not([type=checkbox]), textarea, select"))) return ok;
  const next = nextReview(board, t.id, matches), left = board.tasks.filter((x) => x.state === "review").length;
  said.data += next ? `. Next to review: ${next.id}.` : left ? `. No more tasks to review in this view; ${left} more ${left === 1 ? "is" : "are"} filtered out.` : ". No more tasks to review.";
  if (!next) return ok;
  showCard(next.id);
  if (entry !== before) entry.onUndo = () => { if (ui.view === "board" && same(ui.selected, next.id)) showCard(t.id); };

}

// Opens a task with its card in sight. Focus on a card, or on nothing, as when its card went away, moves to its card;

function modal(title, content, { ok = "Save", danger = false, cancel = "Cancel", okClass = "" } = {}) {
  return new Promise((resolve) => {
    const okBtn = h("button", { value: "ok", class: okClass || (danger ? "danger primary" : "primary") }, ok);
    const form = h("form", { method: "dialog" }, h("h3", {}, title), content,
      h("div", { class: "dlg-actions" }, okBtn, cancel ? h("button", { value: "cancel", formnovalidate: true }, cancel) : null));
    const dlg = h("dialog", { class: "dlg", tabindex: "-1" }, form);
    form.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(okBtn); } });
    // Pressing a button leaves the focus where it is, so a field keeps its list (and the phone its keyboard) until the tap has landed.
    form.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
    dlg.addEventListener("close", () => {
      if (dlg.dataset.paused) return;
      const data = dlg.returnValue === "ok" ? new FormData(form) : null;
      dlg.remove();
      resolve(data);
    });
    document.body.append(dlg);
    showDialog(dlg);
  });
}

// Opens a dialog. With a mouse or keyboard the first field takes the focus; on a

}

    .then(async (r) => { const info = await r.json().catch(() => ({})); if (!r.ok) throw new Error(info.error || gone); return info; }, () => { throw new Error(gone); });
  const show = (info) => {

        h("a", { href: "https://github.com/XMihura/Kanvas#if-the-phone-cannot-connect", target: "_blank", rel: "noopener" }, "how, for each system"), "."),

// Multi-select of tasks: chips for the chosen ones above a filtered list, or
// clicks on the graph. `reason(t)` explains why t cannot be chosen, or returns null.
let pickers = 0;
function taskPicker({ chosen = [], placeholder, label, prompt, reason = () => null, onChange = () => {} }) {
  const picked = chosen.map(get).filter(Boolean).map((t) => t.id);
  const uid = `picker-${++pickers}`;
  const input = h("input", { autocomplete: "off", placeholder, "aria-label": label, role: "combobox", "aria-expanded": "false", "aria-autocomplete": "list", "aria-controls": `${uid}-list` });
  const box = h("div", { class: "pick-box", onclick: (e) => { if (!e.target.closest("button")) input.focus(); } });
  const list = h("div", { class: "pick-list", id: `${uid}-list`, role: "listbox", "aria-label": label, hidden: true, onmousedown: (e) => e.preventDefault() });
  let shown = [], active = 0;
  const isPicked = (t) => picked.some((id) => same(id, t.id));

  const drawChips = () => {
    for (let i = picked.length - 1; i >= 0; i--) if (!get(picked[i])) picked.splice(i, 1);
    box.replaceChildren(...picked.map((id) => {
      const t = get(id);
      return h("span", { class: `pick-chip s-${vstate(t)}`, title: `${t.id} · ${t.title}` },
        h("span", { class: "dot" }), h("span", { class: "cid" }, t.id), h("span", { class: "t" }, t.title),
        h("button", { type: "button", "aria-label": `Remove ${t.id}`, onclick: () => { picked.splice(picked.indexOf(id), 1); drawChips(); drawList(); input.focus(); } }, icon("x")));
    }), input);
    onChange();
  };

  const drawList = () => {
    const q = input.value.trim().toLowerCase();
    const text = (t) => `${t.id} ${t.title} ${(groupOf(t) || {}).name || ""}`.toLowerCase();
    const idMatch = (t) => (q && key(t.id).startsWith(key(q)) ? 0 : 1);
    shown = board.tasks.filter((t) => !isPicked(t) && (!q || text(t).includes(q)))
      .map((t) => ({ t, why: reason(t) }))
      .sort((a, b) => (!!a.why - !!b.why) || (idMatch(a.t) - idMatch(b.t)));
    if (active >= shown.length || (shown[active] && shown[active].why)) active = Math.max(0, shown.findIndex((x) => !x.why));
    list.replaceChildren(...compact(shown.map(({ t, why }, i) => {
      const g = groupOf(t);
      return h("div", { class: `pick-opt s-${vstate(t)}${i === active ? " on" : ""}${why ? " off" : ""}`, id: `${uid}-${t.id}`, role: "option", "aria-selected": String(i === active), "aria-disabled": why ? "true" : null, title: why || `${t.id} · ${LABEL[vstate(t)]}`, onclick: () => add(i), onmousemove: () => { if (active !== i && !why) { active = i; drawList(); } } },
        h("span", { class: "dot" }), h("span", { class: "cid" }, t.id), h("span", { class: "t" }, t.title),
        h("span", { class: "note" }, why || (g ? g.name : "")));
    }), shown.length ? null : h("div", { class: "pick-empty" }, q ? "No matching task" : "No other tasks")));
    const on = list.querySelector(".on");
    if (on) on.scrollIntoView({ block: "nearest" });
    if (on && !list.hidden) input.setAttribute("aria-activedescendant", on.id); else input.removeAttribute("aria-activedescendant");
  };
  const open = (yes) => { list.hidden = !yes; input.setAttribute("aria-expanded", String(yes)); if (yes) drawList(); else input.removeAttribute("aria-activedescendant"); };
  const add = (i) => {
    const x = shown[i];
    if (!x || x.why) return;
    picked.push(x.t.id);
    input.value = "";
    drawChips();
    drawList();
    input.focus();
  };

  input.addEventListener("focus", () => open(true));
  input.addEventListener("blur", () => open(false));
  input.addEventListener("input", () => { active = 0; open(true); });
  input.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const step = (d) => {
      for (let i = active + d; i >= 0 && i < shown.length; i += d) if (!shown[i].why) { active = i; break; }
      drawList();
    };
    if (e.key === "ArrowDown") { e.preventDefault(); if (list.hidden) open(true); else step(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
    else if (e.key === "Enter" && (!list.hidden || input.value)) { e.preventDefault(); add(active); }
    else if (e.key === "Escape" && !list.hidden) { e.preventDefault(); e.stopPropagation(); open(false); }
    else if (e.key === "Backspace" && !input.value && picked.length) { picked.pop(); drawChips(); drawList(); }
  });
  const self = {
    ids: picked, prompt, reason,
    has: (id) => picked.some((x) => same(x, id)),
    // Adds or removes a task; returns why it cannot be added, if so.
    toggle: (id) => {
      const t = get(id);
      if (!t) return null;
      const i = picked.findIndex((x) => same(x, id));
      if (i >= 0) picked.splice(i, 1);
      else { const why = reason(t); if (why) return why; picked.push(t.id); }
      drawChips();
      return null;
    },
    reset: (ids) => { picked.splice(0, picked.length, ...ids); drawChips(); },
  };
  const graphBtn = h("button", { type: "button", class: "ghost pick-graph", onclick: (e) => pickOnGraph(self, e.target.closest("dialog")) }, icon("graph"), "Pick on graph");
  self.el = h("div", { class: "picker" }, box, list, graphBtn);
  drawChips();
  return self;
}

// While picking, the dialog is closed but kept, and card clicks toggle tasks in the picker.
let picking = null;

function pickOnGraph(picker, dlg) {
  const view = ui.view;
  dlg.dataset.paused = "1";
  dlg.close();
  closeMenu();
  const count = h("b"), before = [...picker.ids];
  const bar = h("div", { class: "pick-bar", role: "status" },
    icon("graph"), h("span", {}, picker.prompt, " · ", count, " chosen"),
    h("span", { class: "hint" }, "Click cards to add or remove"),
    h("button", { onclick: () => picking.cancel() }, "Cancel"),
    h("button", { class: "primary", onclick: () => picking.finish() }, icon("check"), "Done"));
  picking = {
    picker, bar,
    update: () => { count.textContent = picker.ids.length; },
    cancel: () => { picker.reset(before); picking.finish(); },
    finish: () => {
      picking = null;
      bar.remove();
      document.body.classList.remove("picking");

}

// Tasks selected together for one action. While any are selected, clicks and taps on cards add or remove them.
const multi = new Set();
let multiBar = null;
const multiClick = (e) => !store.readOnly && !picking && (multi.size > 0 || e.ctrlKey || e.metaKey || e.shiftKey);

function toggleMulti(id) {
  if (store.readOnly || picking) return;
  const k = key(id);
  if (!multi.size && ui.selected && !same(ui.selected, id)) multi.add(key(ui.selected));
  if (multi.has(k)) multi.delete(k); else multi.add(k);
  if (ui.selected) select(null); else applyMulti();
}

function clearMulti() {
  multi.clear();
  applyMulti();
}

function applyMulti() {
  for (const k of [...multi]) if (!IX.has(k)) multi.delete(k);
  for (const el of document.querySelectorAll(".card[data-id], .kcard[data-id]")) el.classList.toggle("multi-on", multi.has(key(el.dataset.id)));
  rove();
  if (document.body.classList.contains("multi") !== multi.size > 0) {

// What the selected tasks can have done to them together, for the bar under them and their menu.
function multiActions() {
  const tasks = board.tasks.filter((t) => multi.has(key(t.id)));
  const proposals = tasks.filter((t) => vstate(t) === "proposed"), reviews = tasks.filter((t) => t.state === "review");
  // An action leaves the tasks it did not apply to selected, for the next one.
  const run = (fn, done) => () => fn(done).then((ok) => { if (ok) { for (const t of done) multi.delete(key(t.id)); applyMulti(); } });
  return {
    tasks,
    approve: proposals.length ? { label: `Approve ${proposals.length}`, icon: "check", run: run(approveMany, proposals) } : null,
    done: reviews.length ? { label: `Mark ${reviews.length} done`, icon: "check", run: run(doneMany, reviews) } : null,
    remove: { label: `Delete ${tasks.length}`, icon: "trash", danger: true, run: run(removeMany, tasks) },
  };
}

function pickToggle(id) {
  const why = picking.picker.toggle(id);

function applyPick() {
  for (const el of document.querySelectorAll(".card[data-id], .kcard[data-id]")) {
    const t = get(el.dataset.id), on = !!picking && !!t && picking.picker.has(t.id);

// Context menus ---------------------------------------------------------------

let menuEl = null;
let menuClosed = { el: null, at: 0 };

// With refocus, focus goes back to the button that opened the menu, so keyboard users keep their place.
function closeMenu(refocus = false) {
  if (!menuEl) return;
  const hadFocus = menuEl.contains(document.activeElement);
  menuEl.remove();
  menuEl = null;
  const target = document.querySelector(".menu-target");
  menuClosed = { el: target, at: Date.now() };
  for (const el of document.querySelectorAll(".menu-target")) {
    el.classList.remove("menu-target");
    if (el.matches(".edge")) markEdge(el);
    if (el.hasAttribute("aria-expanded")) el.setAttribute("aria-expanded", "false");
  }
  if (ui.link) { ui.link = null; applyFocus(); }
  if (refocus && hadFocus && target && target.isConnected && target.matches("button")) target.focus({ preventScroll: true });
}

// Items are { label, icon, run, danger }, { head }, { node } or "sep". With alignRight, x is the menu's right edge.
// A "dialog" holds other controls than menu items: Tab moves between them instead of closing it.
function openMenu(x, y, items, target, { alignRight = false, role = "menu", label = null, cls = "" } = {}) {
  closeMenu();
  const list = items.filter(Boolean).filter((it, i, all) => !(it === "sep" && (i === 0 || i === all.length - 1 || all[i - 1] === "sep")));
  menuEl = h("div", { class: `ctx-menu ${cls}`.trim(), role, tabindex: "-1", "aria-label": label }, list.map((it) => {
    if (it === "sep") return h("div", { class: "sep", role: "separator" });
    if (it.head) return h("div", { class: "ctx-head" }, it.head);
    if (it.node) return it.node;
    // Items with `checked` are choices, and say which one is current.
    const role = it.checked == null ? "menuitem" : "menuitemradio", checked = it.checked == null ? null : String(it.checked);
    if (it.href) {
      const go = (e) => { if (e.button || e.ctrlKey || e.metaKey || e.shiftKey) return; e.preventDefault(); closeMenu(); it.run(); };
      return h("a", { role, "aria-checked": checked, class: "item", href: it.href, onclick: go }, icon(it.icon), h("span", { class: "lbl" }, it.label));
    }
    return h("button", { role, "aria-checked": checked, class: it.danger ? "danger" : null, onclick: () => { closeMenu(true); it.run(); } }, icon(it.icon), h("span", { class: "lbl" }, it.label));
  }));
  menuEl.addEventListener("keydown", (e) => {
    e.stopPropagation();
    const controls = [...menuEl.querySelectorAll("button:not([disabled]), input, a[href]")];
    const n = controls.length, i = controls.indexOf(document.activeElement);
    const move = (d) => { e.preventDefault(); if (n) controls[i < 0 ? (d > 0 ? 0 : n - 1) : (i + d + n) % n].focus(); };
    if (e.key === "Escape") { e.preventDefault(); closeMenu(true); }
    else if (e.key === "Tab") { if (role === "menu") closeMenu(true); else move(e.shiftKey ? -1 : 1); }
    else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && document.activeElement.type !== "range") move(e.key === "ArrowDown" ? 1 : -1);
  });
  menuEl.addEventListener("contextmenu", (e) => e.preventDefault());
  document.body.append(menuEl);
  // Offset sizes leave out the scale of the opening animation.
  const r = { width: menuEl.offsetWidth, height: menuEl.offsetHeight };
  menuEl.style.left = `${Math.max(4, Math.min(alignRight ? x - r.width : x, innerWidth - r.width - 4))}px`;
  menuEl.style.top = `${Math.max(4, Math.min(y, innerHeight - r.height - 4))}px`;
  if (target) {
    target.classList.add("menu-target");
    if (target.hasAttribute("aria-haspopup")) target.setAttribute("aria-expanded", "true");
  }
  menuEl.focus({ preventScroll: true });
}

// A menu under a button. Pressing the button again closes it, since the press already closed the menu.
function dropdown(btn, items, { alignRight = false, cls = "", gap = 6, role = "menu", label = null } = {}) {
  if (menuClosed.el === btn && Date.now() - menuClosed.at < 400) return;
  const r = btn.getBoundingClientRect();
  openMenu(alignRight ? r.right : r.left, r.bottom + gap, items, btn, { alignRight, role, label, cls });
}

// Boards ----------------------------------------------------------------------

// One Kanvas serves every open board at an address of its own, /<name>/, so each can also have a tab.
let openBoards = [];
const boardHere = () => decodeURIComponent(location.pathname.split("/")[1] || "");
const boardUrl = (b) => `/${encodeURIComponent(b.name)}/`;
// A board without a title goes by the name in its address, as on the page that lists the boards. A file opened in
// the browser has no such name.
const boardLabel = () => board.title || (store?.kind === "server" ? boardHere() : store?.boardName) || "Kanvas";

async function refreshBoards() {
  if (store?.kind !== "server") return;
  try {
    const r = await fetch("/api/boards", { cache: "no-store" });
    if (r.ok) openBoards = (await r.json()).boards || [];
  } catch (e) { /* the sync status already shows a lost connection */ }
}

async function goToBoard(b) {
  // A save still on its way would be cut off by leaving the page.
  for (let i = 0; pending && i < 100; i++) await new Promise((r) => setTimeout(r, 50));
  location.assign(boardUrl(b));
}

// Opens a task, or a board when `id` is null, on this board or another one open here.
async function goTask(name, id = null) {
  if (!name || name === boardHere()) {
    if (id && get(id)) { select(get(id).id); reveal(get(id).id); }
    else if (id) toast(`${id} is no longer on this board`);
    return;
  }
  for (let i = 0; pending && i < 100; i++) await new Promise((r) => setTimeout(r, 50));
  location.assign(`/${encodeURIComponent(name)}/${id ? `#${encodeURIComponent(id)}` : ""}`);
}

// The other boards open here, read every few seconds so their agents' activity shows on this page too.
const others = new Map(); // name -> { title, board, etag }
const OTHERS_MS = 3000;
async function watchOthers() {
  if (store?.kind === "server" && document.visibilityState === "visible") {
    const names = new Set(openBoards.map((b) => b.name));
    for (const name of others.keys()) if (!names.has(name)) others.delete(name);
    for (const info of openBoards) {
      if (info.name === boardHere()) continue;
      const seen = others.get(info.name);
      try {
        const r = await fetch(`/${encodeURIComponent(info.name)}/api/board`, { cache: "no-store", headers: seen?.etag ? { "If-None-Match": seen.etag } : {} });
        if (r.status === 304) { seen.title = info.title; continue; }
        if (!r.ok) continue;
        const fresh = normalize(JSON.parse(await r.text())), title = fresh.title || info.name;
        if (seen) {
          const before = new Map(seen.board.tasks.map((t) => [key(t.id), t])), now = new Set(fresh.tasks.map((t) => key(t.id)));
          const moves = fresh.tasks.filter((t) => moved(before.get(key(t.id)), t)).map((t) => [t, before.get(key(t.id))]);
          const withdrawn = [...before.values()].filter((t) => t.state === "proposed" && !now.has(key(t.id)));
          announce(moves, withdrawn, { name: info.name, title }, fresh);
        }
        others.set(info.name, { title, board: fresh, etag: r.headers.get("ETag") });
      } catch (e) { /* a board that cannot be read now is tried again next time */ }
    }
    renderInboxButton();
  }
  setTimeout(watchOthers, OTHERS_MS);
}

// What waits for the human, latest first: agents waiting for a reply in their chat, then work to review. Proposals
// stay out: plans bring many, often approved much later.
function waitingIn(b) {
  const lastAt = (t) => (t.notes.length ? Date.parse(t.notes[t.notes.length - 1].at) || 0 : 0);
  const latest = (x, y) => lastAt(y.t) - lastAt(x.t);
  return [
    ...b.tasks.filter(openQuestion).map((t) => ({ t, state: "ask" })).sort(latest),
    ...b.tasks.filter((t) => t.state === "review").map((t) => ({ t, state: "review" })).sort(latest),
  ];
}

// This board first, then the others in the order Kanvas lists them.
function inboxBoards() {
  if (!board) return [];
  const here = { name: boardHere(), title: boardLabel(), board, here: true };
  return [here, ...openBoards.filter((b) => b.name !== here.name && others.has(b.name)).map((b) => ({ name: b.name, ...others.get(b.name) }))];
}

// The inbox keeps nothing of its own: it reads the boards, so every browser and device shows the same.
function renderInboxButton() {
  if (!board) return;
  const items = inboxBoards().flatMap((b) => waitingIn(b.board)), n = items.length;
  const asks = items.filter((x) => x.state === "ask").length, reviews = n - asks;
  // The tab's title counts the agents waiting for a reply, so the tab shows them while the human is elsewhere.
  const name = boardLabel();
  document.title = `${asks && !store?.readOnly ? `(${asks}) ` : ""}${name === "Kanvas" ? name : `${name} · Kanvas`}`;
  const btn = $("#inbox");
  if (!btn) return;
  btn.hidden = !!store?.readOnly;
  btn.replaceChildren(...compact(icon("bell"), n ? h("b", {}, n) : null));
  btn.dataset.tip = compact(asks ? `${asks} agent${asks === 1 ? " waits" : "s wait"} for your reply` : null,
    reviews ? `${reviews} task${reviews === 1 ? "" : "s"} to review` : null).join(", ") || "Nothing waits for you";
  btn.setAttribute("aria-label", `Inbox: ${btn.dataset.tip}`);
  if (inboxBody?.isConnected) fillInbox(inboxBody);
}

let inboxBody = null;
function inboxMenu() {
  inboxBody = h("div", { class: "inbox-body" });

}

// Rebuilt only when the list changes, so a row keeps keyboard focus while other boards are polled.
function fillInbox(node) {
  const go = (name, id) => () => { closeMenu(); goTask(name, id); };
  const boards = inboxBoards(), several = boards.length > 1;
  const sections = boards.map((b) => ({ b, items: waitingIn(b.board) })).filter((s) => s.items.length);
  const sig = JSON.stringify(sections.map((s) => [s.b.name, s.items.map(({ t, state }) => [t.id, t.title, t.notes.length, state])]));
  if (node.dataset.sig === sig) return;
  node.dataset.sig = sig;
  const row = (b, { t, state }) => {
    const last = t.notes[t.notes.length - 1], by = String((last && last.by) || "?");
    return h("button", { type: "button", class: "ib-row", onclick: go(b.name, t.id) },
      h("span", { class: `badge s-${state}` }, LABEL[state]),
      h("span", { class: "ib-main" }, h("span", { class: "ib-title" }, h("span", { class: "cid" }, t.id), " ", t.title),
        state === "ask" ? h("span", { class: "ib-q" }, questionText(last)) : null,
        last ? h("span", { class: "ib-sub" }, agentMark(by), state === "ask" ? `${by} · ${ago(last.at)} · reply in its chat` : `${by} · ${ago(last.at)}`) : null));
  };

  node.replaceChildren(...compact(

  ));
}

// The menu for what is under (x, y): a card, an arrow or empty space. Returns whether one opened.
function contextMenuAt(el, x, y) {
  let items = null, target = null;

  const hit = el.closest("#edge-hits path");

function setupMenus() {
  document.addEventListener("contextmenu", (e) => {
    // Android also sends contextmenu for a long press, which the graph and the board handle themselves. It may come
    // as the finger lifts, by when the menu that the press opened lies under it.
    if ((cardPress || Date.now() - longPress.at < 1500) && e.target.closest("#viewport, #kanban, .ctx-menu")) { e.preventDefault(); return; }
    longPress.cancel();
    closeMenu();
    const el = e.target;
    if (picking && el.closest("#graph-view, #board-view")) { e.preventDefault(); return; }
    if (!board || !el.closest("#graph-view, #board-view") || el.closest("button:not(.stub), input, a, .zoombar, .empty")) return;
    if (contextMenuAt(el, e.clientX, e.clientY)) e.preventDefault();
  });
  document.addEventListener("pointerdown", (e) => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);
  const close = () => closeMenu();
  document.addEventListener("scroll", (e) => { if (!menuEl || !menuEl.contains(e.target)) close(); }, true);
  $("#viewport").addEventListener("wheel", close, { passive: true });
  window.addEventListener("resize", close);
  window.addEventListener("blur", close);
}

// Markdown (a small, safe subset) ---------------------------------------------------

function inlineMd(src) {
  // URLs may hold parentheses in balanced pairs, nested two deep, as in https://en.wikipedia.org/wiki/Foo_(bar).
  // Images are links like the others, so nothing loads from the network. Only the board's own images show.
  const re = /`([^`]+)`|(!?\[)|(https?:\/\/(?:[^\s<>()]|\((?:[^\s<>()]|\([^\s<>()]*\))*\))+(?:[^\s<>().,;:!?'"]|\((?:[^\s<>()]|\([^\s<>()]*\))*\)))/g;
  const dest = /\]\(((?:[^()\s]|\((?:[^()\s]|\([^()\s]*\))*\))+)\)/y;
  let out = "", last = 0, m;
  // Emphasis runs to the first closer after its opener. An opener without one takes the rest of the line along
  // unchanged, since the openers in it have none either, so no opener scans the line again.
  const em = (whole, before, text, closer) => (closer ? `${before}<em>${text}</em>` : whole);
  const fmt = (s, refs = true) => escHtml(s)
    .replace(/\*\*(.+?)\*\*/gs, "<strong>$1</strong>")
    .replace(/(^|[^\w*])\*(?!\s)(.+?)(\*(?!\w)|(?!.))/gs, em)
    .replace(/(^|[^\w])_(?!\s)(.+?)(_(?!\w)|(?!.))/gs, em)
    .replace(/~~(.+?)~~/gs, "<del>$1</del>")
    .replace(/\b([A-Za-z][A-Za-z0-9]*-\d+)\b/g, (whole, id) => (refs && get(id) ? `<a class="tref" href="#${escHtml(get(id).id)}" data-ref="${escHtml(get(id).id)}">${whole}</a>` : whole));
  const anchor = (href, html) => `<a href="${escHtml(href)}" target="_blank" rel="noopener noreferrer">${html}</a>`;
  // An anchor cannot hold another, so task IDs in link text stay plain. Without text, the URL names the link.
  const link = (href, text) => {
    const ok = /^(https?:|mailto:)/i.test(href), html = text ? fmt(text, !ok) : escHtml(href);
    return ok ? anchor(href, html) : html;
  };
  // A URL of several megabytes overflows the stack of the regex engine. It then stays text, and so may the links and
  // code after it on its line.
  const exec = (r) => { try { return r.exec(src); } catch (e) { return null; } };
  // A link's text runs to the first "]" after its "[", so all the brackets before one "]" share one look past it.
  let close = -1, target = null;
  while ((m = exec(re))) {
    const open = re.lastIndex - 1;
    if (m[2] && close < open) {
      close = src.indexOf("]", open);
      if (close < 0) close = src.length;
      dest.lastIndex = close;
      target = exec(dest);
    }
    if (m[2] && !target) { re.lastIndex = m.index + 1; continue; }
    out += fmt(src.slice(last, m.index));
    if (m[1] != null) out += `<code>${escHtml(m[1])}</code>`;
    else if (m[2]) {
      const text = src.slice(open + 1, close), img = m[2] === "![" ? imageSrc(target[1]) : null;
      out += img ? `<img src="${escHtml(img)}" alt="${escHtml(text)}" loading="lazy">` : link(target[1], text);
      re.lastIndex = close + target[0].length;
    }
    else out += anchor(m[3], escHtml(m[3]));
    last = re.lastIndex;
  }
  return out + fmt(src.slice(last));
}

function markdown(src, depth = 0) {
  // Only \n, \r\n and \r end lines. U+2028 and U+2029 belong to their line, like a no-break space, so every pattern
  // in this section that takes text with "." has the s flag, which lets "." match them.
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  let html = "", i = 0;
  // Quotes nest six deep at most, like lists, so that no description can nest deep enough to overflow the stack.
  // Deeper markers are text.
  const quoted = (l) => depth < 6 && /^>\s?/.test(l);
  const isBlockStart = (l) => quoted(l) || /^(```|#{1,6}\s|\s*([-*+]|\d+[.)])\s+|(-{3,}|\*{3,})\s*$)/.test(l);
  // A table starts with a row of cells over a row of dashes, one per cell, with colons for the alignment.
  const tableAt = (k) => {
    if (k + 1 >= lines.length || !lines[k + 1].includes("|")) return null;
    const head = tableCells(lines[k]), delims = tableCells(lines[k + 1]);
    return delims.length === head.length && delims.every((c) => /^:?-+:?$/.test(c)) ? { head, delims } : null;
  };
  while (i < lines.length) {
    const line = lines[i];
    let m, table;
    if (/^```/.test(line)) {
      const code = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
      i++;
      html += `<pre><code>${escHtml(code.join("\n"))}</code></pre>`;
    } else if ((m = /^(#{1,6})\s+(.*)$/s.exec(line))) {
      const lvl = Math.min(6, m[1].length + 2);
      html += `<h${lvl}>${inlineMd(m[2])}</h${lvl}>`;
      i++;
    } else if (/^(-{3,}|\*{3,})\s*$/.test(line)) {
      html += "<hr>";
      i++;
    } else if (quoted(line)) {
      const quote = [];
      for (; i < lines.length && quoted(lines[i]); i++) quote.push(lines[i].replace(/^>\s?/, ""));
      html += `<blockquote>${markdown(quote.join("\n"), depth + 1)}</blockquote>`;
    } else if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const items = [];
      for (; i < lines.length; i++) {
        const lm = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/s.exec(lines[i]);
        if (lm) items.push({ indent: lm[1].replace(/\t/g, "    ").length, ordered: /\d/.test(lm[2]), text: lm[3], lists: [] });
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) items[items.length - 1].text += " " + lines[i].trim();
        else break;
      }
      html += listHtml(items);
    } else if (!line.trim()) {
      i++;
    } else if ((table = tableAt(i))) {
      const align = table.delims.map((c) => (/^:-+:$/.test(c) ? "center" : /^:/.test(c) ? "left" : /:$/.test(c) ? "right" : null));
      const row = (cells, tag) => `<tr>${table.head.map((_, k) => `<${tag}${align[k] ? ` style="text-align: ${align[k]}"` : ""}>${inlineMd(cells[k] || "")}</${tag}>`).join("")}</tr>`;
      const body = [];
      for (i += 2; i < lines.length && lines[i].includes("|") && !isBlockStart(lines[i]); i++) body.push(row(tableCells(lines[i]), "td"));
      html += `<div class="table"><table><thead>${row(table.head, "th")}</thead>${body.length ? `<tbody>${body.join("")}</tbody>` : ""}</table></div>`;
    } else {
      const para = [];
      for (; i < lines.length && lines[i].trim() && !isBlockStart(lines[i]) && !tableAt(i); i++) para.push(inlineMd(lines[i]));
      if (!para.length) { para.push(inlineMd(lines[i])); i++; }
      html += `<p>${para.join("<br>")}</p>`;
    }
  }
  return html;
}

// Renders list items as lists. An item two or more columns deeper than the one above it starts a list inside
// that one, and a switch between bullets and numbers starts a new list. Lists nest six deep at most, so that
// no description can nest deep enough to overflow the stack.
function listHtml(items) {
  const stack = [{ indent: items[0].indent, lists: [] }], top = () => stack[stack.length - 1];
  for (const it of items) {
    while (stack.length > 1 && it.indent <= stack[stack.length - 2].indent + 1) stack.pop();
    const list = top().lists[top().lists.length - 1], prev = list && list.items[list.items.length - 1];
    if (prev && it.indent > top().indent + 1 && stack.length < 6) stack.push({ indent: it.indent, lists: prev.lists });
    const lists = top().lists, last = lists[lists.length - 1];
    if (last && last.ordered === it.ordered) last.items.push(it);
    else lists.push({ ordered: it.ordered, items: [it] });
  }
  const render = (lists) => lists.map(({ ordered, items }) => (ordered ? "<ol>" : "<ul>") + items.map((it) => {
    const cb = /^\[([ xX])\]\s+(.*)$/s.exec(it.text), sub = render(it.lists);
    return cb ? `<li class="task"><input type="checkbox" disabled${cb[1] !== " " ? " checked" : ""}> ${inlineMd(cb[2])}${sub}</li>` : `<li>${inlineMd(it.text)}${sub}</li>`;
  }).join("") + (ordered ? "</ol>" : "</ul>")).join("");
  return render(stack[0].lists);
}

// The cells of a table row, without its outer pipes; \| is a pipe inside a cell.
function tableCells(line) {
  const s = line.trim(), cells = [""];
  let edge = false;
  for (let k = 0; k < s.length; k++) {
    edge = s[k] === "|";
    if (s[k] === "\\" && s[k + 1] === "|") cells[cells.length - 1] += s[++k];
    else if (edge) cells.push("");
    else cells[cells.length - 1] += s[k];
  }
  if (s[0] === "|") cells.shift();
  if (edge && cells.length > 1) cells.pop();
  return cells.map((c) => c.trim());
}

// The task-list items that markdown() renders as checkboxes, in the same order: each one's text, whether
// it is checked, and where its mark (the character between the brackets) sits in `src`.
function taskItems(src) {
  const parts = String(src).split(/(\r\n?|\n)/), rows = [], items = [];
  for (let k = 0, at = 0; k < parts.length; k += 2) {
    rows.push({ line: parts[k], at });
    at += parts[k].length + (parts[k + 1] || "").length;
  }
  const scan = (rows, depth) => {
    for (let i = 0; i < rows.length;) {
      let m;
      if (/^```/.test(rows[i].line)) {
        for (i++; i < rows.length && !/^```/.test(rows[i].line); i++);
        i++;
      } else if (depth < 6 && /^>\s?/.test(rows[i].line)) {
        const quote = [];
        for (; i < rows.length && (m = /^>\s?/.exec(rows[i].line)); i++) quote.push({ line: rows[i].line.slice(m[0].length), at: rows[i].at + m[0].length });
        scan(quote, depth + 1);
      } else if (/^\s*([-*+]|\d+[.)])\s+/.test(rows[i].line)) {
        const list = [];
        for (; i < rows.length; i++) {
          const { line, at } = rows[i], lm = /^\s*([-*+]|\d+[.)])\s+(.*)$/s.exec(line);
          if (lm) list.push({ text: lm[2], at: at + line.length - lm[2].length });
          else if (/^\s{2,}\S/.test(line) && list.length) list[list.length - 1].text += " " + line.trim();
          else break;
        }
        for (const it of list) {
          const cb = /^\[([ xX])\]\s+(.*)$/s.exec(it.text);
          if (cb) items.push({ text: cb[2], checked: cb[1] !== " ", at: it.at + 1 });
        }
      } else i++;
    }
  };
  scan(rows, 0);
  return items;
}

// The board's images are kept next to it, in kanvas-files/ with names made from a hash of their bytes. The store
// says where the page finds one: the server serves them, a snapshot carries them, and a board opened from a file
// cannot reach them, so they stay text there.
const FILE_REF = /^kanvas-files\/[0-9a-f]{16}\.(png|jpg|gif|webp)$/;
function imageSrc(ref) {
  const s = typeof store === "undefined" ? null : store;
  return FILE_REF.test(ref) && s && s.imageUrl ? s.imageUrl(ref) : null;
}

// Checks or unchecks the `rank`-th item that reads `text` and keeps the rest of `src` as it is.
// Returns null when there is no such item any more.
function toggleTask(src, text, rank, checked) {
  const item = taskItems(src).filter((x) => x.text === text)[rank];
  if (!item) return null;
  return item.checked === checked ? src : src.slice(0, item.at) + (checked ? "x" : " ") + src.slice(item.at + 1);
}

function showWelcome() {
  const w = $("#welcome");
  const canPick = "showOpenFilePicker" in window;
  const fileInput = h("input", { type: "file", accept: ".json,application/json", hidden: true });
  fileInput.addEventListener("change", () => fileInput.files[0] && openFromFile(fileInput.files[0]));
  w.replaceChildren(h("div", { class: "welcome-card" },
    h("h1", {}, $(".logo").cloneNode(true), "Kanvas"),
    h("p", {}, "A task board you share with your AI agents. Open your board file to plan, approve and review work."),
    h("div", { class: "row" },
      h("button", { class: "primary", onclick: () => (canPick ? pickFile() : fileInput.click()) }, icon("folder-open"), "Open kanvas.json"),
      h("button", { onclick: () => open(memoryStore("kanvas.json", { kanvas: 1, title: "New board", groups: [], tasks: [] })) }, icon("plus"), "Start an empty board")),
    h("div", { class: "drop" }, "or drop the file here"),
    h("p", {}, canPick
      ? "Changes are written straight back to the file, and agent changes show up live."
      : "This browser cannot write files directly: changes stay in the tab until you save them."),
    h("p", {}, "Live sync in any browser: ", serveHint("run ")),
    fileInput));
  w.hidden = false;
  w.addEventListener("dragover", (e) => { e.preventDefault(); w.classList.add("drag"); });
  w.addEventListener("dragleave", () => w.classList.remove("drag"));
  w.addEventListener("drop", async (e) => {
    e.preventDefault();
    w.classList.remove("drag");
    const item = [...e.dataTransfer.items].find((it) => it.kind === "file");
    if (!item) return;
    if (item.getAsFileSystemHandle) {
      const handle = await item.getAsFileSystemHandle();
      if (handle && handle.kind === "file" && (await grant(handle))) return openHandle(handle);
    }
    openFromFile(item.getAsFile());
  });
}

async function grant(handle) {
  try {
    if ((await handle.queryPermission({ mode: "readwrite" })) === "granted") return true;
    return (await handle.requestPermission({ mode: "readwrite" })) === "granted";
  } catch (e) { return false; }
}

async function pickFile() {
  try {
    const [handle] = await window.showOpenFilePicker({ types: [{ description: "Kanvas board", accept: { "application/json": [".json"] } }] });
    if (await grant(handle)) openHandle(handle);
    else openFromFile(await handle.getFile());
  } catch (e) {
    if (e.name !== "AbortError") toast(e.message, "error");
  }
}

async function openHandle(handle) {
  try { await open(fileStore(handle)); } catch (e) { toast(`Cannot open ${handle.name}: ${e.message}`, "error"); }
}

async function openFromFile(file) {
  try { await open(memoryStore(file.name, JSON.parse(await file.text()))); } catch (e) { toast(`Cannot open ${file.name}: ${e.message}`, "error"); }
}

function download() {
  const a = h("a", { href: URL.createObjectURL(new Blob([serialize(board)], { type: "application/json" })), download: store.name || "kanvas.json" });
  a.click();
  // Some browsers start the download after click() returns, and need the URL until then.
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  store.dirty = false;
  setSync("ok");
}

// With no theme chosen, the page follows the system setting, also when it changes.
const systemDark = matchMedia("(prefers-color-scheme: dark)");
const applyTheme = () => { document.documentElement.dataset.theme = prefs.theme || (systemDark.matches ? "dark" : "light"); };
function setThemePref(theme) { prefs.theme = theme; savePrefs(); applyTheme(); }

// Images pasted or dropped into a description or note are kept next to the board, and their Markdown goes in at the
// cursor. Clicking an image shows it at full size.
const IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
const imageFiles = (dt) => [...(dt && dt.files) || []].filter((f) => f.type.startsWith("image/"));
const takesImages = (el) => el instanceof HTMLTextAreaElement && !el.readOnly && !el.disabled && !el.matches(".p-title");

async function insertImages(ta, files) {
  if (!store || !store.upload || store.readOnly) {
    toast("Images need the board opened through kanvas serve", "error");
    return;
  }
  const before = ta.value, start = ta.selectionStart, end = ta.selectionEnd, marks = [];
  ta.classList.add("uploading");
  for (const f of files) {
    try {
      if (!IMAGE_TYPES.includes(f.type)) throw new Error("only PNG, JPEG, GIF and WebP images can be attached");
      const alt = (f.name || "").replace(/\.[^.]*$/, "").replace(/[[\]]/g, "") || "image";
      marks.push(`![${alt}](${await store.upload(f)})`);
    } catch (e) {
      toast(`Cannot attach ${f.name || "the image"}: ${e.message}`, "error");
    }
  }
  ta.classList.remove("uploading");
  if (!marks.length) return;
  // The panel may have drawn the editor again meanwhile; its text then went to the new one.
  if (!ta.isConnected) ta = document.querySelector(`textarea[aria-label="${ta.getAttribute("aria-label")}"]`) || ta;
  if (!ta.isConnected) return toast("The editor closed before the image was ready", "error");
  const [from, to] = ta.value === before ? [start, end] : [ta.selectionStart, ta.selectionEnd];
  const lead = from > 0 && ta.value[from - 1] !== "\n" ? "\n" : "", tail = to < ta.value.length && ta.value[to] !== "\n" ? "\n" : "";
  ta.focus();
  ta.setRangeText(lead + marks.join("\n") + tail, from, to, "end");
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}

function showImage(img) {
  const dlg = h("dialog", { class: "lightbox", "aria-label": img.alt || "Image" }, h("img", { src: img.src, alt: img.alt }));
  dlg.addEventListener("click", () => dlg.close());
  dlg.addEventListener("close", () => dlg.remove());
  document.body.append(dlg);
  dlg.showModal();
}

function setupImages() {
  document.addEventListener("paste", (e) => {
    const files = imageFiles(e.clipboardData);
    if (!takesImages(e.target) || !files.length) return;
    e.preventDefault();
    insertImages(e.target, files);
  });
  document.addEventListener("dragover", (e) => {
    if (takesImages(e.target) && e.dataTransfer.types.includes("Files")) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; }
  });
  document.addEventListener("drop", (e) => {
    const files = imageFiles(e.dataTransfer);
    if (!takesImages(e.target) || !files.length) return;
    e.preventDefault();
    insertImages(e.target, files);
  });
  document.addEventListener("click", (e) => {
    const img = e.target.closest && e.target.closest(".md img");
    if (img) { e.preventDefault(); showImage(img); }
  });
}

// Tooltips for controls with data-tip: the control's name and its shortcut, shown sooner than the browser's own.
function setupTips() {
  const tip = h("div", { class: "tip", role: "tooltip" });
  let timer = 0, current = null, hiddenAt = 0;
  const hide = () => {
    clearTimeout(timer);
    if (tip.isConnected) { tip.remove(); hiddenAt = Date.now(); }
    current = null;
  };
  const show = (el) => {
    if (!el.isConnected || menuEl) return;
    tip.replaceChildren(el.dataset.tip, el.dataset.key ? h("kbd", {}, keyLabel(el.dataset.key)) : "");
    document.body.append(tip);
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    const above = r.bottom + t.height + 10 > innerHeight;
    tip.style.left = `${clamp(r.left + r.width / 2 - t.width / 2, 6, innerWidth - t.width - 6)}px`;
    tip.style.top = `${above ? r.top - t.height - 7 : r.bottom + 7}px`;
  };
  document.addEventListener("pointerover", (e) => {
    const el = e.target.closest("[data-tip]");
    if (el === current) return;
    hide();
    if (!el || e.pointerType === "touch") return;
    current = el;
    timer = setTimeout(() => show(el), Date.now() - hiddenAt < 500 ? 0 : 400);
  });
  document.addEventListener("focusin", (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el || el !== e.target || !el.matches(":focus-visible")) return;
    hide();
    current = el;
    timer = setTimeout(() => show(el), 150);
  });
  document.addEventListener("focusout", (e) => { if (e.target === current) hide(); });
  for (const type of ["pointerdown", "keydown", "scroll", "wheel"]) document.addEventListener(type, hide, { capture: true, passive: true });
  window.addEventListener("blur", hide);
}

function setupChrome() {
  for (const el of document.querySelectorAll("[data-icon]")) el.prepend(icon(el.dataset.icon));
  $("#display").append(icon("chevron"));
  applyTheme();
  systemDark.addEventListener("change", () => { if (!prefs.theme) applyTheme(); });
  setupTips();
  setupImages();
  $("#view-graph").onclick = () => setView("graph");
  $("#view-board").onclick = () => setView("board");
  phone.addEventListener("change", () => { if (board && !picking && ui.view !== prefs[viewPref()]) setView(prefs[viewPref()], false); });
  // Phone keyboards shrink only the visual viewport, so dialogs size themselves to it.
  const vv = window.visualViewport;
  if (vv) {
    const fitViewport = () => {
      document.documentElement.style.setProperty("--vv-top", `${vv.offsetTop}px`);
      document.documentElement.style.setProperty("--vv-height", `${vv.height}px`);
    };
    vv.addEventListener("resize", fitViewport);
    vv.addEventListener("scroll", fitViewport);
    fitViewport();
  }
  $("#display").onclick = (e) => dropdown(e.currentTarget, displayMenu(), { alignRight: true, cls: "dpop", role: "dialog", label: "Display options" });
  $("#hide-done").onclick = toggleDone;
  $("#inbox").onclick = (e) => dropdown(e.currentTarget, inboxMenu(), { alignRight: true, cls: "inbox-pop", role: "dialog", label: "Inbox" });
  $("#group-filter").onclick = (e) => dropdown(e.currentTarget, groupFilterMenu(), { role: "dialog", label: "Filter by group" });
  $("#filter").onclick = (e) => dropdown(e.currentTarget, filterMenu(), { role: "dialog", label: "Filters" });
  prefs.levelGap = clamp(Math.round(+prefs.levelGap || 70), LEVEL_GAP.min, LEVEL_GAP.max);
  Object.assign($("#spread"), { min: LEVEL_GAP.min, max: LEVEL_GAP.max, value: prefs.levelGap });
  $("#spread").addEventListener("input", (e) => setLevelGap(+e.target.value));
  $("#undo").onclick = () => step("undo");
  $("#redo").onclick = () => step("redo");
  $("#new-task").onclick = () => newTaskDialog();
  $("#help").onclick = helpDialog;
  $("#download").onclick = download;
  const search = $("#search");
  search.addEventListener("input", () => { ui.search = search.value; render(); });
  search.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { search.value = ""; ui.search = ""; search.blur(); render(); }
    if (e.key === "Enter") { const first = board.tasks.find(matches); if (first) select(first.id); }
  });
  const panel = $("#panel");
  // Re-rendering while focus moves to a panel button would swallow that click.
  panel.addEventListener("focusout", (e) => {
    if (e.relatedTarget && e.relatedTarget !== panel && panel.contains(e.relatedTarget)) return;
    setTimeout(() => { if (ui.panelStale) renderPanel(); }, 0);
  });
  // Tabbing onto a card selects it. Clicks select by themselves, and while several cards are selected they add or remove one.
  for (const list of [$("#cards"), $("#kanban")]) list.addEventListener("focusin", (e) => {
    const el = e.target.closest(".card[data-id], .kcard[data-id]");
    if (!el || quietFocus || picking || multi.size || !el.matches(":focus-visible")) return;
    if (same(el.dataset.id, ui.selected)) reveal(el.dataset.id); else select(el.dataset.id);
  });
  // Tab goes round the panel's controls; Escape leaves the panel.
  panel.addEventListener("keydown", (e) => {
    if (e.key !== "Tab" || e.ctrlKey || e.metaKey || e.altKey) return;
    const all = tabbables(panel), i = all.indexOf(document.activeElement);
    const wrap = e.shiftKey ? i <= 0 && all[all.length - 1] : i === all.length - 1 && all[0];
    if (wrap) { e.preventDefault(); wrap.focus(); }
  });
  document.addEventListener("keydown", (e) => {
    if (!board || document.querySelector("dialog[open]")) return;
    if (menuEl && e.key === "Escape") { e.preventDefault(); closeMenu(true); return; }    if (picking) {
      if (e.key === "Escape") { e.preventDefault(); picking.cancel(); return; }
      if (e.key === "Enter" && !e.target.closest("button")) { e.preventDefault(); picking.finish(); return; }
      if (e.ctrlKey || e.metaKey || ["n", "?", "/", "h"].includes(e.key.toLowerCase())) return;
    }
    // Inside text fields, Ctrl+Z stays the browser's own text undo.
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.target.closest("input, textarea, select, [contenteditable]")) {
      const k = e.key.toLowerCase();
      if (k === "z" || k === "y") { e.preventDefault(); step(k === "y" || e.shiftKey ? "redo" : "undo"); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest("input, textarea, select, [contenteditable]")) return;
    if (e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight") && store?.kind === "server") {
      e.preventDefault();
      switchBoard(e.key === "ArrowRight" ? 1 : -1);
      return;
    }
    if (e.key.startsWith("Arrow") && !e.shiftKey) {
      if (!picking && !menuEl) { e.preventDefault(); moveSelection(e.key); }
      return;
    }
    // Enter moves into the selected task's panel, and Escape comes back out to its card before it closes the panel.
    if (e.key === "Enter" && ui.selected && !panel.hidden && !picking && !e.target.closest("button, a, #panel")) {
      e.preventDefault();
      panel.focus({ preventScroll: true });
      return;
    }
    if (e.key === "Escape" && panel.contains(e.target)) {
      e.preventDefault();
      const card = shownCard(ui.selected);
      if (card) focusCard(card); else e.target.blur();
      return;
    }
    if (!picking && !menuEl && taskKey(e.key)) { e.preventDefault(); return; }
    const r = $("#viewport").getBoundingClientRect();
    const actions = {
      "/": () => search.focus(), n: () => newTaskDialog(), g: () => setView("graph"), b: () => setView("board"),
      h: toggleDone, l: toggleOrient, m: () => ui.view === "graph" && toggleArrange(), f: () => fit(true), "?": helpDialog,
      "[": () => setLevelGap(prefs.levelGap - 30), "]": () => setLevelGap(prefs.levelGap + 30),
      "+": () => zoomAt(1.2, r.width / 2, r.height / 2), "=": () => zoomAt(1.2, r.width / 2, r.height / 2), "-": () => zoomAt(1 / 1.2, r.width / 2, r.height / 2),
      Escape: () => { if (ui.selected) select(null); else if (multi.size) clearMulti(); else if (ui.states.size || ui.groups.size || ui.search) { if (ui.groups.size) fitted = false; ui.states.clear(); ui.groups.clear(); ui.search = ""; search.value = ""; render(); } },
    };
    const fn = actions[e.key] || actions[e.key.toLowerCase()];
    if (fn) { e.preventDefault(); fn(); }
  });
  window.addEventListener("resize", () => { if (ui.view === "graph" && !fitted) fit(false); });
  window.addEventListener("hashchange", () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (board && id && get(id) && !same(id, ui.selected)) select(id);
    else if (board && !id && ui.selected) select(null);
  });
  setInterval(() => { if (board && ui.view === "graph") for (const t of board.tasks) if (t.notes.length && cardEls.has(key(t.id))) fillCard(cardEls.get(key(t.id)), t); }, 60000);
  setupGraphInput();
  setupBoardInput();
  setupMenus();
}

// Keys that act on the selected task, through the same moves as its menu.
function taskKey(key) {
  if (multi.size && !store.readOnly) {
    const k = key === "Delete" || key === "Backspace" ? "Delete" : key.toLowerCase();
    const label = { a: "Approve", d: "Mark", Delete: "Delete" }[k];
    const btn = label && multiBar && [...multiBar.querySelectorAll("button")].find((b) => b.textContent.startsWith(label));
    if (btn) btn.click();
    else if (label) toast(`${label === "Mark" ? "Mark done" : label} doesn't apply to the selected tasks`);
    return !!label;
  }
  const t = ui.selected && get(ui.selected);
  if (!t || store.readOnly) return false;
  if (key === "Delete" || key === "Backspace") { removeTask(t); return true; }
  const k = key.toLowerCase();
  if (k === "e") {
    const title = $("#panel .p-title");
    if (!title) return false;
    title.focus();
    title.select();
    return true;
  }
  const want = { a: "Approve", s: "Start", d: "Mark done", p: "Pause" }[k];
  if (!want) return false;
  const move = stateMoves(t).find((m) => m.label === want);
  if (move) move.run();
  else toast(`${want} doesn't apply to ${t.id}, which is ${LABEL[vstate(t)].toLowerCase()}`);
  return true;
}

// With remember off, the view changes for now and the next visit opens the one chosen before.
function setView(v, remember = true) {  ui.view = v;
  if (remember) { prefs[viewPref()] = v; savePrefs(); }
  render();
  if (v === "graph" && !fitted) fit(false);
}

function toggleOrient() {
  prefs.orient = prefs.orient === "vertical" ? "horizontal" : "vertical";
  savePrefs();
  fitted = false;
  render();
}

// Task ids in an order that makes the manual layout show what the automatic one shows now.
function automaticOrder() {
  const tasks = board.tasks.filter((t) => !(prefs.hideDone && t.state === "done"));
  const L = layout(tasks, board, { vertical: prefs.orient === "vertical", levelGap: prefs.levelGap });
  const across = (t) => (L.vertical ? L.pos.get(key(t.id)).x : L.pos.get(key(t.id)).y);
  const cellOf = (t) => `${laneId(t)}|${L.vertical ? L.pos.get(key(t.id)).y : L.pos.get(key(t.id)).x}`;
  const cells = new Map();
  tasks.forEach((t, i) => (cells.get(cellOf(t)) || cells.set(cellOf(t), []).get(cellOf(t))).push(i));
  const out = [...tasks];
  for (const places of cells.values()) {
    const sorted = places.map((i) => tasks[i]).sort((a, c) => across(a) - across(c));
    places.forEach((i, j) => { out[i] = sorted[j]; });
  }
  return out.map((t) => t.id);
}

function useAutomaticOrder() {
  const ids = automaticOrder();
  if (sameJson(ids, board.tasks.filter((t) => ids.includes(t.id)).map((t) => t.id))) return toast("The cards already follow the automatic order");
  undoable(ops.order(ids), "Cards now follow the automatic order");
}

function toggleArrange() {
  prefs.arrange = prefs.arrange === "manual" ? "auto" : "manual";
  savePrefs();
  render();
  if (prefs.arrange === "auto") return toast("Automatic layout: cards are ordered for fewer crossings and straighter arrows");
  const ids = automaticOrder();
  const differs = !store.readOnly && !sameJson(ids, board.tasks.filter((t) => ids.includes(t.id)).map((t) => t.id));
  toast(compact("Manual layout: drag a card up or down to move it, or into another group.",
    differs ? h("button", { class: "link", onclick: (e) => { e.target.closest(".toast").remove(); useAutomaticOrder(); } }, "Start from the automatic order") : null), "", differs ? 9000 : 4000);
}

// Keeps the point at the middle of the viewport in place while the graph stretches along the flow.
function setLevelGap(gap) {
  stopGlide();
  gap = clamp(Math.round(gap / 10) * 10, LEVEL_GAP.min, LEVEL_GAP.max);
  if (gap === prefs.levelGap) return;
  const vertical = prefs.orient === "vertical", axis = vertical ? "y" : "x", cell = vertical ? CH : CW;
  const vp = $("#viewport").getBoundingClientRect(), mid = (vertical ? vp.height : vp.width) / 2;
  const at = (mid - view[axis]) / view.k;
  view[axis] = mid - at * (cell + gap) / (cell + prefs.levelGap) * view.k;
  prefs.levelGap = gap;
  $("#spread").value = gap;
  savePrefs();
  render();
  applyView(false);
}

function toggleDone() {
  prefs.hideDone = !prefs.hideDone;
  savePrefs();
  fitted = false;
  render();
}

// Whether leaving the page now loses work: a save on its way, a board that lives only in this tab, or typed text
// (drafts in the panel, text a failed save gave back, a title being edited, a dialog being filled in).
function unsaved() {
  if (!store || store.readOnly) return false;
  if (pending || (store.kind === "memory" && store.dirty)) return true;
  const t = ui.selected && get(ui.selected), filled = (el) => !!el.value.trim();
  if ([...drafts.note].some(([id, text]) => text.trim() && get(id))) return true;
  if ([...drafts.back.keys()].some((k) => IX.has(k)) || drafts.title != null || drafts.boardTitle != null) return true;
  if (t && ui.editingDesc && drafts.desc != null && drafts.desc.trim() !== t.desc) return true;
  if (ui.editingNote && drafts.noteEdit != null && drafts.noteEdit.trim() !== ui.editingNote.text) return true;
  // The titles save when they lose the focus, which closing the page does not wait for.
  const title = $("#panel .p-title"), boardTitle = $(".title-input");
  if (t && title && filled(title) && title.value.replace(/\s+/g, " ").trim() !== t.title) return true;
  if (boardTitle && boardTitle.value.trim() !== board.title) return true;
  return [...document.querySelectorAll("dialog :is(textarea, input[name]:not([type=checkbox]))")].some(filled);
}

async function boot() {
  setupChrome();
  // Browsers show their own message, and only to a page the human has interacted with.
  addEventListener("beforeunload", (e) => { if (unsaved()) { e.preventDefault(); e.returnValue = ""; } });
  const snap = document.getElementById("kanvas-snapshot");
  try {
    if (snap.textContent.trim()) await open(snapshotStore(snap));
    else if (location.protocol.startsWith("http")) await open(serverStore());
  } catch (e) {
    console.warn("Kanvas: no board from the page or server", e);
  }
  if (!store) showWelcome();
  poll();
  refreshBoards().then(watchOthers);
  setInterval(() => { if (document.visibilityState === "visible") refreshBoards(); }, 5000);
  addEventListener("focus", refreshBoards);}

boot();
})();
</script>
</body>
