      if (k === e.from || k === e.to) continue;
      if (e.pts.some(([x, y]) => x > p.x + 2 && x < p.x + CW - 2 && y > p.y + 2 && y < p.y + CH - 2)) cards.push(k);
    }
    if (cards.length) behind.push({ from: e.from, to: e.to, cards });
  }
  const side = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
  const cross = (a, b, c, d) => side(a, b, c) * side(a, b, d) < 0 && side(c, d, a) * side(c, d, b) < 0;
  const crossings = [];
  for (let i = 0; i < edges.length; i++) {
    for (let j = i + 1; j < edges.length; j++) {
      const A = edges[i], B = edges[j];
      if ([A.from, A.to].some((k) => k === B.from || k === B.to)) continue;
      if (A.box[0] > B.box[2] || B.box[0] > A.box[2] || A.box[1] > B.box[3] || B.box[1] > A.box[3]) continue;
      let hit = false;
      for (let a = 1; a < A.pts.length && !hit; a++) for (let b = 1; b < B.pts.length && !hit; b++) hit = cross(A.pts[a - 1], A.pts[a], B.pts[b - 1], B.pts[b]);
      if (hit) crossings.push([`${A.from}>${A.to}`, `${B.from}>${B.to}`]);
    }
  }
  return { arrows: edges.length, crossings: crossings.length, behind: behind.length, straight, bends, length: Math.round(length), detail: { crossings, behind } };
}

// ---------------------------------------------------------------------------
// App state
// ---------------------------------------------------------------------------

let board = null;       // what the UI shows (may include unsaved optimistic edits)
let confirmed = null;   // last state known to be on disk
let store = null;
let IX = new Map();
let COVER = new Map();
let pending = 0;
let writes = 0;         // saves started, so a poll that overlapped one is dropped
let saveQueue = Promise.resolve();

const LEVEL_GAP = { min: 30, max: 500 };
const prefs = (() => {
  const defaults = { view: "graph", orient: "horizontal", arrange: "auto", hideDone: false, theme: null, levelGap: 70 };
  try { return Object.assign(defaults, JSON.parse(localStorage.getItem("kanvas:prefs") || "{}")); } catch (e) { return defaults; }
})();
const savePrefs = () => { try { localStorage.setItem("kanvas:prefs", JSON.stringify(prefs)); } catch (e) { /* storage disabled */ } };

const ui = { selected: null, search: "", states: new Set(), hover: null, link: null, editingDesc: false, focusDesc: false, editingNote: null, focusNote: false, panelStale: false, editingTitle: false };
// Unsaved text in the panel survives re-renders caused by agent changes.
const drafts = { desc: null, note: new Map(), noteEdit: null };
const view = { x: 40, y: 30, k: 1 };
let fitted = false;

const get = (id) => IX.get(key(id));
const unmet = (t) => unmetIn(IX, t);
const vstate = (t) => vstateIn(IX, t, COVER);
const yoloVia = (t) => (t.state === "done" ? null : COVER.get(key(t.id)) || null);
const groupOf = (t) => board.groups.find((g) => g.id === t.group) || null;
const laneId = (t) => (groupOf(t) ? t.group : null); // tasks of unknown groups share the Ungrouped lane
const dependents = (t) => board.tasks.filter((x) => x.deps.some((d) => same(d, t.id)));

function setBoard(b) {
  board = b;
  IX = indexOf(board);
  COVER = yoloCoverIn(board);
}

// ---------------------------------------------------------------------------
// Storage backends: local server, a file opened in the browser, memory, snapshot
// ---------------------------------------------------------------------------

// Every store keeps the version of the board the page last confirmed: load() and save() set it, and
// poll() returns { board, accept } so the version only moves when the page takes that board.
// save(fn, base) returns { board, base }: what was written, and the board fn was applied to.
function serverStore() {
  let etag = null;
  const parse = async (r) => normalize(JSON.parse(await r.text()));
  return {
    kind: "server",
    async load() {
      const r = await fetch("api/board", { cache: "no-store" });
      if (!r.ok) throw new Error(`server answered ${r.status}`);
      etag = r.headers.get("ETag");
      return parse(r);
    },
    async poll() {
      const r = await fetch("api/board", { cache: "no-store", headers: etag ? { "If-None-Match": etag } : {} });
      if (r.status === 304) return null;
      if (!r.ok) throw new Error(`server answered ${r.status}`);
      const tag = r.headers.get("ETag"), board = await parse(r);
      return { board, accept: () => { etag = tag; } };
    },
    async save(fn, base) {
      for (let attempt = 0; attempt < 6; attempt++) {
        const draft = clone(base);
        fn(draft);
        const r = await fetch("api/board", {
          method: "PUT",
          headers: Object.assign({ "Content-Type": "application/json" }, etag ? { "If-Match": etag } : {}),
          body: serialize(draft),
        });
        const text = await r.text();
        if (r.ok || r.status === 409) {
          etag = r.headers.get("ETag");
          const result = normalize(JSON.parse(text));
          if (r.ok) return { board: result, base };
          base = result; // someone else (an agent) wrote first: replay the change on top
          continue;
        }
        let msg = r.statusText;
        try { msg = JSON.parse(text).error || msg; } catch (e) { /* not JSON */ }
        throw new Error(msg);
      }
      throw new Error("the board kept changing; try again");
    },
  };
}

function fileStore(handle) {
  let lastText = null, lastMod = 0, lastSize = -1;
  const remember = (f, text) => { lastText = text; lastMod = f.lastModified; lastSize = f.size; };
  return {
    kind: "file",
    name: handle.name,
    async load() {
      const f = await handle.getFile();
      const text = await f.text();
      remember(f, text);
      return normalize(JSON.parse(text));
    },
    async poll() {
      const f = await handle.getFile();
      if (f.lastModified === lastMod && f.size === lastSize) return null;
      const text = await f.text();
      if (text === lastText) { remember(f, text); return null; }
      return { board: normalize(JSON.parse(text)), accept: () => remember(f, text) };
    },
    async save(fn, base) {
      const current = await (await handle.getFile()).text();
      if (current !== lastText) base = normalize(JSON.parse(current));
      const draft = clone(base);
      fn(draft);
      const text = serialize(draft);
      const w = await handle.createWritable();
      await w.write(text);
      await w.close();
      remember(await handle.getFile(), text);
      return { board: normalize(JSON.parse(text)), base };
    },
  };
}

function memoryStore(name, initial) {
  return {
    kind: "memory",
    name,
    dirty: false,
    async load() { return normalize(clone(initial)); },
    async poll() { return null; },
    async save(fn, base) { const d = clone(base); fn(d); this.dirty = true; initial = d; return { board: d, base }; },
  };
}

function snapshotStore(el) {
  const data = JSON.parse(el.textContent);
  return { kind: "snapshot", readOnly: true, at: el.dataset.at, async load() { return normalize(data); }, async poll() { return null; } };
}

async function open(s) {
  const b = await s.load();
  store = s;
  confirmed = b;
  setBoard(clone(b));
  edits.undo = [];
  edits.redo = [];
  renderUndo();
  document.body.classList.toggle("readonly", !!s.readOnly);
  $("#welcome").hidden = true;
  fitted = false;
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && get(hash)) ui.selected = get(hash).id;
  setSync("ok");
  render();
}

async function commit(fn, { record = true } = {}) {
  if (!store || store.readOnly) { toast("This snapshot is read-only"); return false; }
  let draft;
  const before = clone(board);
  try { draft = clone(board); fn(draft); } catch (e) { toast(e.message, "error"); return false; }
  const entry = record ? remember(before, draft) : null;
  setBoard(draft);
  render();
  pending++;
  writes++;
  saveQueue = saveQueue.then(async () => {
    try {
      const saved = await store.save(fn, confirmed);
      confirmed = saved.board;
      // Undo reverts what was written, which differs from the draft when the change was replayed on agent edits.
      if (entry) { entry.before = saved.base; entry.after = saved.board; }
      setSync("ok");
    } catch (e) {
      toast(`Not saved: ${e.message}`, "error");
      if (entry) forget(entry);
      try { confirmed = await store.load(); } catch (err) { setSync("bad", err.message); }
    } finally {
      pending--;
      if (!pending) { setBoard(clone(confirmed)); render(); }
    }
  });
  return true;
}

async function poll() {
  if (store && !pending && document.visibilityState === "visible") {
    const seen = writes;
    try {
      const fresh = await store.poll();
      if (store.kind !== "memory" && store.kind !== "snapshot") setSync("ok");
      // A board read while a save ran may not match the version that save left: drop it and read again next time.
      if (fresh && !pending && writes === seen) { fresh.accept(); applyRemote(fresh.board); }
    } catch (e) {
      setSync("bad", e.message);
    }
  }
  setTimeout(poll, POLL_MS);
}

function applyRemote(fresh) {
  const before = new Map(board.tasks.map((t) => [key(t.id), t]));
  confirmed = fresh;
  setBoard(clone(fresh));
  const changed = board.tasks.filter((t) => !sameJson(before.get(key(t.id)), t)).map((t) => t.id);
  if (ui.selected && !get(ui.selected)) { toast(`${ui.selected} was removed`); ui.selected = null; }
  render();
  flash(changed);
  announce(board.tasks.filter((t) => !before.has(key(t.id)) || before.get(key(t.id)).state !== t.state).map((t) => [t, before.get(key(t.id))]));
}

// What agents did since the last poll, as toasts. The author is only known when the move added a note.
const ACTIVITY = { proposed: "proposed", doing: "started", review: "finished", done: "finished", todo: "paused" };
function announce(moves) {
  const shown = moves.filter(([t, old]) => ACTIVITY[t.state] && !(t.state === "todo" && (!old || old.state !== "doing")));
  if (shown.length > 3) { toast(`${shown.length} tasks changed`); return; }
  for (const [t, old] of shown) {
    const last = t.notes[t.notes.length - 1], by = last && t.notes.length > (old ? old.notes.length : 0) ? last.by : null;
    const verb = !old && t.state === "proposed" ? "proposed" : ACTIVITY[t.state];
    const what = [h("span", { class: "cid" }, t.id), ` ${t.title} `, h("span", { class: `badge s-${vstate(t)}` }, LABEL[vstate(t)])];
    toast(by ? [agentMark(by), h("b", {}, by), ` ${verb} `, what] : [what.slice(0, 2), `was ${verb} `, what[2]], "activity", 4200);
  }
}

// ---------------------------------------------------------------------------
// Undo and redo of the human's own changes
// ---------------------------------------------------------------------------

const edits = { undo: [], redo: [] };
const UNDO_LIMIT = 100;
const FIELD_NAMES = { deps: "dependencies", desc: "description", yolo: "YOLO" };

function remember(before, after) {
  if (serialize(before) === serialize(after)) return null;
  const entry = { before, after, label: describeChange(before, after) };
  edits.undo.push(entry);
  if (edits.undo.length > UNDO_LIMIT) edits.undo.shift();
  edits.redo = [];
  renderUndo();
  return entry;
}

function forget(entry) {
  edits.undo = edits.undo.filter((e) => e !== entry);
  renderUndo();
}

function describeChange(a, z) {
  const parts = [], fields = [];
  const A = new Map(a.tasks.map((t) => [key(t.id), t])), Z = new Map(z.tasks.map((t) => [key(t.id), t]));
  for (const [k, t] of Z) if (!A.has(k)) parts.push(`new task ${t.id}`);
  for (const [k, t] of A) {
    const n = Z.get(k);
    if (!n) { parts.push(`deleting ${t.id}`); continue; }
    const changed = Object.keys({ ...t, ...n }).filter((f) => !sameJson(t[f], n[f]));
    if (changed.length) fields.push(`${t.id} ${changed.map((f) => FIELD_NAMES[f] || f).join(" and ")}`);
  }
  const GA = new Map(a.groups.map((g) => [g.id, g])), GZ = new Map(z.groups.map((g) => [g.id, g]));
  for (const [id, g] of GZ) if (!GA.has(id)) parts.push(`new group ${g.name}`);
  for (const [id, g] of GA) {
    if (!GZ.has(id)) parts.push(`deleting group ${g.name}`);
    else if (!sameJson(g, GZ.get(id))) parts.push(`renaming group ${g.name}`);
  }
  if (!parts.length && !fields.length && !sameJson(a.groups.map((g) => g.id), z.groups.map((g) => g.id))) parts.push("group order");
  if (!parts.length && !fields.length && !sameJson(a.tasks.map((t) => t.id), z.tasks.map((t) => t.id))) parts.push("card order");
  if (a.title !== z.title) parts.push("board title");
  const all = [...parts, ...fields];
  return all.length > 2 ? `${all.slice(0, 2).join(", ")} and ${all.length - 2} more` : all.join(", ") || "change";
}

function step(dir) {
  if (!board || !store || store.readOnly) return;
  const from = edits[dir], to = edits[dir === "undo" ? "redo" : "undo"];
  const entry = from[from.length - 1];
  if (!entry) return toast(dir === "undo" ? "Nothing to undo" : "Nothing to redo");
  const [a, z] = dir === "undo" ? [entry.after, entry.before] : [entry.before, entry.after];
  let result;
  try { result = replay(clone(board), a, z); } catch (e) { toast(`Can't ${dir}: ${e.message}`, "error"); return; }
  from.pop();
  if (!result.applied) {
    renderUndo();
    return toast(`Can't ${dir} ${entry.label}: it was changed since`, "error");
  }
  commit((b) => { result = replay(b, a, z); }, { record: false }).then((ok) => {
    (ok ? to : from).push(entry);
    renderUndo();
    if (!ok) return;
    const kept = result.skipped ? ` (${result.skipped} later change${result.skipped > 1 ? "s" : ""} kept)` : "";
    toast(`${dir === "undo" ? "Undone" : "Redone"}: ${entry.label}${kept}`);
  });
}

function renderUndo() {
  for (const dir of ["undo", "redo"]) {
    const btn = $(`#${dir}`), last = edits[dir][edits[dir].length - 1];
    btn.disabled = !last;
    btn.dataset.tip = last ? `${dir === "undo" ? "Undo" : "Redo"} ${last.label}` : `Nothing to ${dir}`;
  }
}

function setSync(status, detail) {
  const el = $("#sync");
  let label = "", cls = status;
  if (!store) return;
  if (store.kind === "server") label = status === "ok" ? "Live" : "Disconnected";
  else if (store.kind === "file") label = status === "ok" ? store.name : "File unavailable";
  else if (store.kind === "memory") { label = store.dirty ? "Unsaved" : "Not synced"; cls = "warn"; }
  else if (store.kind === "snapshot") { label = "Read-only snapshot"; cls = ""; }
  el.className = `sync ${cls}`;
  el.querySelector(".label").textContent = label;
  el.dataset.tip = detail || {
    server: "Synced with kanvas.json through the Kanvas server. Agent changes appear within a second.",
    file: "Reading and writing the file directly. Agent changes appear within a second.",
    memory: "Changes live in this tab only. Use Save to download the board.",
    snapshot: store.at ? `Exported ${new Date(store.at).toLocaleString()}` : "Exported board",
  }[store.kind];
  el.setAttribute("aria-label", `${label}. ${el.dataset.tip}`);
  $("#download").hidden = store.kind !== "memory";
}

// ---------------------------------------------------------------------------
// Changes a human can make (each is replayed on the latest board when saving)
// ---------------------------------------------------------------------------

function mustFind(b, id) {
  const t = b.tasks.find((x) => same(x.id, id));
  if (!t) throw new Error(`${id} no longer exists`);
  return t;
}
// Times are taken when the change is made, so a save that replays it writes what the page showed.
const addNote = (t, text, at) => t.notes.push({ at, by: "human", text });

const ops = {
  title: (text) => (b) => { b.title = text; },
  set: (id, patch) => (b) => { Object.assign(mustFind(b, id), patch); },
  // `from` is the state the human saw, so a replay never undoes a move an agent made meanwhile.
  state: (id, from, state, text, at = nowIso()) => (b) => {
    const t = mustFind(b, id);
    if (t.state !== from && t.state !== state) throw new Error(`${t.id} is in ${LABEL[t.state] || t.state} now, not ${LABEL[from] || from}`);
    t.state = state;
    if (text) addNote(t, text, at);
  },
  note: (id, text, at = nowIso()) => (b) => addNote(mustFind(b, id), text, at),
  // Notes are found by author, time and text, so an edit still finds its note after agents add more.
  editNote: (id, n, rank, text, edited = nowIso()) => (b) => { const t = mustFind(b, id), i = noteIndex(t, n, rank); t.notes[i] = { ...t.notes[i], text, edited }; },
  removeNote: (id, n, rank) => (b) => { const t = mustFind(b, id); t.notes.splice(noteIndex(t, n, rank), 1); },
  addTask: (f, out) => (b) => {
    const t = { id: nextId(b, f.group || UNGROUPED), title: f.title, state: "todo", group: f.group || null, deps: [], desc: f.desc || "", notes: [] };
    for (const ref of f.deps || []) t.deps.push(mustFind(b, ref).id);
    b.tasks.push(t);
    for (const ref of f.blocks || []) {
      const x = mustFind(b, ref);
      if (reaches(b, t.id, x.id)) throw new Error(`${x.id} cannot wait for the new task: that would create a cycle`);
      x.deps.push(t.id);
    }
    out.id = t.id;
  },
  remove: (id) => (b) => {
    mustFind(b, id);
    b.tasks = b.tasks.filter((t) => !same(t.id, id));
    for (const t of b.tasks) t.deps = t.deps.filter((d) => !same(d, id));
  },
  // The manual graph layout shows cards in file order, so moving a card moves its task in the list.
  move: (id, group, before, after) => (b) => {
    const t = mustFind(b, id), i = b.tasks.indexOf(t);
    t.group = group;
    b.tasks.splice(i, 1);
    const j = b.tasks.findIndex((x) => same(x.id, before || after || ""));
    b.tasks.splice(j < 0 ? i : before ? j : j + 1, 0, t);
  },
  order: (ids) => (b) => reorderTasks(b, ids),
  addDep: (id, dep) => (b) => {
    const t = mustFind(b, id), d = mustFind(b, dep);
    if (t === d) throw new Error("A task cannot depend on itself");
    if (t.deps.some((x) => same(x, d.id))) return;
    if (reaches(b, d.id, t.id)) throw new Error(`${t.id} cannot depend on ${d.id}: that would create a cycle`);
    t.deps.push(d.id);
  },
  removeDep: (id, dep) => (b) => { const t = mustFind(b, id); t.deps = t.deps.filter((x) => !same(x, dep)); },
  approve: (ids) => (b) => { for (const t of b.tasks) if (t.state === "proposed" && ids.includes(t.id)) t.state = "todo"; },
  yolo: (id, on) => (b) => {
    const t = mustFind(b, id);
    if (!on) { delete t.yolo; return; }
    const via = yoloCoverIn(b).get(key(t.id));
    if (via && !same(via, t.id)) throw new Error(`${t.id} is already covered by YOLO on ${via}`);
    yoloOn(b, t.id);
  },
  addGroup: (name, prefix) => (b) => {
    if (b.groups.some((g) => g.name.toLowerCase() === name.toLowerCase())) throw new Error(`Group "${name}" already exists`);
    if (!PREFIX_RE.test(prefix)) throw new Error("Prefix: 1-6 letters or digits, starting with a letter");
    if (b.groups.some((g) => g.id === prefix)) throw new Error(`Prefix ${prefix} is already used`);
    b.groups.push({ id: prefix, name });
  },
  renameGroup: (gid, name) => (b) => { const g = b.groups.find((x) => x.id === gid); if (g) g.name = name; },
  moveGroup: (gid, delta) => (b) => {
    const i = b.groups.findIndex((g) => g.id === gid), j = i + delta;
    if (i >= 0 && j >= 0 && j < b.groups.length) [b.groups[i], b.groups[j]] = [b.groups[j], b.groups[i]];
  },
  // Puts a group just before another one, or last.
  placeGroup: (gid, before) => (b) => {
    const g = b.groups.find((x) => x.id === gid);
    if (!g) throw new Error(`Group ${gid} no longer exists`);
    b.groups.splice(b.groups.indexOf(g), 1);
    const j = before ? b.groups.findIndex((x) => x.id === before) : -1;
    b.groups.splice(j < 0 ? b.groups.length : j, 0, g);
  },
  deleteGroup: (gid, ids) => (b) => {
    if (!b.groups.some((g) => g.id === gid)) throw new Error(`Group ${gid} no longer exists`);
    removeGroup(b, gid, ids);
  },
};

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function matches(t) {
  if (ui.states.size && !ui.states.has(vstate(t))) return false;
  const q = ui.search.trim().toLowerCase();
  if (!q) return true;
  const g = groupOf(t);
  return [t.id, t.title, t.desc, g ? g.name : "", ...t.notes.map((n) => n.text || "")].some((s) => s.toLowerCase().includes(q));
}

function render() {
  if (!board) return;
  renderHeader();
  renderProblems();
  $("#graph-view").hidden = prefs.view !== "graph";
  $("#board-view").hidden = prefs.view !== "board";
  renderPanel();
  if (prefs.view === "graph") renderGraph();
  else renderKanban();
  if (picking) applyPick();
}

function renderHeader() {
  document.title = board.title ? `${board.title} · Kanvas` : "Kanvas";
  const slot = $("#title-slot");
  const titleBtn = slot.querySelector(".board-title");
  if (!ui.editingTitle && titleBtn) {
    titleBtn.querySelector(".t").textContent = board.title || "Kanvas";
  } else if (!ui.editingTitle) {
    slot.replaceChildren(h("button", { class: "board-title", "aria-haspopup": "menu", "aria-expanded": "false", onclick: (e) => dropdown(e.currentTarget, boardMenu()) },
      h("span", { class: "t" }, board.title || "Kanvas"), icon("chevron")));
  } else if (!slot.querySelector("input")) {
    const input = h("input", { class: "title-input", value: board.title, "aria-label": "Board title" });
    const done = (save) => {
      if (!ui.editingTitle) return;
      ui.editingTitle = false;
      const v = input.value.trim();
      if (save && v !== board.title) commit(ops.title(v)); else renderHeader();
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); });
    input.addEventListener("blur", () => done(true));
    slot.replaceChildren(input);
    input.focus();
    input.select();
  }

  const counts = Object.fromEntries(VIEW_STATES.map((s) => [s, 0]));
  for (const t of board.tasks) counts[vstate(t)] = (counts[vstate(t)] || 0) + 1;
  $("#chips").replaceChildren(...VIEW_STATES.map((s) => {
    const hidden = s === "done" && prefs.hideDone;
    const on = ui.states.has(s);
    return h("button", {
      class: `schip s-${s}${on ? " on" : ""}${counts[s] ? "" : " zero"}${hidden ? " off" : ""}`,
      "data-tip": hidden ? `${counts[s]} finished task${counts[s] === 1 ? " is" : "s are"} hidden. Click to show them.`
        : on ? `Showing only ${LABEL[s].toLowerCase()} tasks. Click to show all.` : `Show only ${LABEL[s].toLowerCase()} tasks. Shift+click to add to the filter.`,
      "data-key": hidden ? "H" : null,
      "aria-pressed": on ? "true" : "false",
      "aria-label": `${LABEL[s]}: ${counts[s]}`,
      onclick: (e) => {
        if (hidden) return toggleDone();
        if (e.shiftKey) on ? ui.states.delete(s) : ui.states.add(s);
        else if (ui.states.size === 1 && on) ui.states.clear();
        else ui.states = new Set([s]);
        render();
      },
    }, hidden ? icon("eye-off") : h("span", { class: "dot" }), h("span", { class: "lbl" }, LABEL[s]), h("b", {}, counts[s]));
  }));

  const total = board.tasks.length || 1;
  $("#progress").replaceChildren(...["done", "review", "doing", "todo", "blocked", "proposed"].map((s) =>
    h("span", { class: `s-${s}`, style: `flex-grow:${counts[s] / total}` })));
  $("#meter").dataset.tip = `${counts.done} of ${board.tasks.length} tasks done`;
  $("#meter").setAttribute("aria-label", $("#meter").dataset.tip);
  $("#meter-pct").textContent = `${Math.round((100 * counts.done) / total)}%`;
  const targets = board.tasks.filter(isYoloTarget);
  const charged = board.tasks.filter((t) => yoloVia(t)).length;
  const chip = $("#yolo-chip");
  chip.hidden = !targets.length;
  if (targets.length) {
    chip.replaceChildren(icon("zap"), h("span", { class: "lbl" }, "YOLO"), h("b", {}, charged));
    chip.dataset.tip = `YOLO on ${targets.map((t) => t.id).join(", ")}: agents take on ${charged} task${charged > 1 ? "s" : ""} without approval and send ${targets.length > 1 ? "these" : "it"} to you for review. Click to open ${targets.length > 1 ? "them one by one" : "it"}.`;
    chip.setAttribute("aria-label", `YOLO on ${targets.map((t) => t.id).join(", ")}: ${charged} task${charged > 1 ? "s" : ""} without approval`);
    chip.onclick = () => { const i = targets.findIndex((t) => same(t.id, ui.selected)); select(targets[(i + 1) % targets.length].id); };
  }
  for (const v of ["graph", "board"]) {
    const btn = $(`#view-${v}`);
    btn.classList.toggle("on", prefs.view === v);
    btn.setAttribute("aria-pressed", prefs.view === v ? "true" : "false");
  }
}

function renderProblems() {
  const { errors, warnings } = problemsOf(board);
  const el = $("#problems");
  const all = [...errors, ...warnings];
  el.hidden = !all.length;
  if (!all.length) return;
  el.className = `banner${errors.length ? " error" : ""}`;
  const expanded = el.dataset.expanded === "1";
  const shown = expanded ? all : all.slice(0, 1);
  const plural = (n, word) => `${n} ${word}${n > 1 ? "s" : ""}`;
  const summary = [errors.length ? plural(errors.length, "error") : "", warnings.length ? plural(warnings.length, "warning") : ""].filter(Boolean).join(", ");
  el.replaceChildren(...compact(
    h("strong", {}, summary),
    h("ul", {}, shown.map((p) => h("li", {}, p))),
    all.length > 1 ? h("button", { onclick: () => { el.dataset.expanded = expanded ? "0" : "1"; renderProblems(); } }, expanded ? "Show less" : `Show all ${all.length}`) : null,
  ));
}

// Graph view ---------------------------------------------------------------

const edgeFor = (hit) => document.querySelector(`#edge-layer path[data-from="${CSS.escape(hit.dataset.from)}"][data-to="${CSS.escape(hit.dataset.to)}"]`);

const cardEls = new Map();
let lastLayout = null;
// For tuning the layout from the browser console.
window.kanvasLayoutStats = () => lastLayout && layoutMetrics(lastLayout);

const agentMark = (by) => h("span", { class: "agent", style: `--a:${by === "human" ? "#64748b" : colorFor(by)}` }, by.slice(0, 1));

function cardFoot(t) {
  const vs = vstate(t), notes = t.notes.length, last = t.notes[notes - 1];
  let left = null;
  if (vs === "blocked") {
    const waits = unmet(t);
    left = h("span", { class: "grow", title: `Waiting on ${waits.join(", ")}` }, icon("lock"), ` ${waits[0]}${waits.length > 1 ? ` +${waits.length - 1}` : ""}`);
  } else if (last && (vs === "doing" || vs === "review")) {
    const by = last.by || "?";
    left = h("span", { class: "grow who", title: last.text }, vs === "doing" ? h("i", { class: "live" }) : null, agentMark(by), `${by} · ${ago(last.at)}`);
  } else if (t.deps.length) {
    left = h("span", { class: "grow" }, icon("link"), ` ${t.deps.length - unmet(t).length}/${t.deps.length}`);
  } else {
    left = h("span", { class: "grow" });
  }
  return h("div", { class: "card-foot" }, left, notes ? h("span", { title: `${notes} note${notes > 1 ? "s" : ""}` }, icon("note"), ` ${notes}`) : null);
}

const isYoloTarget = (t) => yoloActive(t) && same(yoloVia(t), t.id);

function yoloTag(t) {
  if (t.yolo && t.state !== "done" && (!yoloActive(t) || isYoloTarget(t))) {
    return h("span", { class: "yolo-tag", title: yoloActive(t) ? "YOLO: agents finish everything this task depends on without approval or review, then this task, which comes to you for review" : "YOLO chain complete: this task waits for your review" }, icon("zap"), "YOLO");
  }
  const via = yoloVia(t);
  return via ? h("span", { class: "yolo-mark", title: `Covered by YOLO on ${via}: no approval or review needed` }, icon("zap")) : null;
}

function fillCard(el, t) {
  const vs = vstate(t);
  el.className = `card s-${vs}${same(ui.selected, t.id) ? " sel" : ""}${isYoloTarget(t) ? " yolo" : ""}${["enter", "flash", "moving", "zap"].filter((c) => el.classList.contains(c)).map((c) => ` ${c}`).join("")}`;
  el.dataset.id = t.id;
  el.replaceChildren(...compact(
    h("div", { class: "card-head" }, h("span", { class: "cid" }, t.id), h("span", { class: "head-end" }, yoloTag(t), h("span", { class: "badge" }, LABEL[vs]))),
    h("div", { class: "card-title", title: t.title }, t.title),
    cardFoot(t),
    store.readOnly ? null : h("div", { class: "handle in", title: "Drag onto another card: this card will depend on that one" }),
    store.readOnly ? null : h("div", { class: "handle out", title: "Drag onto another card: that card will depend on this one" }),
  ));
}

// The layout only changes with what it reads, so selecting or annotating tasks reuses it.
let layoutKey = "";
function renderGraph() {
  const tasks = board.tasks.filter((t) => !(prefs.hideDone && t.state === "done"));
  const opts = { vertical: prefs.orient === "vertical", levelGap: prefs.levelGap, manual: prefs.arrange === "manual" };
  // Lane counts include hidden finished tasks, so every task is part of the key.
  const k = JSON.stringify([opts, prefs.hideDone, board.groups.map((g) => [g.id, g.name]), board.tasks.map((t) => [t.id, t.group, t.deps, t.state])]);
  const L = k === layoutKey && lastLayout ? lastLayout : layout(tasks, board, opts);
  layoutKey = k;
  lastLayout = L;
  const world = $("#world");
  world.style.width = `${L.width}px`;
  world.style.height = `${L.height}px`;
  world.classList.toggle("vertical", L.vertical);
  world.classList.toggle("manual", opts.manual && !store.readOnly);
  $(".hint-bar").textContent = `${opts.manual ? "Drag a card up or down to move it, or a group by its name. " : ""}Drag a dot on a card's edge onto another card to add a dependency. Click an arrow to remove it. Right-click for more actions. Scroll to pan, Ctrl+scroll to zoom.`;

  $("#lanes").replaceChildren(...L.lanes.map((l) => h("div", {
    class: "lane", "data-group": l.id || "", style: `left:${l.left}px;top:${l.top}px;height:${l.height}px;width:${l.width}px`,
  },
  h("div", { class: "lane-head" },
    h("span", { class: "lane-swatch", style: `background:${l.color}` }),
    h("span", { class: "lane-name" }, l.name),
    l.id ? h("span", { class: "lane-prefix" }, l.id) : null,
    h("span", { class: "lane-count", title: "done / total" }, `${l.done}/${l.total}`),
    l.total ? h("span", { class: "lane-bar", title: `${l.done} of ${l.total} done` }, h("i", { style: `width:${(100 * l.done) / l.total}%` })) : null,
    h("button", { class: "edit-only", title: `New task in ${l.name}`, "aria-label": `New task in ${l.name}`, onclick: () => newTaskDialog(l.id) }, icon("plus"))),
  l.empty ? h("div", { class: "lane-empty" }, l.total ? "All done" : "No tasks yet") : null)));

  const svg = $("#edges");
  svg.setAttribute("width", L.width);
  svg.setAttribute("height", L.height);
  let paths = "", hits = "";
  // Implied dependencies are drawn only while one of their two tasks is selected.
  for (const e of L.edges) {
    const dep = IX.get(e.from), t = IX.get(e.to);
    const cls = dep.state === "done" ? "met" : "open";
    const m = yoloVia(dep) && yoloVia(t) ? "yolo" : dep.state === "doing" ? "live" : cls;
    const imp = e.implied ? (same(ui.selected, dep.id) || same(ui.selected, t.id) ? " implied shown" : " implied") : "";
    const path = curvePath(e.segs);
    const ends = `data-from="${escHtml(dep.id)}" data-to="${escHtml(t.id)}"`;
    paths += `<path class="edge ${cls}${m === cls ? "" : ` ${m}`}${imp}" ${ends} data-m="${m}" marker-end="url(#m-${m})" d="${path}"/>`;
    hits += `<path class="${imp.trim()}" ${ends} d="${path}"/>`;
  }
  $("#edge-layer").innerHTML = paths;
  $("#edge-hits").innerHTML = hits;

  const seen = new Set();
  for (const t of tasks) {
    const k = key(t.id);
    let el = cardEls.get(k);
    if (!el) {
      el = h("div", { class: fitted ? "card enter" : "card" });
      el.addEventListener("animationend", (e) => { if (e.target === el) { el.classList.remove("enter", "flash", "zap"); el.style.animationDelay = ""; } });
      cardEls.set(k, el);
      $("#cards").append(el);
    }
    fillCard(el, t);
    const p = L.pos.get(k);
    if (!el.classList.contains("moving")) el.style.transform = `translate(${p.x}px, ${p.y}px)`;
    seen.add(k);
  }
  for (const [k, el] of cardEls) if (!seen.has(k)) { el.remove(); cardEls.delete(k); }

  const empty = $("#graph-empty");
  empty.hidden = tasks.length > 0;
  if (!tasks.length) {
    empty.replaceChildren(h("div", {},
      h("h2", {}, board.tasks.length ? "Everything here is done" : "An empty board"),
      board.tasks.length
        ? h("p", {}, "Finished tasks are hidden. Press H to show them.")
        : h("p", {}, "Add the first task, or ask your agent to interview you and plan the project."),
      board.tasks.length || store.readOnly ? null : h("button", { class: "primary", onclick: () => newTaskDialog() }, icon("plus"), "New task")));
  }
  applyDim();
  applyFocus();
  shiftLane();
  if (!fitted && tasks.length) { fit(false); fitted = true; if (ui.selected) reveal(ui.selected, false); }
}

function applyDim() {
  const filtering = ui.states.size || ui.search.trim();
  for (const t of board.tasks) {
    const el = cardEls.get(key(t.id));
    if (el) el.classList.toggle("dim", !!filtering && !matches(t));
  }
}

function lineage(id) {
  const up = new Set([key(id)]), down = new Set([key(id)]);
  const deps = lastLayout ? lastLayout.depsOf : new Map();
  const stack = [key(id)];
  while (stack.length) for (const d of deps.get(stack.pop()) || []) if (!up.has(d)) { up.add(d); stack.push(d); }
  const kids = new Map();
  for (const [k, ds] of deps) for (const d of ds) (kids.get(d) || kids.set(d, []).get(d)).push(k);
  stack.push(key(id));
  while (stack.length) for (const c of kids.get(stack.pop()) || []) if (!down.has(c)) { down.add(c); stack.push(c); }
  return { up, down };
}

function applyFocus() {
  const world = $("#world");
  const link = ui.link;
  const focus = link ? null : ui.hover || (ui.selected && cardEls.has(key(ui.selected)) ? ui.selected : null);
  world.classList.toggle("focusing", !!(link || focus));
  if (!link && !focus) {
    for (const el of cardEls.values()) el.classList.remove("related");
    for (const p of document.querySelectorAll("#edge-layer path")) { p.classList.remove("related"); p.setAttribute("marker-end", `url(#m-${p.dataset.m})`); }
    return;
  }
  // A connection lights up just its two tasks and the arrow between them.
  const { up, down } = link ? { up: new Set([link.from, link.to]), down: new Set() } : lineage(focus);
  for (const [k, el] of cardEls) el.classList.toggle("related", up.has(k) || down.has(k));
  for (const p of document.querySelectorAll("#edge-layer path")) {
    const a = key(p.dataset.from), b = key(p.dataset.to);
    const on = (up.has(a) && up.has(b)) || (down.has(a) && down.has(b));
    p.classList.toggle("related", on);
    p.setAttribute("marker-end", `url(#m-${on && p.dataset.m !== "yolo" ? "hl" : p.dataset.m})`);
  }
}

function flash(ids) {
  for (const id of ids) {
    const el = cardEls.get(key(id)) || document.querySelector(`.kcard[data-id="${CSS.escape(id)}"]`);
    if (!el) continue;
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }
}

function applyView(animate) {
  const world = $("#world");
  world.classList.toggle("animate", !!animate);
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  $("#zoom-pct").textContent = `${Math.round(view.k * 100)}%`;
  if (animate) setTimeout(() => world.classList.remove("animate"), 350);
}

function fit(animate = true) {
  if (!lastLayout) return;
  const vp = $("#viewport").getBoundingClientRect();
  const W = lastLayout.width || 1, H = lastLayout.height || 1;
  const usable = vp.height - 44; // keep clear of the zoom bar
  view.k = clamp(Math.min((vp.width - 48) / W, (usable - 48) / H, 1), 0.25, 1);
  view.x = Math.max(24, (vp.width - W * view.k) / 2);
  view.y = Math.max(24, (usable - H * view.k) / 2);
  applyView(animate);
}

function zoomAt(factor, cx, cy) {
  const k = clamp(view.k * factor, 0.2, 2);
  const wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view.k = k;
  view.x = cx - wx * k;
  view.y = cy - wy * k;
  applyView(false);
}

function reveal(id, animate = true) {
  const p = lastLayout && lastLayout.pos.get(key(id));
  if (!p || prefs.view !== "graph") return;
  const vp = $("#viewport").getBoundingClientRect(), panel = $("#panel");
  const left = !panel.hidden && getComputedStyle(panel).position === "absolute" ? panel.offsetWidth : 0;
  const sx = view.x + p.x * view.k, sy = view.y + p.y * view.k;
  if (sx > left + 20 && sy > 20 && sx + CW * view.k < vp.width - 20 && sy + CH * view.k < vp.height - 20) return;
  view.x = (left + vp.width) / 2 - (p.x + CW / 2) * view.k;
  view.y = vp.height / 2 - (p.y + CH / 2) * view.k;
  applyView(animate);
}

// Arrow keys select the nearest card on screen that lies wholly past the selected one in that
// direction; sideways distance counts double. With nothing selected they start from the card
// nearest the middle of the view.
function moveSelection(arrow) {
  const graph = prefs.view === "graph";
  const cards = (graph ? [...cardEls.values()].filter((el) => !el.classList.contains("dim")) : [...document.querySelectorAll("#kanban .kcard")])
    .map((el) => { const r = el.getBoundingClientRect(); return { id: el.dataset.id, r, x: r.left + r.width / 2, y: r.top + r.height / 2 }; });
  const nearest = (list, cost) => list.reduce((best, c) => (best && cost(best) <= cost(c) ? best : c), null);
  const cur = cards.find((c) => same(c.id, ui.selected));
  let next;
  if (!cur) {
    const r = $(graph ? "#viewport" : "#kanban").getBoundingClientRect(), mx = r.left + r.width / 2, my = r.top + r.height / 2;
    next = nearest(cards, (c) => Math.hypot(c.x - mx, c.y - my));
  } else {
    const past = {
      ArrowLeft: (c) => c.r.right <= cur.r.left + 2, ArrowRight: (c) => c.r.left >= cur.r.right - 2,
      ArrowUp: (c) => c.r.bottom <= cur.r.top + 2, ArrowDown: (c) => c.r.top >= cur.r.bottom - 2,
    }[arrow];
    const flat = arrow === "ArrowLeft" || arrow === "ArrowRight";
    next = nearest(cards.filter((c) => c !== cur && past(c)), (c) => (flat ? Math.abs(c.x - cur.x) + 2 * Math.abs(c.y - cur.y) : Math.abs(c.y - cur.y) + 2 * Math.abs(c.x - cur.x)));
  }
  if (!next) return;
  select(next.id);
  if (!graph) { const el = $("#kanban .kcard.sel"); if (el) el.scrollIntoView({ block: "nearest", inline: "nearest" }); }
}

// Where a card dragged across the flow to `across` lands: a lane, and the cards of that lane in
// its own depth it goes between. `line` is the across position of the drop marker; `col` is the
// depth's position along the flow.
function dropTarget(id, across) {
  const L = lastLayout, v = L.vertical, task = get(id);
  if (!task || !L.pos.has(key(id)) || !L.lanes.length) return null;
  const at = (t) => L.pos.get(key(t.id)), along = (p) => (v ? p.y : p.x), side = (p) => (v ? p.x : p.y), CA = v ? CW : CH;
  const lane = L.lanes.find((l) => across < (v ? l.left + l.width : l.top + l.height) + LANE_GAP / 2) || L.lanes[L.lanes.length - 1];
  const col = along(at(task));
  const peers = board.tasks.filter((t) => !same(t.id, id) && L.pos.has(key(t.id)) && laneId(t) === lane.id && along(at(t)) === col)
    .sort((a, c) => side(at(a)) - side(at(c)));
  const i = peers.findIndex((t) => side(at(t)) + CA / 2 > across);
  const before = i >= 0 ? peers[i] : null, after = !before && peers.length ? peers[peers.length - 1] : null;
  const line = before ? (i ? (side(at(peers[i - 1])) + CA + side(at(before))) / 2 : side(at(before)) - GAP_Y / 2)
    : after ? side(at(after)) + CA + GAP_Y / 2
    : (v ? lane.left + LANE_PAD : lane.top + LANE_HEAD) + CA / 2;
  return { group: lane.id === laneId(task) ? task.group : lane.id, before: before && before.id, after: after && after.id, col, line };
}

// A swimlane being dragged by its header: its group and how far it has moved across the flow.
let movingLane = null;

function shiftLane() {
  if (!movingLane || !lastLayout) return;
  const v = lastLayout.vertical, { id, shift } = movingLane;
  const el = [...document.querySelectorAll("#lanes .lane")].find((x) => x.dataset.group === id);
  if (el) { el.classList.add("moving"); el.style.transform = v ? `translate(${shift}px, 0)` : `translate(0, ${shift}px)`; }
  for (const t of board.tasks) {
    const c = cardEls.get(key(t.id)), p = lastLayout.pos.get(key(t.id));
    if (c && p && laneId(t) === id) c.style.transform = `translate(${p.x + (v ? shift : 0)}px, ${p.y + (v ? 0 : shift)}px)`;
  }
}

// The group a dragged swimlane centered at `across` lands before (null: last), and where the
// marker between lanes goes.
function laneDropTarget(id, across) {
  const L = lastLayout, v = L.vertical;
  const start = (l) => (v ? l.left : l.top), end = (l) => start(l) + (v ? l.width : l.height);
  const others = L.lanes.filter((l) => l.id && l.id !== id);
  const before = others.find((l) => (start(l) + end(l)) / 2 > across) || null;
  const last = others[others.length - 1];
  return { before: before && before.id, line: before ? start(before) - LANE_GAP / 2 : last ? end(last) + LANE_GAP / 2 : 0 };
}

function setupGraphInput() {
  const vp = $("#viewport"), world = $("#world");
  let drag = null;
  const toWorld = (e) => {
    const r = vp.getBoundingClientRect();
    return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k };
  };
  vp.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest("button")) return;
    const handle = !picking && e.target.closest(".handle");
    if (handle) {
      const from = handle.parentElement.dataset.id, p = lastLayout.pos.get(key(from)), incoming = handle.classList.contains("in");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "edge temp");
      $("#edge-layer").append(path);
      const start = incoming ? inPort(p, lastLayout.vertical) : outPort(p, lastLayout.vertical);
      drag = { mode: "connect", from, incoming, path, start, target: null };
      world.classList.add("connecting");
    } else {
      drag = { mode: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false, card: e.target.closest(".card"), edge: e.target.closest("#edge-hits path"), head: e.target.closest(".lane-head") };
    }
    try { vp.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
    e.preventDefault();
  });
  vp.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (drag.mode === "pan") {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      const arranging = !drag.moved && prefs.arrange === "manual" && !store.readOnly && !picking;
      const start = toWorld({ clientX: drag.sx, clientY: drag.sy });
      if (arranging && drag.card) {
        const id = drag.card.dataset.id;
        drag = { mode: "move", id, el: drag.card, p: lastLayout.pos.get(key(id)), start, target: null };
        drag.el.classList.add("moving");
        world.classList.add("dragging");
        return;
      }
      const lane = arranging && drag.head && drag.head.closest(".lane");
      if (lane && lane.dataset.group) {
        drag = { mode: "lane", id: lane.dataset.group, start, target: null };
        world.classList.add("dragging");
        return;
      }
      drag.moved = true;
      vp.classList.add("panning");
      view.x = drag.vx + dx;
      view.y = drag.vy + dy;
      applyView(false);
    } else if (drag.mode === "move") {
      const w = toWorld(e), v = lastLayout.vertical;
      const q = v ? { x: drag.p.x + w.x - drag.start.x, y: drag.p.y } : { x: drag.p.x, y: drag.p.y + w.y - drag.start.y };
      drag.el.style.transform = `translate(${q.x}px, ${q.y}px)`;
      drag.target = dropTarget(drag.id, v ? q.x + CW / 2 : q.y + CH / 2);
      const line = $("#drop-line"), t = drag.target;
      line.hidden = !t;
      if (t) Object.assign(line.style, v
        ? { transform: `translate(${t.line - 1.5}px, ${t.col + 10}px)`, width: "3px", height: `${CH - 20}px` }
        : { transform: `translate(${t.col + 10}px, ${t.line - 1.5}px)`, width: `${CW - 20}px`, height: "3px" });
    } else if (drag.mode === "lane") {
      const w = toWorld(e), L = lastLayout, v = L.vertical, l = L.lanes.find((x) => x.id === drag.id);
      if (!l) return;
      movingLane = { id: drag.id, shift: v ? w.x - drag.start.x : w.y - drag.start.y };
      shiftLane();
      drag.target = laneDropTarget(drag.id, (v ? l.left + l.width / 2 : l.top + l.height / 2) + movingLane.shift);
      const line = $("#drop-line");
      line.hidden = false;
      Object.assign(line.style, v
        ? { transform: `translate(${drag.target.line - 1.5}px, 0)`, width: "3px", height: `${L.height}px` }
        : { transform: `translate(0, ${drag.target.line - 1.5}px)`, width: `${L.width}px`, height: "3px" });
    } else {
      const w = toWorld(e);
      drag.path.setAttribute("d", drag.incoming ? edgePath(w, drag.start, lastLayout.vertical, 30) : edgePath(drag.start, w, lastLayout.vertical, 30));
      const over = document.elementFromPoint(e.clientX, e.clientY);
      const card = over && over.closest(".card");
      const target = card && !same(card.dataset.id, drag.from) ? card : null;
      if (drag.target !== target) {
        if (drag.target) drag.target.classList.remove("drop-target");
        if (target) target.classList.add("drop-target");
        drag.target = target;
      }
    }
  });
  const end = (e) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    vp.classList.remove("panning");
    if (d.mode === "lane") {
      movingLane = null;
      world.classList.remove("dragging");
      $("#drop-line").hidden = true;
      const before = d.target && d.target.before, ids = board.groups.map((g) => g.id);
      const draft = clone(board);
      if (e.type === "pointerup" && d.target) ops.placeGroup(d.id, before)(draft);
      if (sameJson(draft.groups.map((g) => g.id), ids)) return renderGraph();
      commit(ops.placeGroup(d.id, before)).then((ok) => { if (!ok) renderGraph(); });
    } else if (d.mode === "move") {
      d.el.classList.remove("moving");
      world.classList.remove("dragging");
      $("#drop-line").hidden = true;
      const t = d.target, task = get(d.id);
      if (e.type !== "pointerup" || !t || !task) return renderGraph();
      const draft = clone(board);
      ops.move(d.id, t.group, t.before, t.after)(draft);
      if (sameJson(draft.tasks.map((x) => [x.id, x.group]), board.tasks.map((x) => [x.id, x.group]))) return renderGraph();
      const regrouped = t.group !== task.group;
      commit(ops.move(d.id, t.group, t.before, t.after)).then((ok) => {
        if (ok && regrouped) toast(`${d.id} moved to ${t.group ? (board.groups.find((g) => g.id === t.group) || { name: t.group }).name : "Ungrouped"}`);
        if (!ok) renderGraph();
      });
    } else if (d.mode === "connect") {
      d.path.remove();
      world.classList.remove("connecting");
      if (d.target) {
        d.target.classList.remove("drop-target");
        const [task, dep] = d.incoming ? [d.from, d.target.dataset.id] : [d.target.dataset.id, d.from];
        if (e.type === "pointerup") commit(ops.addDep(task, dep)).then((ok) => ok && toast(`${task} now depends on ${dep}`));
      }
    } else if (!d.moved && e.type === "pointerup") {
      if (picking) { if (d.card) pickToggle(d.card.dataset.id); }
      else if (d.edge && !d.card) showEdgeMenu(d.edge, e.clientX, e.clientY);
      else select(d.card ? d.card.dataset.id : null);
    }
  };
  vp.addEventListener("pointerup", end);
  vp.addEventListener("pointercancel", end);
  $("#edge-hits").addEventListener("pointerover", (e) => { if (!drag && !menuEl && !picking && e.target.dataset.from) edgeFor(e.target)?.classList.add("hover"); });
  $("#edge-hits").addEventListener("pointerout", (e) => { if (e.target.dataset.from) edgeFor(e.target)?.classList.remove("hover"); });
  vp.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
    else {
      view.x -= e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX;
      view.y -= e.shiftKey && !e.deltaX ? 0 : e.deltaY;
      applyView(false);
    }
  }, { passive: false });
  $("#cards").addEventListener("pointerover", (e) => {
    const card = e.target.closest(".card");
    const id = card ? card.dataset.id : null;
    if (id !== ui.hover && !drag && !picking) { ui.hover = id; applyFocus(); }
  });
  $("#cards").addEventListener("pointerleave", () => { if (ui.hover) { ui.hover = null; applyFocus(); } });
  $("#zoom-in").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); };
  $("#zoom-out").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); };
  $("#zoom-fit").onclick = () => fit(true);
  $("#zoom-pct").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1 / view.k, r.width / 2, r.height / 2); };
}

// Board view ---------------------------------------------------------------

function renderKanban() {
  const columns = VIEW_STATES.filter((s) => !(prefs.hideDone && s === "done") && (!ui.states.size || ui.states.has(s)));
  const order = new Map(board.groups.map((g, i) => [g.id, i]));
  const tasks = board.tasks
    .map((t, i) => ({ t, i }))
    .filter(({ t }) => matches(t))
    .sort((a, b) => (order.get(a.t.group) ?? 999) - (order.get(b.t.group) ?? 999) || a.i - b.i)
    .map(({ t }) => t);
  $("#kanban").replaceChildren(...columns.map((s) => {
    const items = tasks.filter((t) => vstate(t) === s);
    const head = h("div", { class: "col-head" }, h("span", { class: "dot" }), LABEL[s], h("span", { class: "count" }, items.length));
    if (s === "proposed" && items.length && !store.readOnly) {
      head.append(h("button", { title: "Approve every proposal in this column", onclick: () => approveMany(items.map((t) => t.id)) }, icon("check"), "Approve all"));
    }
    const body = h("div", { class: "col-body" }, items.length ? items.map(kanbanCard) : h("div", { class: "col-empty" }, s === "blocked" ? "Nothing is blocked" : "Empty"));
    const col = h("div", { class: `col s-${s}`, "data-state": s }, head, body);
    if (!store.readOnly) {
      col.addEventListener("dragover", (e) => { if (e.dataTransfer.types.includes("text/kanvas-id")) { e.preventDefault(); col.classList.add("drop"); } });
      col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop"); });
      col.addEventListener("drop", (e) => {
        e.preventDefault();
        col.classList.remove("drop");
        const id = e.dataTransfer.getData("text/kanvas-id"), t = get(id);
        const target = s === "blocked" ? "todo" : s;
        if (t && t.state !== target) commit(ops.state(t.id, t.state, target));
      });
    }
    return col;
  }));
}

function kanbanCard(t) {
  const vs = vstate(t), g = groupOf(t);
  const el = h("div", {
    class: `kcard s-${vs}${same(ui.selected, t.id) ? " sel" : ""}`, "data-id": t.id, draggable: store.readOnly ? null : "true",
    onclick: () => (picking ? pickToggle(t.id) : select(t.id)),
  },
  h("div", { class: "card-head" }, h("span", { class: "cid" }, t.id), h("span", { class: "head-end" }, yoloTag(t), g ? h("span", { class: "gchip", style: `--g:${GROUP_COLORS[board.groups.indexOf(g) % GROUP_COLORS.length]}` }, h("i"), g.name) : null)),
  h("div", { class: "card-title" }, t.title),
  cardFoot(t));
  el.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/kanvas-id", t.id); e.dataTransfer.effectAllowed = "move"; el.classList.add("dragging"); });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  return el;
}

// Detail panel ---------------------------------------------------------------

function select(id) {
  const t = id ? get(id) : null;
  ui.selected = t ? t.id : null;
  ui.editingDesc = false;
  drafts.desc = null;
  ui.editingNote = null;
  drafts.noteEdit = null;
  history.replaceState(null, "", ui.selected ? `#${encodeURIComponent(ui.selected)}` : location.pathname + location.search);
  render();
  if (ui.selected) reveal(ui.selected);
}

function depRow(d, onRemove) {
  const t = get(d), vs = t ? vstate(t) : "blocked";
  return h("div", { class: `dep s-${vs}`, onclick: () => t && select(t.id), title: t ? `${t.id} · ${LABEL[vs]}` : "Missing task" },
    h("span", { class: "dot" }), h("span", { class: "cid" }, t ? t.id : d), h("span", { class: "t" }, t ? t.title : "missing task"),
    h("span", { class: "st" }, t ? LABEL[vs] : "Missing"),
    onRemove && !store.readOnly ? h("button", { title: "Remove dependency", "aria-label": "Remove dependency", onclick: (e) => { e.stopPropagation(); onRemove(); } }, icon("x")) : null);
}

// `asks` marks moves that open a dialog first.
function stateMoves(t) {
  const to = (state) => () => commit(ops.state(t.id, t.state, state));
  switch (vstate(t)) {
    case "proposed": return [{ label: "Approve", icon: "check", run: to("todo"), to: "todo", primary: true }, { label: "Reject", icon: "trash", run: () => removeTask(t), danger: true, asks: true }];
    case "todo": return [{ label: "Start", icon: "play", run: to("doing"), to: "doing", primary: true }];
    case "doing": return [{ label: "Send to review", icon: "check", run: to("review"), to: "review", primary: true }, { label: "Mark done", icon: "check", run: to("done"), to: "done" }, { label: "Pause", icon: "pause", run: to("todo"), to: "todo" }];
    case "review": return [{ label: "Mark done", icon: "check", run: to("done"), to: "done", primary: true }, { label: "Send back", icon: "back", run: () => sendBack(t), to: "todo", asks: true }];
    case "done": return [{ label: "Reopen", icon: "back", run: to("todo"), to: "todo" }];
    default: return [];
  }
}

function yoloAction(t) {
  if (t.yolo) return { label: "Turn off YOLO", icon: "zap", run: () => toggleYolo(t) };
  if (t.state === "review" || t.state === "done") return null;
  const via = yoloVia(t);
  if (via) return { head: `Covered by YOLO on ${via}` };
  return { label: "YOLO up to here…", icon: "zap", run: () => toggleYolo(t) };
}

async function toggleYolo(t) {
  if (t.yolo) {
    if (await commit(ops.yolo(t.id, false))) toast(`YOLO is off for ${t.id}`);
    return;
  }
  if (!prefs.skipYoloWarning) {
    const chain = [...upstreamOf(board, t.id)].map(get).filter((x) => x && x.state !== "done");
    const before = chain.filter((x) => !same(x.id, t.id));
    const inner = before.filter((x) => x.yolo).map((x) => x.id);
    const count = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
    const names = (ids) => (ids.length > 1 ? `${ids.slice(0, -1).join(", ")} and ${ids[ids.length - 1]}` : ids[0]);
    const proposals = chain.filter((x) => x.state === "proposed").length, reviews = before.filter((x) => x.state === "review").length;
    const effects = [proposals ? `approves ${count(proposals, "proposal")}` : null, reviews ? `marks ${count(reviews, "review")} done` : null].filter(Boolean);
    const data = await modal(`YOLO up to ${t.id}?`, [
      h("p", {}, `${before.length ? `Agents finish the ${count(before.length, "unfinished task")} ${t.id} depends on without approval or review, then do ${t.id} and send it to you for review.` : `Agents may start ${t.id} without approval and send it to you for review.`}${inner.length ? ` This takes over the YOLO on ${names(inner)}, so only ${t.id} comes to you for review.` : ""}${effects.length ? ` This ${effects.join(" and ")} now.` : ""}`),
      h("label", { class: "check" }, h("input", { type: "checkbox", name: "skip" }), "Don't ask again"),
    ], { ok: [icon("zap"), "YOLO"], okClass: "yolo-go" });
    if (!data) return;
    if (data.get("skip")) { prefs.skipYoloWarning = true; savePrefs(); }
  }
  if (await commit(ops.yolo(t.id, true))) { toast(`YOLO is on up to ${t.id}. Ctrl+Z undoes it.`); zap(t.id); }
}

function zap(id) {
  if (!lastLayout) return;
  const chain = [...upstreamOf(board, id)].filter((k) => cardEls.has(k) && lastLayout.pos.has(k) && IX.get(k).state !== "done");
  const along = (k) => (lastLayout.vertical ? lastLayout.pos.get(k).y : lastLayout.pos.get(k).x);
  const start = Math.min(...chain.map(along));
  for (const k of chain) {
    const el = cardEls.get(k);
    el.classList.remove("zap");
    void el.offsetWidth;
    el.style.animationDelay = `${Math.min(1200, (along(k) - start) * 0.9)}ms`;
    el.classList.add("zap");
  }
}

// The panel sits left of the graph, so opening or closing it moves the viewport; the view shifts to keep the cards still.
function showPanel(panel, open) {
  if (panel.hidden === !open) return;
  const closing = open ? 0 : panel.offsetWidth;
  panel.hidden = !open;
  const moved = open ? panel.offsetWidth : -closing;
  if (moved && getComputedStyle(panel).position !== "absolute") { view.x -= moved; applyView(false); }
}

const tabbables = (root) => [...root.querySelectorAll("a[href], button, input, textarea, select, [tabindex]")]
  .filter((el) => el.tabIndex >= 0 && !el.disabled && el.getClientRects().length);
const controlName = (el) => `${el.tagName} ${el.getAttribute("aria-label") || el.textContent.trim()}`;
// Leaving a text field from the keyboard lands on the panel, so Tab and Escape carry on from there.
const focusPanel = (field) => { if (!field || document.activeElement !== field) $("#panel").focus({ preventScroll: true }); };

// After a re-render, focus goes to the same control if it is still there, else to the one in its place.
function keepPanelFocus(panel, render) {
  const el = document.activeElement, all = tabbables(panel);
  const was = panel.contains(el) && el !== panel ? { task: panel.dataset.task, name: controlName(el), at: all.indexOf(el) } : null;
  render();
  panel.dataset.task = ui.selected;
  if (!was) return;
  if (was.task !== ui.selected) return panel.focus({ preventScroll: true });
  const now = tabbables(panel), named = now.filter((x) => controlName(x) === was.name);
  const near = (x) => Math.abs(now.indexOf(x) - was.at);
  const target = named.length ? named.reduce((a, b) => (near(b) < near(a) ? b : a)) : now[Math.min(was.at, now.length - 1)];
  (target || panel).focus({ preventScroll: true });
}

function renderPanel() {
  const panel = $("#panel");
  const t = ui.selected && get(ui.selected);
  if (!t) { showPanel(panel, false); return; }
  if (panel.contains(document.activeElement) && document.activeElement.matches("input, textarea, select")) {
    ui.panelStale = true;
    return;
  }
  ui.panelStale = false;
  keepPanelFocus(panel, () => fillPanel(panel, t));
}

function fillPanel(panel, t) {
  showPanel(panel, true);
  const vs = vstate(t), ro = !!store.readOnly;
  const kids = dependents(t);
  const last = t.notes[t.notes.length - 1];
  const noteOnTop = !!last && ["doing", "review", "done"].includes(vs);

  const title = h("textarea", { class: "p-title", rows: 1, value: t.title, "aria-label": "Title", readonly: ro, spellcheck: "false" });
  title.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); focusPanel(); } if (e.key === "Escape") { title.value = t.title; focusPanel(); } });
  title.addEventListener("input", () => autosize(title));
  title.addEventListener("change", () => { const v = title.value.replace(/\s+/g, " ").trim(); if (v && v !== t.title) commit(ops.set(t.id, { title: v })); else title.value = t.title; });

  const g = board.groups.find((x) => x.id === t.group);
  const gColor = g ? GROUP_COLORS[board.groups.indexOf(g) % GROUP_COLORS.length] : "var(--border-strong)";
  const below = (fn, right) => (e) => dropdown(e.currentTarget, fn(), { alignRight: right, gap: 4 });
  const head = h("div", { class: "p-head" },
    h("button", { class: "cid", title: "Copy ID", onclick: () => copy(t.id) }, t.id),
    ro ? h("span", { class: `badge s-${vs}` }, LABEL[vs])
      : h("button", { class: `pick badge s-${vs}`, title: "Change the state", "aria-haspopup": "menu", "aria-expanded": "false", onclick: below(() => stateMenu(t)) }, LABEL[vs], icon("chevron")),
    ro ? (g ? h("span", { class: "gpick pick" }, h("i", { style: `--g:${gColor}` }), g.name) : null)
      : h("button", { class: "gpick pick", title: "Change the group", "aria-haspopup": "menu", "aria-expanded": "false", onclick: below(() => groupMenu(t)) }, h("i", { style: `--g:${gColor}` }), g ? g.name : "No group", icon("chevron")),
    h("span", { class: "spacer" }),
    h("button", { class: "ghost icon-btn", title: "More", "aria-label": "More actions", "aria-haspopup": "menu", "aria-expanded": "false", onclick: below(() => panelMenu(t), true) }, icon("more")),
    h("button", { class: "ghost icon-btn", title: "Close (Esc)", "aria-label": "Close", onclick: () => select(null) }, icon("x")));

  let desc;
  if (ui.editingDesc && !ro) {
    const ta = h("textarea", { value: drafts.desc ?? t.desc, placeholder: "Describe the task. Markdown works.", "aria-label": "Description" });
    const close = () => { ui.editingDesc = false; drafts.desc = null; ta.blur(); };
    const save = () => { const v = ta.value.trim(); close(); if (v !== t.desc) commit(ops.set(t.id, { desc: v })); else renderPanel(); };
    const cancel = () => { close(); renderPanel(); };
    ta.addEventListener("input", () => { drafts.desc = ta.value; });
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { save(); focusPanel(ta); } if (e.key === "Escape") { e.stopPropagation(); cancel(); focusPanel(); } });
    desc = h("div", { class: "desc-edit" }, ta, h("div", { class: "row-end" }, h("span", { class: "hint" }, "Ctrl+Enter to save"), h("button", { onclick: cancel }, "Cancel"), h("button", { class: "primary", onclick: save }, "Save")));
    if (ui.focusDesc) {
      ui.focusDesc = false;
      setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
    }
  } else if (t.desc) {
    desc = h("div", { class: "md", html: markdown(t.desc), ondblclick: ro ? null : editDesc });
  } else {
    desc = ro ? null : h("button", { class: "ghost add-line", onclick: editDesc }, icon("plus"), "Add a description");
  }
  const checks = [...(t.desc || "").matchAll(/^\s*[-*+] \[([ xX])\]/gm)].map((m) => m[1] !== " ");
  const done = checks.filter(Boolean).length;

  const noteBox = h("textarea", { rows: 1, value: drafts.note.get(t.id) || "", placeholder: "Add a note for your agent or yourself", "aria-label": "New note" });
  const form = ro ? null : h("div", { class: `note-form${noteBox.value ? " filled" : ""}` }, noteBox,
    h("div", { class: "row-end" }, h("span", { class: "hint" }, "Markdown · Ctrl+Enter"), h("button", { class: "primary", onclick: () => addNoteNow() }, icon("note"), "Add note")));
  noteBox.addEventListener("input", () => { drafts.note.set(t.id, noteBox.value); form.classList.toggle("filled", !!noteBox.value); autosize(noteBox); });
  const addNoteNow = () => { const v = noteBox.value.trim(); if (!v) return; noteBox.value = ""; drafts.note.delete(t.id); noteBox.blur(); commit(ops.note(t.id, v)); };
  noteBox.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { addNoteNow(); focusPanel(noteBox); } if (e.key === "Escape") focusPanel(); });
  const earlier = noteOnTop ? t.notes.slice(0, -1) : t.notes;

  panel.replaceChildren(head,
    h("div", { class: "p-body" },
      title,
      nowCard(t, vs, ro, noteOnTop ? last : null),
      desc ? h("section", { class: "p-sec" },
        t.desc || ui.editingDesc ? h("div", { class: "section-head" }, "Description",
          checks.length ? [h("span", { class: "lane-bar", title: `${done} of ${checks.length} checked` }, h("i", { style: `width:${(100 * done) / checks.length}%` })), h("span", { class: "count" }, `${done}/${checks.length}`)] : null,
          ro || ui.editingDesc ? null : h("button", { class: "ghost", title: "Edit the description (or double-click it)", onclick: editDesc }, icon("edit"), "Edit")) : null,
        desc) : null,
      ro && !t.deps.length && !kids.length ? null : h("section", { class: "p-sec" },
        h("div", { class: "section-head" }, "Dependencies",
          ro ? null : h("button", { class: "ghost", title: "Add tasks that block this one", onclick: () => addDepDialog(t) }, icon("plus"), "Add")),
        t.deps.length || kids.length ? h("div", { class: "rel" },
          t.deps.length ? [h("div", { class: "rel-label" }, "Blocked by"), t.deps.map((d) => depRow(d, () => commit(ops.removeDep(t.id, d))))] : null,
          kids.length ? [h("div", { class: "rel-label" }, "Blocks"), kids.map((k) => depRow(k.id))] : null)
          : h("div", { class: "empty-line" }, "None yet.")),
      h("section", { class: "p-sec" },
        h("div", { class: "section-head" }, noteOnTop && earlier.length ? "Earlier notes" : "Notes", earlier.length ? h("span", { class: "count" }, earlier.length) : null),
        earlier.length ? h("div", { class: "notes" }, earlier.map((n) => noteEl(t, n, ro)))
          : noteOnTop ? null : h("div", { class: "empty-line" }, "No notes yet."),
        form),
    ),
  );
  for (const ta of panel.querySelectorAll("textarea")) autosize(ta);
  for (const a of panel.querySelectorAll("a.tref")) a.addEventListener("click", (e) => { e.preventDefault(); select(a.dataset.ref); });
}

function editDesc() { ui.editingDesc = true; ui.focusDesc = true; renderPanel(); }

function autosize(ta) {
  if (ta.closest(".desc-edit")) return;
  ta.style.height = "auto";
  ta.style.height = `${ta.scrollHeight + 2}px`;
}

// The block under the title: where the task stands, what matters for that state, and what to do next.
function nowCard(t, vs, ro, note) {
  const ref = (id) => h("a", { class: "tref", href: `#${id}`, "data-ref": id }, id);
  const list = (ids) => ids.map((id, i) => [i ? (i === ids.length - 1 ? " and " : ", ") : "", ref(id)]);
  const who = note ? h("span", { class: "now-who", title: noteTimes(note) }, agentMark(note.by || "?"), `${note.by || "?"} · ${ago(note.at)}${note.edited ? ` · edited ${ago(note.edited)}` : ""}`) : null;
  const editing = note && !ro && isEditingNote(t, note);
  const waits = unmet(t);
  const [mark, headline, body] = {
    proposed: [icon("spark"), "Proposed", h("p", {}, "Approve it to make it available for work, or reject it.")],
    blocked: [icon("lock"), "Blocked", h("p", {}, "Starts when ", list(waits), waits.length > 1 ? " are done." : " is done.")],
    todo: [icon("play"), "Ready to start", ro ? null : h("p", {}, "Start it yourself, or tell an agent ", h("button", { class: "say", title: "Copy", onclick: () => copy(`work on ${t.id}`) }, `work on ${t.id}`, icon("copy")))],
    doing: [h("i", { class: "live" }), "In progress", null],
    review: [icon("check"), "Ready for your review", null],
    done: [icon("check"), "Done", null],
  }[vs];
  const via = yoloVia(t), complete = t.yolo && t.state === "review";
  const yolo = via || complete ? h("div", { class: "now-yolo" }, icon("zap"),
    h("span", {}, complete ? ["YOLO chain complete.", via ? [" The YOLO chain of ", ref(via), " waits for your review."] : null]
      : !same(via, t.id) ? ["Covered by YOLO on ", ref(via), ": no approval or review needed."]
      : "YOLO: agents finish everything it needs, then send it to you for review."),
    t.yolo && !ro ? h("button", { onclick: () => toggleYolo(t) }, "Turn off") : null) : null;
  const ya = ro || editing || t.yolo || via || !["proposed", "todo", "blocked"].includes(vs) ? null : yoloAction(t);
  const moves = ro || editing ? [] : stateMoves(t);
  return h("div", { class: `now s-${vs}` },
    h("div", { class: "now-head" }, mark, headline, who, note && !ro && !editing ? noteEditBtn(t, note) : null),
    editing ? noteEditor(t, note)
      : note ? h("div", { class: "now-body md", html: markdown(note.text || ""), ondblclick: ro ? null : () => editNote(t, note) })
      : body ? h("div", { class: "now-body md" }, body) : null,
    yolo,
    moves.length || ya ? h("div", { class: "now-actions" },
      moves.map((m) => h("button", { class: m.primary ? `primary to s-${m.to}` : m.danger ? "danger" : "", title: m.to && !m.primary ? `Moves it to ${LABEL[m.to]}` : null, onclick: m.run }, icon(m.icon), m.label)),
      ya ? h("button", { class: "yolo-btn", onclick: ya.run }, icon(ya.icon), ya.label) : null) : null);
}

function stateMenu(t) {
  return [{ head: "Move to" }, ...STATES.map((s) => ({
    label: [h("span", { class: `dot s-${s}` }), LABEL[s]], icon: s === t.state ? "check" : null,
    run: () => { if (s !== t.state) commit(ops.state(t.id, t.state, s)); },
  }))];
}

function groupMenu(t) {
  return [{ head: "Group" }, ...board.groups.map((g, i) => ({
    label: [h("i", { class: "gsw", style: `--g:${GROUP_COLORS[i % GROUP_COLORS.length]}` }), g.name], icon: g.id === t.group ? "check" : null,
    run: () => { if (g.id !== t.group) commit(ops.set(t.id, { group: g.id })); },
  })), "sep", { label: "No group", icon: t.group ? null : "check", run: () => { if (t.group) commit(ops.set(t.id, { group: null })); } }];
}

function panelMenu(t) {
  const say = { label: `Copy "work on ${t.id}"`, icon: "copy", run: () => copy(`work on ${t.id}`) };
  return cardMenu(t).filter((it) => !(it && (it.icon === "open" || it.to))).flatMap((it) => (it && it.icon === "copy" ? [it, say] : [it]));
}

function noteEl(t, n, ro) {
  const by = String(n.by || "?");
  const editing = !ro && isEditingNote(t, n);
  return h("div", { class: "note" },
    h("div", { class: "avatar", style: `--a:${by === "human" ? "#64748b" : colorFor(by)}`, title: by }, by.slice(0, 1)),
    h("div", { class: "note-main" },
      h("div", { class: "note-meta", title: noteTimes(n) }, h("b", {}, by), " · ", ago(n.at), n.edited ? ` · edited ${ago(n.edited)}` : null, ro || editing ? null : noteEditBtn(t, n)),
      editing ? noteEditor(t, n) : h("div", { class: "note-text md", html: markdown(n.text || ""), ondblclick: ro ? null : () => editNote(t, n) })));
}

function noteTimes(n) {
  const at = (iso) => (Date.parse(iso) ? new Date(iso).toLocaleString() : iso || "");
  return n.edited ? `Written ${at(n.at)}\nEdited ${at(n.edited)}` : at(n.at);
}

function isEditingNote(t, n) {
  const e = ui.editingNote;
  return !!e && same(e.id, t.id) && sameNote(e, n) && e.rank === noteRank(t, n);
}

function editNote(t, n) {
  ui.editingNote = { id: t.id, at: n.at, by: n.by, text: n.text, rank: noteRank(t, n) };
  ui.focusNote = true;
  drafts.noteEdit = null;
  renderPanel();
}

function noteEditBtn(t, n) {
  return h("button", { class: "ghost icon-btn note-btn", title: "Edit or delete the note (or double-click it)", "aria-label": "Edit note", onclick: () => editNote(t, n) }, icon("edit"));
}

function noteEditor(t, n) {
  const ta = h("textarea", { rows: 2, value: drafts.noteEdit ?? n.text ?? "", "aria-label": "Edit note" });
  const close = () => { ui.editingNote = null; drafts.noteEdit = null; ta.blur(); };
  const cancel = () => { close(); renderPanel(); };
  const save = () => {
    const v = ta.value.trim();
    if (!v) return ta.focus();
    close();
    if (v !== n.text) commit(ops.editNote(t.id, n, noteRank(t, n), v)); else renderPanel();
  };
  const remove = () => { close(); commit(ops.removeNote(t.id, n, noteRank(t, n))).then((ok) => ok && toast("Note deleted. Ctrl+Z brings it back.")); };
  ta.addEventListener("input", () => { drafts.noteEdit = ta.value; autosize(ta); });
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { save(); focusPanel(ta); } if (e.key === "Escape") { e.stopPropagation(); cancel(); focusPanel(); } });
  if (ui.focusNote) {
    ui.focusNote = false;
    setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
  }
  return h("div", { class: "note-edit" }, ta,
    h("div", { class: "row-end" },
      h("button", { class: "ghost danger", onclick: remove }, icon("trash"), "Delete"),
      h("span", { class: "hint" }),
      h("button", { onclick: cancel }, "Cancel"),
      h("button", { class: "primary", title: "Save (Ctrl+Enter)", onclick: save }, "Save")));
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast(`Copied ${text}`); } catch (e) { toast(text); }
}

async function removeTask(t) {
  const kids = dependents(t);
  const data = await modal(`Delete ${t.id}?`, h("p", {}, `"${t.title}" will be removed${kids.length ? `, along with the dependency from ${kids.map((k) => k.id).join(", ")}` : ""}. Git history keeps the old version.`), { ok: "Delete", danger: true });
  if (!data) return;
  if (same(ui.selected, t.id)) ui.selected = null;
  commit(ops.remove(t.id));
}

async function sendBack(t) {
  const data = await modal(`Send ${t.id} back`, [
    h("p", {}, "The task returns to To do. Your feedback is added as a note, so the agent sees it when it starts again."),
    h("label", { class: "field" }, "What needs to change?", h("textarea", { name: "text", rows: 4, required: true, placeholder: "e.g. The retry loop never gives up; cap it at 5 attempts." })),
  ], { ok: "Send back" });
  if (data) commit(ops.state(t.id, t.state, "todo", `Sent back: ${data.get("text").trim()}`));
}

function approveMany(ids) {
  commit(ops.approve(ids)).then((ok) => ok && toast(`Approved ${ids.length} proposal${ids.length > 1 ? "s" : ""}`));
}

// Dialogs ---------------------------------------------------------------------

function modal(title, content, { ok = "Save", danger = false, cancel = "Cancel", okClass = "" } = {}) {
  return new Promise((resolve) => {
    const okBtn = h("button", { value: "ok", class: okClass || (danger ? "danger primary" : "primary") }, ok);
    const form = h("form", { method: "dialog" }, h("h3", {}, title), content,
      h("div", { class: "dlg-actions" }, okBtn, cancel ? h("button", { value: "cancel", formnovalidate: true }, cancel) : null));
    const dlg = h("dialog", { class: "dlg" }, form);
    form.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(okBtn); } });
    dlg.addEventListener("close", () => {
      if (dlg.dataset.paused) return;
      const data = dlg.returnValue === "ok" ? new FormData(form) : null;
      dlg.remove();
      resolve(data);
    });
    document.body.append(dlg);
    dlg.showModal();
    (form.querySelector("input:not([type=checkbox]), textarea, select") || okBtn).focus();
  });
}

// Multi-select of tasks: chips for the chosen ones above a filtered list, or
// clicks on the graph. `reason(t)` explains why t cannot be chosen, or returns null.
function taskPicker({ chosen = [], placeholder, label, prompt, reason = () => null }) {
  const picked = chosen.map(get).filter(Boolean).map((t) => t.id);
  const input = h("input", { autocomplete: "off", placeholder, "aria-label": label, role: "combobox", "aria-expanded": "false" });
  const box = h("div", { class: "pick-box", onclick: (e) => { if (!e.target.closest("button")) input.focus(); } });
  const list = h("div", { class: "pick-list", role: "listbox", hidden: true, onmousedown: (e) => e.preventDefault() });
  let shown = [], active = 0;
  const isPicked = (t) => picked.some((id) => same(id, t.id));

  const drawChips = () => {
    for (let i = picked.length - 1; i >= 0; i--) if (!get(picked[i])) picked.splice(i, 1);
    box.replaceChildren(...picked.map((id) => {
      const t = get(id);
      return h("span", { class: `pick-chip s-${vstate(t)}`, title: `${t.id} · ${t.title}` },
        h("span", { class: "dot" }), h("span", { class: "cid" }, t.id), h("span", { class: "t" }, t.title),
        h("button", { type: "button", "aria-label": `Remove ${t.id}`, onclick: () => { picked.splice(picked.indexOf(id), 1); drawChips(); drawList(); input.focus(); } }, icon("x")));
    }), input);
  };

  const drawList = () => {
    const q = input.value.trim().toLowerCase();
    const text = (t) => `${t.id} ${t.title} ${(groupOf(t) || {}).name || ""}`.toLowerCase();
    const idMatch = (t) => (q && key(t.id).startsWith(key(q)) ? 0 : 1);
    shown = board.tasks.filter((t) => !isPicked(t) && (!q || text(t).includes(q)))
      .map((t) => ({ t, why: reason(t) }))
      .sort((a, b) => (!!a.why - !!b.why) || (idMatch(a.t) - idMatch(b.t)));
    if (active >= shown.length || (shown[active] && shown[active].why)) active = Math.max(0, shown.findIndex((x) => !x.why));
    list.replaceChildren(...compact(shown.map(({ t, why }, i) => {
      const g = groupOf(t);
      return h("div", { class: `pick-opt s-${vstate(t)}${i === active ? " on" : ""}${why ? " off" : ""}`, role: "option", "aria-disabled": why ? "true" : null, title: why || `${t.id} · ${LABEL[vstate(t)]}`, onclick: () => add(i), onmousemove: () => { if (active !== i && !why) { active = i; drawList(); } } },
        h("span", { class: "dot" }), h("span", { class: "cid" }, t.id), h("span", { class: "t" }, t.title),
        h("span", { class: "note" }, why || (g ? g.name : "")));
    }), shown.length ? null : h("div", { class: "pick-empty" }, q ? "No matching task" : "No other tasks")));
    const on = list.querySelector(".on");
    if (on) on.scrollIntoView({ block: "nearest" });
  };
  const open = (yes) => { list.hidden = !yes; input.setAttribute("aria-expanded", String(yes)); if (yes) drawList(); };
  const add = (i) => {
    const x = shown[i];
    if (!x || x.why) return;
    picked.push(x.t.id);
    input.value = "";
    drawChips();
    drawList();
    input.focus();
  };

  input.addEventListener("focus", () => open(true));
  input.addEventListener("blur", () => open(false));
  input.addEventListener("input", () => { active = 0; open(true); });
  input.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const step = (d) => {
      for (let i = active + d; i >= 0 && i < shown.length; i += d) if (!shown[i].why) { active = i; break; }
      drawList();
    };
    if (e.key === "ArrowDown") { e.preventDefault(); if (list.hidden) open(true); else step(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
    else if (e.key === "Enter" && (!list.hidden || input.value)) { e.preventDefault(); add(active); }
    else if (e.key === "Escape" && !list.hidden) { e.preventDefault(); e.stopPropagation(); open(false); }
    else if (e.key === "Backspace" && !input.value && picked.length) { picked.pop(); drawChips(); drawList(); }
  });
  const self = {
    ids: picked, prompt, reason,
    has: (id) => picked.some((x) => same(x, id)),
    // Adds or removes a task; returns why it cannot be added, if so.
    toggle: (id) => {
      const t = get(id);
      if (!t) return null;
      const i = picked.findIndex((x) => same(x, id));
      if (i >= 0) picked.splice(i, 1);
      else { const why = reason(t); if (why) return why; picked.push(t.id); }
      drawChips();
      return null;
    },
    reset: (ids) => { picked.splice(0, picked.length, ...ids); drawChips(); },
  };
  const graphBtn = h("button", { type: "button", class: "ghost pick-graph", onclick: (e) => pickOnGraph(self, e.target.closest("dialog")) }, icon("graph"), "Pick on graph");
  self.el = h("div", { class: "picker" }, box, list, graphBtn);
  drawChips();
  return self;
}

// While picking, the dialog is closed but kept, and card clicks toggle tasks in the picker.
let picking = null;

function pickOnGraph(picker, dlg) {
  const view = prefs.view;
  dlg.dataset.paused = "1";
  dlg.close();
  closeMenu();
  const count = h("b"), before = [...picker.ids];
  const bar = h("div", { class: "pick-bar", role: "status" },
    icon("graph"), h("span", {}, picker.prompt, " · ", count, " chosen"),
    h("span", { class: "hint" }, "Click cards to add or remove"),
    h("button", { onclick: () => picking.cancel() }, "Cancel"),
    h("button", { class: "primary", onclick: () => picking.finish() }, icon("check"), "Done"));
  picking = {
    picker, bar,
    update: () => { count.textContent = picker.ids.length; },
