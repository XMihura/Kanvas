<script id="kanvas-snapshot" type="application/json"></script>
<style>
:root {
  --bg: #f3f4f7; --surface: #fff; --surface-2: #f7f8fa; --border: #e1e4ea; --border-strong: #c6ccd6;
  --text: #151a25; --muted: #5a6577; --faint: #939cab; --accent: #4f46e5; --accent-text: #fff; --raise: #fff;
  --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 1px 3px rgb(16 24 40 / .07);
  --shadow-lg: 0 14px 34px rgb(16 24 40 / .14), 0 3px 8px rgb(16 24 40 / .07);
  --proposed: #9b51e0; --todo: #0b94d8; --blocked: #8d97a7; --doing: #f5650f; --review: #e03a85; --done: #16a34a;
  --yolo: #eda200; --y1: #fff1a8; --y2: #ffc61a; --y3: #ff9500; --y4: #ff6200; --yolo-ink: #3a2000;
  --yolo-fill: linear-gradient(100deg, var(--y1), var(--y2) 30%, var(--y3) 70%, var(--y4));
  --edge: #cfd4dc; --edge-open: #6f7a8c; --lane: rgb(15 23 42 / .022); --grid: #dfe2e8;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --cw: 240px; --ch: 96px;
}
[data-theme="dark"] {
  --bg: #0d0f14; --surface: #161920; --surface-2: #1c2028; --border: #282d38; --border-strong: #3a4150;
  --text: #e6e8ec; --muted: #a0a8b6; --faint: #6b7385; --accent: #8b93ff; --accent-text: #0d0f14; --raise: #2a2f3a;
  --shadow: 0 1px 2px rgb(0 0 0 / .45); --shadow-lg: 0 14px 34px rgb(0 0 0 / .55);
  --proposed: #b98af5; --todo: #3bb4f0; --blocked: #7a8597; --doing: #ff8a3d; --review: #f06aa8; --done: #3fcf78; --yolo: #ffc53d;
  --edge: #343a47; --edge-open: #7a8496; --lane: rgb(255 255 255 / .022); --grid: #1f232c;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 var(--sans); color: var(--text); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; line-height: 1.3; }
button:hover { border-color: var(--border-strong); background: var(--surface-2); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.primary:hover { filter: brightness(1.07); background: var(--accent); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover { background: var(--surface-2); border-color: var(--border); }
button.danger { color: #dc2626; }
button.danger.primary { background: #dc2626; border-color: #dc2626; color: #fff; }
button.icon-btn { padding: 5px; }
input, select, textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; min-width: 0; }
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; border-color: var(--accent); }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.icon { display: inline-flex; flex: none; }
.icon svg { width: 16px; height: 16px; }
.s-proposed { --c: var(--proposed); } .s-todo { --c: var(--todo); } .s-blocked { --c: var(--blocked); }
.s-doing { --c: var(--doing); } .s-review { --c: var(--review); } .s-done { --c: var(--done); }
.dot { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 650; padding: 1px 6px; border-radius: 4px; color: color-mix(in srgb, var(--c) 78%, var(--text)); background: color-mix(in srgb, var(--c) 16%, transparent); white-space: nowrap; }
:is(.card, .kcard):is(.s-doing, .s-review) .badge { background: var(--c); color: #fff; }
.readonly .edit-only { display: none !important; }

/* Header */
header.top { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 6; }
header.top > .tools > button, header.top > #help, .board-title { height: 30px; }
.brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
.brand > :not(#title-slot) { flex: none; }
#title-slot { display: flex; min-width: 0; }
.logo { width: 22px; height: 22px; flex: none; margin-right: 2px; }
.board-title { gap: 2px; padding: 0 3px 0 6px; font-weight: 650; font-size: 15px; border-color: transparent; background: none; max-width: 30ch; min-width: 0; }
.board-title .t { overflow: hidden; text-overflow: ellipsis; }
.board-title .icon { color: var(--faint); }
.board-title .icon svg { width: 14px; height: 14px; }
.board-title:hover, .board-title.menu-target { background: var(--surface-2); border-color: transparent; }
.title-input { font-weight: 650; font-size: 15px; width: 24ch; height: 30px; }
.spacer { flex: 1; }
.tools { display: flex; align-items: center; gap: 6px; flex: none; }
.track { display: inline-flex; align-items: center; flex: none; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); }
.track > button { height: 24px; padding: 0 8px; gap: 6px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 13px; }
.track > button:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
.track > button.on { background: var(--raise); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgb(16 24 40 / .08); }
.schip { padding: 0 7px; font-size: 12.5px; }
.schip b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
.track > .schip.on { background: color-mix(in srgb, var(--c) 15%, var(--raise)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 65%, transparent); font-weight: 400; }
.schip.zero { opacity: .5; }
.schip.off .dot { display: none; }
.schip.off .icon { color: var(--c); }
.schip.off .icon svg { width: 14px; height: 14px; }
.schip.off b { color: var(--faint); }
.search { position: relative; display: flex; align-items: center; }
.search input { height: 30px; width: 170px; padding: 0 26px 0 28px; }
.search .sicon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; display: flex; }
.search kbd { position: absolute; right: 7px; pointer-events: none; }
.search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
#display .icon:last-child svg { width: 13px; height: 13px; }
#display .icon:last-child { color: var(--faint); margin-left: -2px; }
#display.menu-target, #help.menu-target { background: var(--surface-2); border-color: var(--border-strong); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); padding: 0 4px; white-space: nowrap; }
.sync:focus-visible, .meter:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 4px; }
.sync .dot { --c: var(--faint); border-radius: 50%; }
.sync.ok .dot { --c: var(--done); box-shadow: 0 0 0 3px color-mix(in srgb, var(--done) 22%, transparent); }
.sync.bad .dot { --c: var(--todo); }
.sync.warn .dot { --c: var(--doing); }
.meter { display: inline-flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter b { color: var(--text); font-weight: 650; }
.progress { display: flex; width: 64px; height: 6px; border-radius: 2px; overflow: hidden; background: var(--border); }
.progress span { background: var(--c); transition: flex-grow .3s; }
.yolo-chip { gap: 5px; padding: 3px 9px 3px 7px; border: 0; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--yolo-ink); background: var(--yolo-fill); background-size: 200% 100%; box-shadow: 0 0 14px color-mix(in srgb, var(--y3) 45%, transparent); animation: yolo-fire 2.4s ease-in-out infinite alternate; }
.yolo-chip:hover { color: var(--yolo-ink); background: var(--yolo-fill); background-size: 200% 100%; filter: brightness(1.06); }
.yolo-chip .icon svg { width: 13px; height: 13px; fill: currentColor; }
.yolo-chip b { font-variant-numeric: tabular-nums; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 7px 14px; font-size: 13px; background: color-mix(in srgb, var(--doing) 10%, var(--surface)); border-bottom: 1px solid color-mix(in srgb, var(--doing) 35%, var(--border)); }
.banner.error { background: color-mix(in srgb, var(--todo) 9%, var(--surface)); border-color: color-mix(in srgb, var(--todo) 35%, var(--border)); }
.banner ul { margin: 0; padding-left: 18px; }
.banner button { padding: 1px 8px; font-size: 12px; margin-left: auto; }

/* Layout */
main { flex: 1; position: relative; min-height: 0; display: flex; }
.view { flex: 1; min-width: 0; position: relative; }

/* Graph view */
#viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background-color: var(--bg); background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 22px 22px; }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world.animate { transition: transform .32s cubic-bezier(.2, .7, .2, 1); }
.lane { position: absolute; left: 0; border-radius: 12px; background: var(--lane); border: 1px solid var(--border); }
.lane-head { position: absolute; top: 0; left: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; font-size: 13px; color: var(--muted); }
.lane-head .lane-name { font-weight: 650; color: var(--text); }
.lane-head .lane-prefix { font: 600 11px var(--mono); color: var(--faint); }
.lane-head .lane-count { font-size: 12px; font-variant-numeric: tabular-nums; }
.lane-head button { padding: 2px; border-color: transparent; background: transparent; color: var(--faint); }
.lane-head button:hover { color: var(--text); border-color: var(--border); }
.lane-swatch { width: 10px; height: 10px; border-radius: 2px; }
.lane-bar { width: 42px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
.lane-bar i { display: block; height: 100%; background: var(--done); }
.lane-empty { position: absolute; left: 14px; top: 40px; width: var(--cw); height: 52px; border: 1.5px dashed var(--border-strong); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 12.5px; }
svg#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; transition: opacity .15s; }
.edge.open { stroke: var(--edge-open); }
.edge.related { stroke: var(--accent); stroke-width: 2.2; }
.edge.temp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; }
.edge.live { stroke: var(--doing); stroke-width: 2; stroke-dasharray: 7 5; animation: flow 1s linear infinite; }
.edge.yolo { stroke: var(--yolo); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 2.5px color-mix(in srgb, var(--y2) 70%, transparent)); }
@keyframes flow { to { stroke-dashoffset: -14; } }
.m-met { fill: var(--edge); } .m-open { fill: var(--edge-open); } .m-hl { fill: var(--accent); } .m-live { fill: var(--doing); } .m-yolo { fill: var(--yolo); }
#edge-hits path { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edge.implied:not(.shown), #edge-hits path.implied:not(.shown) { display: none; }
.edge.implied { stroke-dasharray: 5 4; }
.edge.hover, .edge.menu-target { stroke: var(--accent); stroke-width: 2.6; }
#world.focusing .edge.hover, #world.focusing .edge.menu-target { opacity: 1; }
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); padding: 9px 11px 8px; border-radius: 10px; background: color-mix(in srgb, var(--c) 8%, var(--surface)); border: 1.5px solid var(--c); box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 3px; user-select: none; transition: opacity .15s, box-shadow .15s; }
.card:hover { box-shadow: var(--shadow-lg); }
[data-theme="dark"] :is(.card, .kcard) { background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
:is(.card, .kcard).s-proposed { border-style: dashed; }
:is(.card, .kcard).s-blocked, [data-theme="dark"] :is(.card, .kcard).s-blocked { border-color: color-mix(in srgb, var(--c) 80%, var(--border)); background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--c) 11%, var(--surface)) 0 5px, var(--surface) 5px 10px); }
:is(.card, .kcard).s-done { border-color: color-mix(in srgb, var(--c) 55%, var(--border)); }
:is(.card, .kcard).s-done .card-title { color: var(--muted); }
:is(.card, .kcard).s-review { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 16%, transparent), var(--shadow); }
:is(.card, .kcard).s-doing { border-color: color-mix(in srgb, var(--c) 40%, var(--surface)); }
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
:is(.card, .kcard).s-doing::before, :is(.card, .kcard).yolo::after { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 2px; pointer-events: none; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 2.4s linear infinite; }
:is(.card, .kcard).s-doing::before { background: conic-gradient(from var(--spin), transparent 0 55%, color-mix(in srgb, var(--c) 50%, transparent) 75%, var(--c) 97%, transparent); }
:is(.card, .kcard).yolo::after { inset: -4.5px; padding: 2.5px; border-radius: 13px; background: conic-gradient(from var(--spin), var(--y1), var(--y2), var(--y3), var(--y4), var(--y3), var(--y2), var(--y1)); animation-duration: 3.2s; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--y3) 60%, transparent)); }
@keyframes spin { to { --spin: 1turn; } }
.card.sel, .kcard.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c), var(--shadow-lg); }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--doing); flex: none; animation: live 1.6s ease-out infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--doing) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
.agent { width: 15px; height: 15px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 750; color: #fff; background: var(--a); text-transform: uppercase; flex: none; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.head-end { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.yolo-tag { display: inline-flex; align-items: center; gap: 2px; font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 2px 6px 2px 4px; border-radius: 4px; color: var(--yolo-ink); background: var(--yolo-fill); background-size: 200% 100%; box-shadow: 0 0 10px color-mix(in srgb, var(--y3) 50%, transparent); animation: yolo-fire 2.4s ease-in-out infinite alternate; }
.yolo-tag .icon svg { width: 11px; height: 11px; fill: currentColor; }
.yolo-mark { display: inline-flex; color: var(--yolo); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--yolo) 80%, transparent)); }
.yolo-mark .icon svg { width: 13px; height: 13px; fill: currentColor; }
.yolo-btn .icon svg, .yolo-go .icon svg { fill: currentColor; }
@keyframes yolo-fire { from { background-position: 0% 0; } to { background-position: 100% 0; } }
.yolo-btn { font-weight: 650; border: 1.5px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(100deg, var(--y1), var(--y2), var(--y3), var(--y4)) border-box; }
.yolo-btn:hover { border-color: transparent; background: linear-gradient(color-mix(in srgb, var(--y2) 9%, var(--surface)), color-mix(in srgb, var(--y2) 9%, var(--surface))) padding-box, linear-gradient(100deg, var(--y1), var(--y2), var(--y3), var(--y4)) border-box; }
.yolo-btn .icon { color: var(--y3); }
button.yolo-go, button.yolo-go:hover { border: 0; color: var(--yolo-ink); font-weight: 800; letter-spacing: .06em; background: var(--yolo-fill); box-shadow: 0 0 16px color-mix(in srgb, var(--y3) 45%, transparent); }
.card.zap { animation: zap .9s ease-out; }
@keyframes zap { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--y2) 90%, transparent); filter: brightness(1.15); } 100% { box-shadow: 0 0 0 16px transparent; } }
.cid { font: 600 11.5px/1.2 var(--mono); color: var(--muted); letter-spacing: .01em; }
.card-title { font-weight: 600; font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.card-foot > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-foot .icon svg { width: 12px; height: 12px; }
.card-foot .grow { flex: 1; min-width: 0; display: block; }
.card-foot .who { display: flex; align-items: center; gap: 5px; }
.handle { position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--surface); border: 2px solid var(--c); opacity: 0; cursor: crosshair; transition: opacity .15s, scale .15s; }
.handle.in { right: auto; left: -8px; }
#world.vertical .handle { right: auto; top: auto; left: 50%; bottom: -8px; margin: 0 0 0 -8px; }
#world.vertical .handle.in { top: -8px; bottom: auto; }
.card:hover .handle, #world.connecting .handle { opacity: 1; }
.handle:hover { scale: 1.25; }
#world.focusing .card:not(.related) { opacity: .3; }
#world.focusing .edge:not(.related) { opacity: .2; }
.card.dim { opacity: .2 !important; }
.card.drop-target, .card.menu-target, .kcard.menu-target { box-shadow: 0 0 0 2px var(--accent), var(--shadow-lg); }
#world.manual .card, #world.manual .lane-head { cursor: grab; }
.lane.moving { z-index: 1; box-shadow: 0 0 0 2px var(--accent), var(--shadow-lg); opacity: .75; }
#world .card.moving { z-index: 5; cursor: grabbing; box-shadow: 0 0 0 2px var(--accent), var(--shadow-lg); opacity: .8; }
#world.dragging .edge { opacity: .35; }
#drop-line { position: absolute; left: 0; top: 0; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); pointer-events: none; z-index: 6; }
.card.enter { animation: enter .3s ease-out; }
.card.flash { animation: flash 1.6s ease-out; }
@keyframes enter { from { opacity: 0; scale: .94; } }
@keyframes flash { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 85%, transparent); scale: 1.04; } 25% { scale: 1; } 60% { box-shadow: 0 0 0 14px transparent; } }
.zoombar { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 1px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); z-index: 2; }
.zoombar button { height: 28px; min-width: 28px; justify-content: center; padding: 0 5px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); }
.zoombar button:hover { background: var(--surface-2); color: var(--text); }
.zoombar .pct { min-width: 50px; font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.zoombar .zsep { width: 1px; height: 18px; margin: 0 3px; background: var(--border); }
.hint-bar { position: absolute; left: 14px; bottom: 14px; font-size: 12px; color: var(--faint); z-index: 2; pointer-events: none; }
.empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 1; }
.empty > div { pointer-events: auto; text-align: center; max-width: 420px; padding: 26px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.empty h2 { margin: 0 0 6px; font-size: 18px; }
.empty p { margin: 0 0 14px; color: var(--muted); }
.empty code { font: 12px var(--mono); background: var(--surface-2); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); }

/* Board view */
#kanban { position: absolute; inset: 0; display: flex; gap: 12px; padding: 14px; overflow-x: auto; }
.col { flex: 1 0 214px; max-width: 360px; display: flex; flex-direction: column; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; min-height: 0; transition: border-color .15s, background .15s; }
.col.drop { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface-2)); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-weight: 650; }
.col-head .count { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.col-head button { margin-left: auto; padding: 2px 8px; font-size: 12px; }
.col-body { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
.col-empty { color: var(--faint); font-size: 12.5px; text-align: center; padding: 18px 6px; border: 1.5px dashed var(--border); border-radius: 8px; }
.kcard { position: relative; padding: 9px 11px; border-radius: 8px; background: color-mix(in srgb, var(--c) 8%, var(--surface)); border: 1.5px solid var(--c); box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.kcard:hover { box-shadow: var(--shadow-lg); }
.kcard.dragging { opacity: .4; }
.kcard.flash { animation: flash 1.6s ease-out; }
.kcard .card-title { -webkit-line-clamp: 3; }
.gchip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
.gchip i { width: 8px; height: 8px; border-radius: 2px; background: var(--g); }

/* Detail panel */
#panel { width: 430px; flex: none; border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; z-index: 4; }
#panel:focus { outline: none; }
#panel:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -2px; }
.p-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 9px 10px 9px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.p-head .cid { padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-2); font-size: 12.5px; line-height: 1.3; cursor: copy; }
.p-head .cid:hover { border-color: var(--border-strong); background: var(--surface-2); }
.p-head .badge { font-size: 12px; padding: 3px 7px; }
.pick { gap: 3px; padding: 3px 4px 3px 8px; border-radius: 4px; font-size: 12px; line-height: 1.3; }
.pick .icon svg { width: 13px; height: 13px; }
.pick.badge { border: 0; }
.pick.badge:hover { background: color-mix(in srgb, var(--c) 28%, transparent); }
.gpick { gap: 6px; border-color: transparent; background: transparent; color: var(--muted); }
.gpick:hover { color: var(--text); background: var(--surface-2); border-color: transparent; }
.gpick i, .ctx-menu .gsw { width: 8px; height: 8px; border-radius: 2px; background: var(--g); flex: none; }
.ctx-menu .gsw { display: inline-block; margin-right: 8px; }
.ctx-menu .lbl .dot { display: inline-block; margin-right: 8px; }
.p-body { padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
.p-title { display: block; width: calc(100% + 12px); margin: 0 -6px -4px; padding: 3px 6px; border-color: transparent; background: transparent; font-size: 19px; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; resize: none; overflow: hidden; }
.p-title:hover { border-color: var(--border); }
.now { display: flex; flex-direction: column; gap: 9px; padding: 11px 12px 12px; border: 1.5px solid color-mix(in srgb, var(--c) 60%, var(--border)); border-radius: 8px; background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
[data-theme="dark"] .now { background: color-mix(in srgb, var(--c) 11%, var(--surface)); }
.now.s-proposed { border-style: dashed; }
.now-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 20px; font-size: 13.5px; font-weight: 650; }
.now-head > .icon { color: var(--c); }
.now-head > .live { margin: 0 4px; }
.now-who { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.now-body { color: var(--text); }
.now-body p { color: var(--muted); }
.now-yolo { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.now-yolo .icon { color: var(--yolo); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--yolo) 60%, transparent)); }
.now-yolo .icon svg { width: 14px; height: 14px; fill: currentColor; }
.now-yolo button { margin-left: auto; padding: 1px 7px; font-size: 12px; }
.now-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.now-actions .yolo-btn:not(:first-child) { margin-left: auto; }
button.primary.to { background: var(--c); border-color: var(--c); color: #fff; }
[data-theme="dark"] button.primary.to { color: #0d0f14; }
button.say { padding: 1px 6px; gap: 5px; font: 600 12px var(--mono); vertical-align: baseline; }
.say .icon svg { width: 12px; height: 12px; }
.p-sec { display: flex; flex-direction: column; gap: 6px; }
.p-sec + .p-sec { padding-top: 14px; border-top: 1px solid var(--border); }
.section-head { display: flex; align-items: center; gap: 8px; min-height: 24px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.section-head .count { color: var(--faint); font-weight: 600; letter-spacing: 0; }
.section-head .lane-bar { width: 36px; }
.section-head button { margin-left: auto; padding: 2px 7px; font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
.section-head button:hover { color: var(--text); }
button.add-line { align-self: flex-start; padding: 3px 8px 3px 6px; margin-left: -6px; color: var(--faint); }

.rel { display: flex; flex-direction: column; }
.rel-label { margin: 2px 0; font-size: 12px; color: var(--faint); }
.rel-label ~ .rel-label { margin-top: 8px; }
.dep { display: flex; align-items: center; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; font-size: 13px; min-width: 0; }

.dep .st { flex: none; font-size: 11.5px; color: color-mix(in srgb, var(--c) 72%, var(--text)); }
.dep button { padding: 1px; border-color: transparent; background: transparent; color: var(--faint); opacity: 0; }
.dep:hover button, .dep button:focus-visible { opacity: 1; }
.dep button:hover { color: var(--text); background: transparent; border-color: transparent; }
.empty-line { color: var(--faint); font-size: 13px; }
.md { font-size: 13.5px; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote { margin: 0 0 8px; }
.md ul, .md ol { padding-left: 20px; }
.md li.task { list-style: none; margin-left: -18px; }
.md h3, .md h4, .md h5, .md h6 { margin: 10px 0 6px; font-size: 13.5px; }
.md h3 { font-size: 15px; }
.md code { font: 12px var(--mono); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.md pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.md pre code { border: 0; padding: 0; background: none; }
.md blockquote { border-left: 3px solid var(--border-strong); padding-left: 10px; color: var(--muted); }
.md a { color: var(--accent); }
a.tref { font: 600 12px var(--mono); text-decoration: none; padding: 0 4px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 12%, transparent); cursor: pointer; }
.md hr { border: 0; border-top: 1px solid var(--border); }
.desc-edit { display: flex; flex-direction: column; gap: 8px; }
.desc-edit textarea { min-height: 150px; }
.row-end { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.row-end .hint { margin-right: auto; font-size: 12px; color: var(--faint); }
.notes { display: flex; flex-direction: column; gap: 12px; }
.note { display: grid; grid-template-columns: 20px 1fr; gap: 1px 9px; }
.avatar { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--a, #64748b); text-transform: uppercase; }
.note-meta { font-size: 12px; line-height: 20px; color: var(--muted); }
.note-meta b { color: var(--text); font-weight: 600; }
.note-main { position: relative; min-width: 0; }
.note-btn { padding: 3px; color: var(--faint); opacity: 0; }
.note-btn .icon svg { width: 13px; height: 13px; }
.note-meta .note-btn { position: absolute; top: -2px; right: 0; }
.note:hover .note-btn, .now:hover .note-btn, .note-btn:focus-visible { opacity: 1; }
.note-btn:hover { color: var(--text); }
.note-edit { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.note-edit textarea { resize: none; overflow: hidden; min-height: 60px; font-size: 13.5px; }
.note-edit .row-end .hint { margin: 0 auto 0 0; }
.note-edit button.danger { margin-left: -8px; }
.note-form { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.note-form textarea { resize: none; overflow: hidden; }
.note-form .row-end { display: none; }
.note-form:focus-within .row-end, .note-form.filled .row-end { display: flex; }
.note-form:focus-within textarea, .note-form.filled textarea { min-height: 76px; }

/* Dialogs, toast, welcome */
dialog.dlg { border: 1px solid var(--border); border-radius: 10px; padding: 0; background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); width: min(520px, calc(100vw - 32px)); }
dialog.dlg::backdrop { background: rgb(10 12 18 / .38); backdrop-filter: blur(2px); }
.dlg form { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.dlg h3 { margin: 0; font-size: 16px; }
.dlg p { margin: 0; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.dlg .field input, .dlg .field select, .dlg .field textarea { font-weight: 400; color: var(--text); font-size: 14px; }
.dlg .field .hint { font-weight: 400; color: var(--faint); }
.dlg .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; width: fit-content; }
.dlg .check input { margin: 0; padding: 0; width: 15px; height: 15px; accent-color: var(--accent); }
.dlg button.link { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
.picker { display: flex; flex-direction: column; gap: 4px; font-weight: 400; }
.pick-box { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px; min-height: 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: text; }
.pick-box:focus-within { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; border-color: var(--accent); }
.dlg .pick-box input { flex: 1; min-width: 14ch; border: 0; padding: 3px 5px; background: transparent; outline: none; }
.pick-chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 2px 3px 2px 7px; border-radius: 4px; font-size: 12.5px; color: var(--text); background: color-mix(in srgb, var(--c) 12%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--border)); }
.pick-chip .t { max-width: 24ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-chip button { padding: 1px; border: 0; border-radius: 3px; background: transparent; color: var(--faint); }
.pick-chip button:hover { color: var(--text); background: transparent; }
.pick-chip button .icon svg { width: 13px; height: 13px; }
.pick-list { max-height: 216px; overflow-y: auto; padding: 3px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow); }
.pick-opt { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 4px; font-size: 13px; color: var(--text); cursor: pointer; }
.pick-opt.on { background: color-mix(in srgb, var(--accent) 11%, var(--surface-2)); }
.pick-opt.off { opacity: .5; cursor: not-allowed; }
.pick-opt .cid { flex: none; }
.pick-opt .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-opt .note { flex: none; font-size: 11.5px; color: var(--faint); }
.pick-empty { padding: 6px 8px; font-size: 13px; color: var(--faint); }
.dlg button.pick-graph { align-self: flex-start; padding: 3px 8px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.dlg button.pick-graph .icon svg { width: 14px; height: 14px; }
.pick-bar { position: fixed; top: 62px; left: 50%; translate: -50% 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 7px 7px 7px 14px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-lg); font-size: 13px; white-space: nowrap; animation: enter .2s ease-out; }
.pick-bar > .icon { color: var(--accent); }
.pick-bar .hint { color: var(--faint); }
body.picking header.top, body.picking #panel, body.picking .lane button { pointer-events: none; opacity: .5; }
body.picking .handle { display: none; }
body.picking .card { cursor: pointer; }
.card.pick-on, .kcard.pick-on { box-shadow: 0 0 0 3px var(--accent), var(--shadow-lg); }
.card.pick-on .cid::before, .kcard.pick-on .cid::before { content: "✓ "; color: var(--accent); }
.card.pick-off, .kcard.pick-off { opacity: .3; cursor: not-allowed !important; }
.dlg-actions { display: flex; flex-direction: row-reverse; gap: 8px; margin-top: 4px; }
.group-rows { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
.group-row { display: grid; grid-template-columns: 12px 1fr 64px auto; gap: 8px; align-items: center; }
.group-row .cid { text-align: center; }
.group-row .btns { display: flex; gap: 2px; }
.group-row .btns button { padding: 4px; }
.group-new { display: grid; grid-template-columns: 1fr 80px auto; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; align-items: center; }
.ctx-menu { position: fixed; z-index: 40; min-width: 210px; max-width: 340px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; font-size: 13px; animation: enter .12s ease-out; }
.ctx-menu:focus { outline: none; }
.ctx-menu button { width: 100%; min-width: 0; justify-content: flex-start; gap: 9px; padding: 6px 9px; border: 0; border-radius: 4px; background: transparent; text-align: left; }
.ctx-menu button:hover, .ctx-menu button:focus-visible { background: var(--surface-2); outline: none; }
.ctx-menu button:focus-visible, .ctx-menu.dpop .track > button:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: -2px; }
.ctx-menu button .icon { color: var(--muted); }
.ctx-menu button.danger .icon { color: inherit; }
.ctx-menu .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ctx-menu .lbl .cid { margin-right: 6px; }
.ctx-menu .sep { height: 1px; margin: 4px 3px; background: var(--border); }

.ctx-menu.dpop { width: 300px; max-width: none; padding: 4px 14px 14px; }
.dpop .d-head { margin-top: 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.dpop .d-head:not(:first-child) { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.dpop .d-row { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.dpop .d-head + .d-row { margin-top: 8px; }
.dpop .d-label { display: flex; align-items: center; gap: 3px; font-size: 13px; }
.dpop .d-label span { margin-right: auto; }
.dpop .track { display: flex; }
.ctx-menu.dpop .track > button { flex: 1; width: auto; justify-content: center; gap: 5px; padding: 0 6px; font-size: 12.5px; }
.ctx-menu.dpop .track > button:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.ctx-menu.dpop .track > button.on { background: var(--raise); }
.ctx-menu.dpop .track .icon { color: inherit; }
.dpop .d-note { font-size: 12px; line-height: 1.4; color: var(--muted); }
.dpop .d-range { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.dpop .d-range input { flex: 1; padding: 0; border: 0; background: none; accent-color: var(--accent); }
.tip { position: fixed; z-index: 60; display: flex; align-items: center; gap: 8px; max-width: 340px; padding: 5px 8px; border-radius: 6px; background: #1d2330; color: #eef0f4; font-size: 12px; line-height: 1.35; box-shadow: 0 6px 18px rgb(16 24 40 / .2); pointer-events: none; animation: tip-in .1s ease-out; }
.tip kbd { flex: none; background: rgb(255 255 255 / .1); border-color: rgb(255 255 255 / .2); color: #d7dce4; }
[data-theme="dark"] .tip { background: #2c3240; border: 1px solid #3d4453; }
@keyframes tip-in { from { opacity: 0; translate: 0 -3px; } }
.ctx-link { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; }
.ctx-menu .ctx-task { width: auto; margin: 0 4px; padding: 6px 8px; gap: 8px; border-radius: 6px; border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.ctx-menu .ctx-task:hover, .ctx-menu .ctx-task:focus-visible { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
.ctx-task .dot { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.ctx-task .cid { flex: none; }
.ctx-task .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx-link-arrow { display: flex; align-items: center; gap: 6px; padding: 1px 12px; font-size: 11.5px; color: var(--muted); }
.ctx-link-arrow .icon svg { width: 13px; height: 13px; }
#toasts { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 50; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 6px; background: var(--text); color: var(--bg); box-shadow: var(--shadow-lg); font-size: 13px; animation: enter .2s ease-out; max-width: 80vw; }
.toast.error { background: #dc2626; color: #fff; }
.toast .badge { --c-on: color-mix(in srgb, var(--c) 70%, #fff); color: var(--c-on); background: color-mix(in srgb, var(--c) 30%, transparent); }
.toast .agent { width: 18px; height: 18px; font-size: 10.5px; }
.toast .cid { color: inherit; opacity: .7; }
.toast button.link { pointer-events: auto; margin-left: 10px; border: 0; background: none; padding: 0; color: inherit; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
#welcome { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 20; padding: 20px; }
#welcome.drag { background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
.welcome-card { max-width: 480px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 30px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 14px; }
.welcome-card h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
.welcome-card h1 .logo { width: 30px; height: 30px; }
.welcome-card p { margin: 0; color: var(--muted); }
.welcome-card .drop { border: 1.5px dashed var(--border-strong); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); }
.welcome-card code { font: 12.5px var(--mono); background: var(--surface-2); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); }

@media (prefers-reduced-motion: reduce) {
  .yolo-tag, .yolo-chip, .edge.live, .live, :is(.card, .kcard)::before, :is(.card, .kcard)::after { animation: none !important; }
}

}
@media (max-width: 1640px) {
  .brand .sync.ok .label { display: none; }

}

  .seg .lbl { display: none; }
}
@media (max-width: 1490px) and (min-width: 1436px) {
  #display .lbl { display: none; }
}
@media (max-width: 1435px) {
  .schip .lbl { display: none; }
  .board-title { max-width: 22ch; }
}
@media (max-width: 1340px) {
  .seg .lbl { display: none; }
}
@media (max-width: 1250px) {
  #display .lbl { display: none; }
}

// ---------------------------------------------------------------------------
// Constants and small helpers

const STATES = ["proposed", "todo", "doing", "review", "done"];
const VIEW_STATES = ["proposed", "blocked", "todo", "doing", "review", "done"];
const LABEL = { proposed: "Proposed", blocked: "Blocked", todo: "To do", doing: "Doing", review: "Review", done: "Done" };
const ID_RE = /^[A-Za-z][A-Za-z0-9]*-\d+$/;
const PREFIX_RE = /^[A-Z][A-Z0-9]{0,5}$/;
const UNGROUPED = "G";
const GROUP_COLORS = ["#6366f1", "#0ea5e9", "#14b8a6", "#f59e0b", "#ec4899", "#84cc16", "#a855f7", "#f43f5e", "#06b6d4", "#78716c"];

const ARROW = 11; // markerWidth of the edge markers: edges end this far from the card so the tip touches it
const SLOT = 16, SLOT_GAP = 6; // across-flow room a long arrow takes in each depth it passes, and its spacing
const PORT_GAP = 12, PORT_MARGIN = 16; // spacing of arrow ends along a card side, and the corners they keep clear of
const POLL_MS = 1000;

const ICONS = {

  "folder-open": '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1M3 7v10a2 2 0 0 0 2 2h12.5a2 2 0 0 0 1.9-1.4L21.5 12a1 1 0 0 0-1-1.4H7.4a2 2 0 0 0-1.9 1.4L3 19"/>',

  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  open: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  unlink: '<path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 0 1 1.5 9.8M8 12h3M3 3l18 18"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  chevron: '<path d="m7 10 5 5 5-5"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/>',
};

const $ = (sel, root = document) => root.querySelector(sel);
const clone = (o) => JSON.parse(JSON.stringify(o));
const key = (id) => String(id).toUpperCase();
const same = (a, b) => key(a) === key(b);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const isObj = (x) => x && typeof x === "object" && !Array.isArray(x);
const nowIso = () => new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
const escHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function icon(name) {
  const span = document.createElement("span");
  span.className = "icon";
  span.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
  return span;
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "html") el.innerHTML = v;
    else if (k === "value") el.value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}

const compact = (...list) => list.flat(Infinity).filter((k) => k != null && k !== false);

function ago(iso) {
  const t = Date.parse(iso);
  if (!t) return iso || "";
  const s = (Date.now() - t) / 1000;
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  if (s < 7 * 86400) return `${Math.round(s / 86400)}d ago`;
  return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function colorFor(name) {
  let n = 0;
  for (const ch of String(name)) n = (n * 31 + ch.charCodeAt(0)) >>> 0;
  return GROUP_COLORS[n % GROUP_COLORS.length];
}

function toast(message, kind = "", ms = kind === "error" ? 5000 : 2600) {
  const t = h("div", { class: `toast ${kind}` }, message);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), ms);
}

// ---------------------------------------------------------------------------
// Board model (mirrors kanvas.py)
// ---------------------------------------------------------------------------

function normalize(b) {
  if (!isObj(b)) throw new Error("the board must be a JSON object");
  b.title = String(b.title || "");
  b.groups = Array.isArray(b.groups) ? b.groups.filter(isObj) : [];
  b.tasks = Array.isArray(b.tasks) ? b.tasks.filter(isObj) : [];
  for (const g of b.groups) { g.id = String(g.id || ""); g.name = String(g.name || g.id); }
  for (const t of b.tasks) {
    t.id = String(t.id || "");
    t.title = String(t.title || "");
    t.state = t.state || "todo";
    t.group = t.group || null;
    t.desc = String(t.desc || "");
    t.deps = Array.isArray(t.deps) ? t.deps.map(String) : [];
    if (t.yolo) t.yolo = true; else delete t.yolo;
    t.notes = Array.isArray(t.notes) ? t.notes.filter(isObj) : [];
  }
  return b;
}

// Defines the key as an own property, so keys such as "__proto__" are kept like any other.
const put = (obj, k, v) => Object.defineProperty(obj, k, { value: v, enumerable: true, writable: true, configurable: true });

function ordered(obj, keys, keep) {
  const out = {};
  for (const k of keys) {
    const v = obj[k];
    if (keep.includes(k) || !(v == null || v === "" || (Array.isArray(v) && !v.length))) out[k] = v == null ? "" : v;
  }
  for (const k of Object.keys(obj)) if (!keys.includes(k)) put(out, k, obj[k]);
  return out;
}

function canonical(b) {
  const out = { kanvas: 1, title: b.title || "" };
  out.groups = b.groups.map((g) => ordered(g, ["id", "name"], ["id", "name"]));
  out.tasks = b.tasks.map((t) => {
    const o = ordered(t, ["id", "title", "state", "group", "deps", "yolo", "desc", "notes"], ["id", "title", "state"]);
    if (o.notes) o.notes = o.notes.map((n) => ordered(n, ["at", "by", "edited", "text"], ["at", "by", "text"]));
    return o;
  });
  for (const k of Object.keys(b)) if (!Object.prototype.hasOwnProperty.call(out, k)) put(out, k, b[k]);
  return out;
}

// Same formatting as kanvas.py dumps(): short string arrays stay on one line.
const STR_ARRAY = /\[\n\s*("(?:[^"\\\n]|\\.)*"(?:,\n\s*"(?:[^"\\\n]|\\.)*")*)\n\s*\]/g;
function serialize(b) {
  return JSON.stringify(canonical(b), null, 2).replace(STR_ARRAY, (_, items) => "[" + items.replace(/,\n\s*/g, ", ") + "]") + "\n";
}

const indexOf = (b) => new Map(b.tasks.map((t) => [key(t.id), t]));
const unmetIn = (ix, t) => t.deps.filter((d) => { const x = ix.get(key(d)); return !x || x.state !== "done"; });
// Proposals covered by YOLO count as approved, like in kanvas.py.
const vstateIn = (ix, t, cover) => {
  const s = t.state === "proposed" && cover && cover.has(key(t.id)) ? "todo" : t.state;
  return s === "todo" && unmetIn(ix, t).length ? "blocked" : s;
};

// The task and everything it transitively depends on, as upper-case keys.
function upstreamOf(b, id) {
  const ix = indexOf(b), seen = new Set(), stack = [key(id)];
  while (stack.length) {
    const k = stack.pop();
    if (seen.has(k)) continue;
    seen.add(k);
    const t = ix.get(k);
    if (t) stack.push(...t.deps.map(key));
  }
  return seen;
}

// A YOLO mark counts until its task goes to review (mirrors yolo_active in kanvas.py).
const yoloActive = (t) => !!t.yolo && t.state !== "review" && t.state !== "done";

// Task key -> ID of the YOLO task covering it (mirrors yolo_cover in kanvas.py). Only the last YOLO task of a chain
// covers it: a YOLO task that another one depends on is covered by that one.
function yoloCoverIn(b) {
  const ix = indexOf(b);
  const upstream = (t) => {
    const seen = new Set(), stack = t.deps.map(key);
    while (stack.length) {
      const k = stack.pop();
      if (seen.has(k)) continue;
      seen.add(k);
      const d = ix.get(k);
      if (d) stack.push(...d.deps.map(key));
    }
    return seen;
  };
  const reach = b.tasks.filter(yoloActive).map((t) => [t, upstream(t)]);
  const inside = new Set(reach.flatMap(([, up]) => [...up]));
  const cover = new Map();
  for (const [t, up] of reach) {
    if (inside.has(key(t.id))) continue;
    for (const k of [key(t.id), ...up]) if (!cover.has(k)) cover.set(k, t.id);
  }
  return cover;
}

// Turning YOLO on approves the chain's proposals and accepts what waits for review. The chain keeps one YOLO mark,
// so the marks of tasks inside it go.
function yoloOn(b, id) {
  const ix = indexOf(b), t = ix.get(key(id));
  t.yolo = true;
  for (const k of upstreamOf(b, t.id)) {
    const x = ix.get(k);
    if (!x || x.state === "done") continue;
    if (x !== t) delete x.yolo;
    if (x.state === "proposed") x.state = "todo";
    else if (x.state === "review" && x !== t) x.state = "done";
  }
}

// Deletes a group along with those of `ids` still in it. Its other tasks become ungrouped, and dependencies on the
// deleted tasks go.
function removeGroup(b, gid, ids = []) {
  const gone = new Set(b.tasks.filter((t) => t.group === gid && ids.some((id) => same(id, t.id))).map((t) => key(t.id)));
  b.groups = b.groups.filter((g) => g.id !== gid);
  b.tasks = b.tasks.filter((t) => !gone.has(key(t.id)));
  for (const t of b.tasks) {
    if (t.group === gid) t.group = null;
    t.deps = t.deps.filter((d) => !gone.has(key(d)));
  }
}

function reaches(b, from, to) {
  const ix = indexOf(b), target = key(to), seen = new Set(), stack = [key(from)];
  while (stack.length) {
    const k = stack.pop();
    if (k === target) return true;
    if (seen.has(k)) continue;
    seen.add(k);
    const t = ix.get(k);
    if (t) stack.push(...t.deps.map(key));
  }
  return false;
}

function nextId(b, prefix) {
  prefix = prefix.toUpperCase();
  let n = 0;
  for (const t of b.tasks) {
    const i = t.id.lastIndexOf("-");
    const num = t.id.slice(i + 1);
    if (i > 0 && t.id.slice(0, i).toUpperCase() === prefix && /^\d+$/.test(num)) n = Math.max(n, +num);
  }
  return `${prefix}-${String(n + 1).padStart(2, "0")}`;
}

function suggestPrefix(name, taken) {
  taken = new Set([...taken].map((p) => p.toUpperCase()));
  const words = (String(name).match(/[A-Za-z0-9]+/g) || []).map((w) => w.toUpperCase());
  const cands = [];
  if (words.length >= 2) cands.push(words.slice(0, 3).map((w) => w[0]).join(""));
  if (words.length) {
    const w = words[0];
    for (const c of w.slice(1)) if (!"AEIOU".includes(c)) cands.push(w[0] + c);
    cands.push(w.slice(0, 2), w.slice(0, 3));
  }
  for (const c of cands) if (PREFIX_RE.test(c) && !taken.has(c)) return c;
  const letter = (words.join("").match(/[A-Z]/) || [UNGROUPED])[0];
  let n = 2;
  while (taken.has(letter + n)) n++;
  return letter + n;
}

function chainDepths(deps) {
  const depth = new Map();
  for (const root of deps.keys()) {
    const stack = [[root, false]], onPath = new Set();
    while (stack.length) {
      const [k, expanded] = stack.pop();
      if (expanded) {
        onPath.delete(k);
        let best = 0;
        for (const d of deps.get(k)) if (depth.has(d)) best = Math.max(best, depth.get(d) + 1);
        depth.set(k, best);
      } else if (!depth.has(k) && !onPath.has(k)) {
        onPath.add(k);
        stack.push([k, true]);
        for (const d of deps.get(k)) if (deps.has(d) && !depth.has(d)) stack.push([d, false]);
      }
    }
  }
  return depth;
}

function findCycles(b) {
  const ix = indexOf(b), color = new Map(), cycles = [], seen = new Set();
  for (const root of ix.keys()) {
    if (color.get(root)) continue;
    color.set(root, 1);
    const path = [root], stack = [[root, ix.get(root).deps.map(key), 0]];
    while (stack.length) {
      const top = stack[stack.length - 1];
      if (top[2] >= top[1].length) { color.set(top[0], 2); stack.pop(); path.pop(); continue; }
      const next = top[1][top[2]++];
      if (!ix.has(next)) continue;
      if (color.get(next) === 1) {
        const cyc = path.slice(path.indexOf(next));
        const sig = [...cyc].sort().join(",");
        if (cyc.length > 1 && !seen.has(sig)) { seen.add(sig); cycles.push(cyc.map((k) => ix.get(k).id)); }
      } else if (!color.get(next)) {
        color.set(next, 1);
        path.push(next);
        stack.push([next, ix.get(next).deps.map(key), 0]);
      }
    }
  }
  return cycles;
}

function problemsOf(b) {
  const errors = [], warnings = [], ix = indexOf(b), seen = new Set();
  const groupIds = new Set(b.groups.map((g) => g.id));
  for (const t of b.tasks) {
    if (!ID_RE.test(t.id)) errors.push(`Invalid task id "${t.id}"`);
    else if (seen.has(key(t.id))) errors.push(`Duplicate task id ${t.id}`);
    seen.add(key(t.id));
    if (!STATES.includes(t.state)) errors.push(`${t.id}: unknown state "${t.state}"`);
    if (t.group && !groupIds.has(t.group)) warnings.push(`${t.id}: unknown group "${t.group}"`);
    for (const d of t.deps) {
      if (same(d, t.id)) errors.push(`${t.id} depends on itself`);
      else if (!ix.has(key(d))) errors.push(`${t.id} depends on missing task ${d}`);
    }
    if (["doing", "review", "done"].includes(t.state)) {
      const pending = unmetIn(ix, t).filter((d) => ix.has(key(d)));
      if (pending.length) warnings.push(`${t.id} is ${t.state} but depends on unfinished ${pending.join(", ")}`);
    }
  }
  for (const c of findCycles(b)) errors.push(`Circular dependency: ${[...c, c[0]].join(" → ")}`);
  return { errors, warnings };
}

// ---------------------------------------------------------------------------
// Undo: replaying a change on a newer board
// ---------------------------------------------------------------------------

// Compares values whatever order their keys are in: boards read back from the file have the canonical order.
const stableJson = (v) => JSON.stringify(v, (k, x) => (isObj(x) ? Object.fromEntries(Object.keys(x).sort().map((f) => [f, x[f]])) : x));
const sameJson = (a, b) => stableJson(a) === stableJson(b);

// A note is known by its author, time and text; its rank tells identical notes apart by their order.
const sameNote = (a, b) => a.at === b.at && a.by === b.by && a.text === b.text;
const noteRank = (t, n) => t.notes.slice(0, Math.max(0, t.notes.indexOf(n))).filter((x) => sameNote(x, n)).length;
function noteIndex(t, n, rank = 0) {
  const hits = t.notes.flatMap((x, i) => (sameNote(x, n) ? [i] : []));
  if (!hits.length) throw new Error(`That note on ${t.id} was changed meanwhile`);
  return hits[Math.min(rank, hits.length - 1)];
}

// Puts the listed tasks in this order, in the places they hold now.
function reorderTasks(b, ids) {
  const rank = new Map(ids.map((id, i) => [key(id), i]));
  const places = b.tasks.flatMap((t, i) => (rank.has(key(t.id)) ? [i] : []));
  const moved = places.map((i) => b.tasks[i]).sort((x, y) => rank.get(key(x.id)) - rank.get(key(y.id)));
  places.forEach((i, j) => { b.tasks[i] = moved[j]; });
}

// Re-applies the edits that turned `from` into `to` on the latest board, so changes that agents made
// in between survive. A field is only changed if it still holds its `from` value, a task or group is
// only removed if nobody changed it since, and dependencies and notes are merged item by item.
function replay(b, from, to) {
  let applied = 0, skipped = 0;
  const setField = (obj, f, was, now) => {
    if (sameJson(obj[f], now)) return;
    if (!sameJson(obj[f], was)) { skipped++; return; }
    if (now === undefined) delete obj[f]; else obj[f] = clone(now);
    applied++;
  };
  // Counts copies, so identical notes stay apart; an item already on the board is not added again.
  const mergeList = (obj, f, was, now) => {
    const before = obj[f] || [];
    const tally = (list) => list.reduce((m, x) => m.set(stableJson(x), (m.get(stableJson(x)) || 0) + 1), new Map());
    const W = tally(was), N = tally(now), C = tally(before);
    const want = (k) => {
      const n = N.get(k) || 0, d = n - (W.get(k) || 0), c = C.get(k) || 0;
      return d > 0 ? Math.min(c + d, n) : Math.max(c + d, 0);
    };
    const kept = new Map();
    const list = before.filter((x) => { const k = stableJson(x), i = (kept.get(k) || 0) + 1; kept.set(k, i); return i <= want(k); });
    const seen = new Map();
    now.forEach((x, i) => {
      const k = stableJson(x), n = (seen.get(k) || 0) + 1;
      seen.set(k, n);
      if (n > want(k) || list.filter((y) => stableJson(y) === k).length >= n) return;
      const prev = i ? list.findIndex((y) => sameJson(y, now[i - 1])) : -1;
      list.splice(i && prev < 0 ? list.length : prev + 1, 0, clone(x));
    });
    if (!sameJson(list, before)) { obj[f] = list; applied++; }
  };
  const removed = new Set(), created = new Set(), rewired = new Set();

  if (from.title !== to.title) setField(b, "title", from.title, to.title);

  const GF = new Map(from.groups.map((g) => [g.id, g])), GT = new Map(to.groups.map((g) => [g.id, g]));
  for (const id of new Set([...GF.keys(), ...GT.keys()])) {
    const was = GF.get(id), now = GT.get(id), cur = b.groups.find((g) => g.id === id);
    if (was && !now) {
      if (!cur) continue;
      if (!sameJson(cur, was)) { skipped++; continue; }
      b.groups = b.groups.filter((g) => g !== cur);
      for (const t of b.tasks) if (t.group === id) t.group = null;
      applied++;
    } else if (!was && now) {
      if (cur) { skipped++; continue; }
      b.groups.splice(Math.min(to.groups.indexOf(now), b.groups.length), 0, clone(now));
      applied++;
    } else if (cur) {
      for (const f of Object.keys({ ...was, ...now })) if (!sameJson(was[f], now[f])) setField(cur, f, was[f], now[f]);
    }
  }
  const order = (list) => list.map((g) => g.id).filter((id) => GF.has(id) && GT.has(id));
  if (!sameJson(order(from.groups), order(to.groups)) && sameJson(order(b.groups), order(from.groups))) {
    const rank = new Map(to.groups.map((g, i) => [g.id, i]));
    b.groups.sort((x, y) => (rank.get(x.id) ?? Infinity) - (rank.get(y.id) ?? Infinity));
    applied++;
  }

  const TF = new Map(from.tasks.map((t) => [key(t.id), t])), TT = new Map(to.tasks.map((t) => [key(t.id), t]));
  for (const k of new Set([...TF.keys(), ...TT.keys()])) {
    const was = TF.get(k), now = TT.get(k), cur = b.tasks.find((t) => key(t.id) === k);
    if (was && !now) {
      if (!cur) continue;
      if (!sameJson(cur, was)) { skipped++; continue; }
      b.tasks = b.tasks.filter((t) => t !== cur);
      removed.add(k);
      applied++;
    } else if (!was && now) {
      if (cur) { skipped++; continue; }
      b.tasks.splice(Math.min(to.tasks.indexOf(now), b.tasks.length), 0, clone(now));
      created.add(k);
      applied++;
    } else if (!cur) {
      skipped++;
    } else {
      for (const f of Object.keys({ ...was, ...now })) {
        if (sameJson(was[f], now[f])) continue;
        if (f === "deps") rewired.add(k);
        if ((f === "deps" || f === "notes") && Array.isArray(was[f]) && Array.isArray(now[f])) mergeList(cur, f, was[f], now[f]);
        else setField(cur, f, was[f], now[f]);
      }
    }
  }
  const taskOrder = (list) => list.map((t) => key(t.id)).filter((k) => TF.has(k) && TT.has(k));
  if (!sameJson(taskOrder(from.tasks), taskOrder(to.tasks))) {
    if (sameJson(taskOrder(b.tasks), taskOrder(from.tasks))) { reorderTasks(b, taskOrder(to.tasks)); applied++; } else skipped++;
  }

  const ix = indexOf(b);
  for (const t of b.tasks) {
    if (removed.size) t.deps = t.deps.filter((d) => !removed.has(key(d)));
    if (created.has(key(t.id))) t.deps = t.deps.filter((d) => ix.has(key(d)));
    if (t.group && created.has(key(t.id)) && !b.groups.some((g) => g.id === t.group)) t.group = null;
  }
  for (const t of b.tasks) {
    if (!created.has(key(t.id)) && !rewired.has(key(t.id))) continue;
    for (const d of t.deps) if (reaches(b, d, t.id)) throw new Error(`that would make ${t.id} and ${d} depend on each other`);
  }
  return { applied, skipped };
}

// ---------------------------------------------------------------------------
// Graph layout (pure: the tests run it under Node)
// ---------------------------------------------------------------------------

// Dependencies another dependency of the same task already implies, as "dep>task" keys.
function impliedEdges(depsOf) {
  const memo = new Map();
  const upOf = (k) => {
    if (memo.has(k)) return memo.get(k);
    const seen = new Set(), stack = [...(depsOf.get(k) || [])];
    while (stack.length) {
      const x = stack.pop();
      if (seen.has(x)) continue;
      seen.add(x);
      stack.push(...(depsOf.get(x) || []));
    }
    memo.set(k, seen);
    return seen;
  };
  const out = new Set();
  for (const [k, ds] of depsOf) for (const d of ds) if (ds.some((o) => o !== d && upOf(o).has(d))) out.add(`${d}>${k}`);
  return out;
}

// Pairs i < j with a[i] > a[j], by merge sort.
function inversions(a) {
  if (a.length < 2) return 0;
  const mid = a.length >> 1, l = a.slice(0, mid), r = a.slice(mid);
  let n = inversions(l) + inversions(r), i = 0, j = 0, k = 0;
  while (i < l.length && j < r.length) {
    if (l[i] <= r[j]) a[k++] = l[i++];
    else { a[k++] = r[j++]; n += l.length - i; }
  }
  while (i < l.length) a[k++] = l[i++];
  while (j < r.length) a[k++] = r[j++];
  return n;
}

// `tasks` are the visible tasks of board `b`; `levelGap` is the space between dependency levels.
// Depth runs along the flow (right or down); lanes, and the cards of a lane at one depth,
// stack across it. An arrow that skips depths gets a thin slot in every depth it passes, so
// it runs between cards instead of under them. Implied arrows get no slots: they are hidden
// unless one of their tasks is selected. With `manual`, the cards of a lane at one depth keep
// their order in `tasks`.
function layout(tasks, b, { vertical, levelGap, manual = false }) {
  const vis = new Map(tasks.map((t) => [key(t.id), t]));
  const depsOf = new Map(tasks.map((t) => [key(t.id), t.deps.map(key).filter((d) => vis.has(d))]));
  const depth = chainDepths(depsOf);
  const maxDepth = Math.max(0, ...depth.values());
  const implied = impliedEdges(depsOf);
  const CL = vertical ? CH : CW, CA = vertical ? CW : CH;
  const P = (along, across) => (vertical ? { x: across, y: along } : { x: along, y: across });
  const colStart = (d) => (vertical ? LANE_HEAD : LANE_PAD) + d * (CL + levelGap);

  const knownGroups = new Set(b.groups.map((g) => g.id));
  const lanes = b.groups.map((g, i) => ({ id: g.id, name: g.name, color: GROUP_COLORS[i % GROUP_COLORS.length], cells: new Map() }));
  if (tasks.some((t) => !knownGroups.has(t.group))) lanes.push({ id: null, name: "Ungrouped", color: "var(--faint)", cells: new Map() });
  const laneOfTask = (t) => lanes.find((l) => l.id === (knownGroups.has(t.group) ? t.group : null));

  // Nodes are cards (task keys) and slots ("dep>task@depth"), linked along each arrow.
  const size = new Map(), laneOf = new Map(), depthOf = new Map(), up = new Map(), down = new Map();
  const node = (k, lane, d, s) => {
    size.set(k, s); laneOf.set(k, lane); depthOf.set(k, d); up.set(k, []); down.set(k, []);
    if (!lane.cells.has(d)) lane.cells.set(d, []);
    lane.cells.get(d).push(k);
  };
  for (const t of tasks) node(key(t.id), laneOfTask(t), depth.get(key(t.id)), CA);
  const chains = [];
  for (const [k, ds] of depsOf) {
    for (const d of ds) {
      if (implied.has(`${d}>${k}`)) continue;
      const via = [];
      for (let x = depth.get(d) + 1; x < depth.get(k); x++) { node(`${d}>${k}@${x}`, laneOf.get(d), x, SLOT); via.push(`${d}>${k}@${x}`); }
      const path = [d, ...via, k];
      for (let i = 1; i < path.length; i++) { down.get(path[i - 1]).push(path[i]); up.get(path[i]).push(path[i - 1]); }
      chains.push({ from: d, to: k, via });
    }
  }

  // Offsets of nodes within their lane (`at`), lane positions, and node centers across the flow.
  const at = new Map(), center = new Map();
  const gap = (a, c) => (size.get(a) === SLOT || size.get(c) === SLOT ? SLOT_GAP : GAP_Y);
  const stack = () => {
    for (const l of lanes) for (const ids of l.cells.values()) {
      let o = 0;
      ids.forEach((k, i) => { if (i) o += gap(ids[i - 1], k); at.set(k, o); o += size.get(k); });
    }
  };
  const place = () => {
    let offset = 0;
    for (const l of lanes) {
      let extent = 0;
      for (const ids of l.cells.values()) for (const k of ids) extent = Math.max(extent, at.get(k) + size.get(k));
      if (vertical) {
        Object.assign(l, { left: offset, top: 0, width: LANE_PAD * 2 + (extent || CW) });
        l.base = l.left + LANE_PAD;
        offset += l.width + LANE_GAP;
      } else {
        Object.assign(l, { left: 0, top: offset, height: LANE_HEAD + (extent || 54) + LANE_PAD });
        l.base = l.top + LANE_HEAD;
        offset += l.height + LANE_GAP;
      }
    }
    for (const [k, l] of laneOf) center.set(k, l.base + at.get(k) + size.get(k) / 2);
    return offset;
  };
  const restack = () => { stack(); place(); };
  restack();

  // Every arrow now spans one gap between depths, and two arrows in a gap cross exactly when
  // their ends are in opposite orders, so crossings are counted from ranks across the flow.
  const rank = new Map();
  const rankCell = (ids, li) => ids.forEach((k, i) => rank.set(k, li * 1e6 + i));
  const rankAll = () => lanes.forEach((l, li) => { for (const ids of l.cells.values()) rankCell(ids, li); });
  const nodesAt = Array.from({ length: maxDepth + 1 }, () => []);
  for (const [k, d] of depthOf) if (d >= 0 && d <= maxDepth) nodesAt[d].push(k);
  const ups = new Map(), downs = new Map();
  for (const [k, d] of depthOf) {
    ups.set(k, up.get(k).filter((n) => depthOf.get(n) === d - 1));
    downs.set(k, down.get(k).filter((n) => depthOf.get(n) === d + 1));
  }
  const crossings = () => {
    let c = 0;
    for (let d = 0; d < maxDepth; d++) {
      const segs = [];
      for (const k of nodesAt[d]) for (const n of downs.get(k)) segs.push([rank.get(k), rank.get(n)]);
      segs.sort((a, e) => a[0] - e[0] || a[1] - e[1]);
      c += inversions(segs.map((s) => s[1]));
    }
    return c;
  };
  // Crossings between the arrows of u and those of v on one side, with u placed before v.
  const pairCrossings = (u, v, side) => {
    let c = 0;
    for (const a of side.get(u)) for (const e of side.get(v)) if (rank.get(a) > rank.get(e)) c++;
    return c;
  };
  // Crossings of the arrow through `path` (adjacent depths) with the other arrows.
  const pathCrossings = (path) => {
    let c = 0;
    for (let i = 1; i < path.length; i++) {
      const ra = rank.get(path[i - 1]), rb = rank.get(path[i]);
      for (const x of nodesAt[depthOf.get(path[i - 1])]) for (const y of downs.get(x)) if ((ra - rank.get(x)) * (rb - rank.get(y)) < 0) c++;
    }
    return c;
  };
  const allCells = () => lanes.flatMap((l, li) => [...l.cells.entries()].map(([d, ids]) => ({ d, ids, li })));
  let cells = allCells();
  const snapshot = () => cells.map((c) => [...c.ids]);
  const restore = (s) => { cells.forEach((c, i) => c.ids.splice(0, c.ids.length, ...s[i])); restack(); rankAll(); };

  // Barycenter sweeps, depth by depth: order each cell by where its neighbours sit across the flow.
  const bary = (k, nbrs) => (nbrs.length ? nbrs.reduce((s, n) => s + center.get(n), 0) / nbrs.length : center.get(k));
  rankAll();
  let best = snapshot(), bestCross = crossings();
  for (let pass = 0; pass < 8 && bestCross; pass++) {
    const forward = pass % 2 === 0;
    for (let i = 0; i <= maxDepth; i++) {
      const d = forward ? i : maxDepth - i;
      for (const l of lanes) {
        const ids = l.cells.get(d);
        if (!ids || ids.length < 2) continue;
        const score = new Map(ids.map((k) => [k, bary(k, forward ? up.get(k) : down.get(k))]));
        ids.sort((a, e) => score.get(a) - score.get(e));
      }
      restack();
    }
    rankAll();
    const c = crossings();
    if (c < bestCross) { best = snapshot(); bestCross = c; }
  }
  restore(best);

  // A long arrow between lanes starts in its source lane and moves to its target lane in
  // one gap; pick the gap where that crosses the fewest arrows.
  const moveTo = (w, lane) => {
    const d = depthOf.get(w), from = laneOf.get(w);
    if (from === lane) return;
    from.cells.get(d).splice(from.cells.get(d).indexOf(w), 1);
    if (!lane.cells.has(d)) lane.cells.set(d, []);
    const ids = lane.cells.get(d), target = bary(w, [...up.get(w), ...down.get(w)]);
    const i = ids.findIndex((k) => center.get(k) > target);
    ids.splice(i < 0 ? ids.length : i, 0, w);
    laneOf.set(w, lane);
  };
  const saveCells = (ds) => lanes.map((l) => ds.map((d) => [d, l.cells.has(d) ? [...l.cells.get(d)] : null]));
  const loadCells = (s) => lanes.forEach((l, li) => {
    for (const [d, ids] of s[li]) {
      if (!ids) { l.cells.delete(d); continue; }
      l.cells.set(d, [...ids]);
      for (const k of ids) laneOf.set(k, l);
      rankCell(l.cells.get(d), li);
    }
  });
  const rankDepths = (ds) => lanes.forEach((l, li) => { for (const d of ds) if (l.cells.has(d)) rankCell(l.cells.get(d), li); });
  for (const { from, to, via } of chains) {
    const src = laneOf.get(from), dst = laneOf.get(to);
    if (src === dst || !via.length) continue;
    const ds = via.map((w) => depthOf.get(w)), path = [from, ...via, to];
    const start = saveCells(ds);
    let bestAt = via.length, fewest = pathCrossings(path);
    for (let s = 0; s < via.length; s++) {
      loadCells(start);
      via.forEach((w, i) => moveTo(w, i < s ? src : dst));
      rankDepths(ds);
      const c = pathCrossings(path);
      if (c < fewest) { fewest = c; bestAt = s; }
    }
    loadCells(start);
    via.forEach((w, i) => moveTo(w, i < bestAt ? src : dst));
    rankDepths(ds);
  }
  cells = allCells();

  // Swap neighbours within a cell while that removes crossings.
  const transpose = (pinned) => {
    for (let round = 0, improved = true; improved && round < 8; round++) {
      improved = false;
      for (const { ids, li } of cells) {
        for (let i = 0; i + 1 < ids.length; i++) {
          const u = ids[i], v = ids[i + 1];
          if (pinned(u) && pinned(v)) continue;
          if (pairCrossings(v, u, ups) + pairCrossings(v, u, downs) < pairCrossings(u, v, ups) + pairCrossings(u, v, downs)) {
            ids[i] = v; ids[i + 1] = u;
            rankCell(ids, li);
            improved = true;
          }
        }
      }
    }
  };
  transpose(() => false);
  // The manual layout puts the cards of each cell back in file order, in the places cards hold,
  // then moves only slots. A file in the automatic order thus gives the automatic layout.
  if (manual) {
    const fileOrder = new Map(tasks.map((t, i) => [key(t.id), i]));
    const isCard = (k) => size.get(k) !== SLOT;
    for (const { ids, li } of cells) {
      const places = ids.flatMap((k, i) => (isCard(k) ? [i] : []));
      const cards = places.map((i) => ids[i]).sort((a, e) => fileOrder.get(a) - fileOrder.get(e));
      places.forEach((i, j) => { ids[i] = cards[j]; });
      rankCell(ids, li);
    }
    transpose(isCard);
  }

  // Arrow ends spread along each card side, in the order of the nodes at their other ends.
  const outOff = new Map(), inOff = new Map();
  const spread = (k, nbrs) => {
    const s = size.get(k) !== SLOT && nbrs.length > 1 ? Math.min(PORT_GAP, (CA - 2 * PORT_MARGIN) / (nbrs.length - 1)) : 0;
    const order = [...nbrs].sort((a, e) => rank.get(a) - rank.get(e));
    return new Map(order.map((n, i) => [n, (i - (order.length - 1) / 2) * s]));
  };
  for (const k of size.keys()) { outOff.set(k, spread(k, down.get(k))); inOff.set(k, spread(k, up.get(k))); }

  // Straight arrows (after Brandes and Köpf): within a lane, link each node to one neighbour
  // at an adjacent depth so the arrow between them runs straight, without links crossing.
  // Linked nodes move as one chain; chains then stack as tightly as order and spacing allow.
  // Linking toward dependencies and toward dependents give different results; keep the one
  // with more straight arrows.
  const alignChains = (forward) => {
    const prev = new Map(), linked = new Set();
    const side = forward ? ups : downs;
    for (const l of lanes) {
      for (let i = 1; i <= maxDepth; i++) {
        const ids = l.cells.get(forward ? i : maxDepth - i);
        if (!ids) continue;
        let last = -Infinity;
        for (const v of ids) {
          const nbrs = side.get(v).filter((u) => laneOf.get(u) === l).sort((a, e) => rank.get(a) - rank.get(e));
          const m = nbrs.length;
          const medians = m % 2 ? [nbrs[(m - 1) / 2]] : m ? [nbrs[m / 2 - 1], nbrs[m / 2]] : [];
          for (const u of medians) {
            if (linked.has(u) || rank.get(u) <= last) continue;
            prev.set(v, u);
            linked.add(u);
            last = rank.get(u);
            break;
          }
        }
      }
    }
    // Offset of each node from the start of its chain's first node, so linked arrows are straight.
    const root = new Map(), rel = new Map();
    const resolve = (v) => {
      if (root.has(v)) return;
      const u = prev.get(v);
      if (!u) { root.set(v, v); rel.set(v, 0); return; }
      resolve(u);
      const [a, e] = forward ? [u, v] : [v, u];
      root.set(v, root.get(u));
      rel.set(v, rel.get(u) + size.get(u) / 2 - size.get(v) / 2 + (forward ? outOff.get(a).get(e) - inOff.get(e).get(a) : inOff.get(e).get(a) - outOff.get(a).get(e)));
    };
    for (const k of size.keys()) resolve(k);
    // Push chains apart until every cell keeps its order and spacing.
    const x = new Map([...root.values()].map((r) => [r, 0]));
    for (let round = 0, moved = true; moved && round < size.size; round++) {
      moved = false;
      for (const l of lanes) for (const ids of l.cells.values()) {
        for (let i = 1; i < ids.length; i++) {
          const a = ids[i - 1], c = ids[i];
          const need = x.get(root.get(a)) + rel.get(a) + size.get(a) + gap(a, c) - rel.get(c);
          if (x.get(root.get(c)) < need) { x.set(root.get(c), need); moved = true; }
        }
      }
    }
    const offsets = new Map([...size.keys()].map((k) => [k, x.get(root.get(k)) + rel.get(k)]));
    return { offsets, links: prev.size };
  };
  const chosen = [alignChains(false), alignChains(true)].reduce((a, e) => (e.links > a.links ? e : a));
  for (const l of lanes) {
    const ks = [...l.cells.values()].flat();
    const top = Math.min(...ks.map((k) => chosen.offsets.get(k)));
    for (const k of ks) at.set(k, Math.round(chosen.offsets.get(k) - top));
  }

  const stacked = Math.max(0, place() - LANE_GAP);
  const depthSpan = (maxDepth + 1) * CL + maxDepth * levelGap;
  for (const l of lanes) {
    if (vertical) l.height = LANE_HEAD + depthSpan + LANE_PAD; else l.width = LANE_PAD * 2 + depthSpan;
    l.total = b.tasks.filter((t) => (l.id ? t.group === l.id : !knownGroups.has(t.group))).length;
    l.done = b.tasks.filter((t) => t.state === "done" && (l.id ? t.group === l.id : !knownGroups.has(t.group))).length;
    l.empty = !tasks.some((t) => laneOfTask(t) === l);
  }
  const width = vertical ? stacked : LANE_PAD * 2 + depthSpan;
  const height = vertical ? (lanes.length ? LANE_HEAD + depthSpan + LANE_PAD : 0) : stacked;
  const pos = new Map();
  for (const t of tasks) { const k = key(t.id); pos.set(k, P(colStart(depthOf.get(k)), center.get(k) - CA / 2)); }

  const line = (a, c) => [a, { x: a.x + (c.x - a.x) / 3, y: a.y + (c.y - a.y) / 3 }, { x: a.x + (c.x - a.x) * 2 / 3, y: a.y + (c.y - a.y) * 2 / 3 }, c];
  const edges = chains.map(({ from, to, via }) => {
    const first = via[0] || to, last = via[via.length - 1] || from;
    let prev = P(colStart(depthOf.get(from)) + CL, center.get(from) + outOff.get(from).get(first));
    const segs = [];
    for (const w of via) {
      const entry = P(colStart(depthOf.get(w)), center.get(w)), exit = P(colStart(depthOf.get(w)) + CL, center.get(w));
      segs.push(edgeCurve(prev, entry, vertical, 36), line(entry, exit));
      prev = exit;
    }
    segs.push(edgeCurve(prev, P(colStart(depthOf.get(to)), center.get(to) + inOff.get(to).get(last)), vertical, 36, ARROW));
    return { from, to, segs };
  });
  for (const k of implied) {
    const [from, to] = k.split(">");
    edges.push({ from, to, implied: true, segs: [edgeCurve(outPort(pos.get(from), vertical), inPort(pos.get(to), vertical), vertical, 36, ARROW)] });
  }
  return { pos, lanes, width, height, depsOf, vertical, edges };
}

const outPort = (p, vertical) => (vertical ? { x: p.x + CW / 2, y: p.y + CH } : { x: p.x + CW, y: p.y + CH / 2 });
const inPort = (p, vertical) => (vertical ? { x: p.x + CW / 2, y: p.y } : { x: p.x, y: p.y + CH / 2 });

// Cubic Bézier from a to b as [start, control, control, end].
function edgeCurve(a, b, vertical, bend, gap = 0) {
  if (vertical) {
    const d = Math.max(bend, Math.abs(b.y - a.y) * 0.5);
    return [a, { x: a.x, y: a.y + d }, { x: b.x, y: b.y - d }, { x: b.x, y: b.y - gap }];
  }
  const d = Math.max(bend, Math.abs(b.x - a.x) * 0.5);
  return [a, { x: a.x + d, y: a.y }, { x: b.x - d, y: b.y }, { x: b.x - gap, y: b.y }];
}

// SVG path of consecutive cubic segments.
const curvePath = (segs) => `M${segs[0][0].x},${segs[0][0].y}` + segs.map(([, c1, c2, q]) => ` C${c1.x},${c1.y} ${c2.x},${c2.y} ${q.x},${q.y}`).join("");
const edgePath = (...args) => curvePath([edgeCurve(...args)]);

function sampleCurve(segs) {
  const pts = [[segs[0][0].x, segs[0][0].y]];
  for (const [p, c1, c2, q] of segs) {
    const n = Math.min(200, Math.max(4, Math.ceil(Math.hypot(q.x - p.x, q.y - p.y) / 8)));
    for (let i = 1; i <= n; i++) {
      const t = i / n, u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
      pts.push([a * p.x + b * c1.x + c * c2.x + d * q.x, a * p.y + b * c1.y + c * c2.y + d * q.y]);
    }
  }
  return pts;
}

// Clutter of a layout's drawn arrows (implied ones are hidden): pairs that cross (arrows
// sharing a task do not count), arrows that run under other cards, where they disappear,
// arrows drawn as one straight line, bends (runs of curve that shift across the flow), and
// the total arrow length.
function layoutMetrics(L) {
  const shift = ([p, , , q]) => Math.abs(L.vertical ? q.x - p.x : q.y - p.y) >= 0.5;
  const drawn = L.edges.filter((e) => !e.implied);
  const bends = drawn.reduce((n, e) => n + e.segs.filter((s, i) => shift(s) && !(i && shift(e.segs[i - 1]))).length, 0);
  const straight = drawn.filter((e) => !e.segs.some(shift)).length;
  const edges = L.edges.filter((e) => !e.implied).map((e) => {
    const pts = sampleCurve(e.segs), xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    return { ...e, pts, box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] };
  });
  let length = 0;
  const behind = [];
  for (const e of edges) {
    for (let i = 1; i < e.pts.length; i++) length += Math.hypot(e.pts[i][0] - e.pts[i - 1][0], e.pts[i][1] - e.pts[i - 1][1]);
    const cards = [];
    for (const [k, p] of L.pos) {
