    const x = new Map([...root.values()].map((r) => [r, 0]));
    for (let round = 0, moved = true; moved && round < size.size; round++) {
      moved = false;
      for (const l of lanes) for (const ids of l.cells.values()) {
        for (let i = 1; i < ids.length; i++) {
          const a = ids[i - 1], c = ids[i];
          const need = x.get(root.get(a)) + rel.get(a) + size.get(a) + gap(a, c) - rel.get(c);
          if (x.get(root.get(c)) < need) { x.set(root.get(c), need); moved = true; }
        }
      }
    }
    const offsets = new Map([...size.keys()].map((k) => [k, x.get(root.get(k)) + rel.get(k)]));
    return { offsets, links: prev.size };
  };
  const chosen = [alignChains(false), alignChains(true)].reduce((a, e) => (e.links > a.links ? e : a));
  for (const l of lanes) {
    const ks = [...l.cells.values()].flat();
    const top = Math.min(...ks.map((k) => chosen.offsets.get(k)));
    for (const k of ks) at.set(k, Math.round(chosen.offsets.get(k) - top));
  }
  // A lane narrower than its track moves across it to straighten the most arrows to other lanes,
  // those from its dependencies first. Lanes go in flow order, so each follows the one it waits on.
  place();
  for (const track of tracks) {
    if (track.length < 2) continue;
    const nodes = (l) => [...l.cells.values()].flat(), extent = (l) => Math.max(0, ...nodes(l).map((k) => at.get(k) + size.get(k)));
    const room = Math.max(...track.map(extent));
    const firstDepth = (l) => Math.min(...nodes(l).map((k) => depthOf.get(k)));
    const order = [...track].sort((a, c) => firstDepth(a) - firstDepth(c));
    for (let round = 0, changed = true; changed && round < 4; round++) {
      changed = false;
      for (const l of order) {
        const ks = nodes(l), lo = -Math.min(...ks.map((k) => at.get(k))), hi = room - extent(l);
        const pulls = [
          ...ks.flatMap((k) => up.get(k).filter((n) => laneOf.get(n) !== l).map((n) => center.get(n) + outOff.get(n).get(k) - inOff.get(k).get(n) - center.get(k))),
          ...ks.flatMap((k) => down.get(k).filter((n) => laneOf.get(n) !== l).map((n) => center.get(n) + inOff.get(n).get(k) - outOff.get(k).get(n) - center.get(k))),
        ].map((p) => Math.round(clamp(p, lo, hi)));
        const count = (p) => pulls.filter((q) => q === p).length, mean = pulls.reduce((s, p) => s + p, 0) / (pulls.length || 1);
        const better = (p, best) => count(p) - count(best) || Math.abs(best - mean) - Math.abs(p - mean);
        const shift = pulls.reduce((best, p) => (better(p, best) > 0 ? p : best), pulls[0] || 0);
        if (!shift) continue;
        for (const k of ks) { at.set(k, at.get(k) + shift); center.set(k, center.get(k) + shift); }
        changed = true;
      }
    }
  }

  const stacked = Math.max(0, place() - LANE_GAP);
  const depthSpan = (maxDepth + 1) * CL + maxDepth * levelGap;
  // Lanes sharing a track split it along the flow, each from just before its first depth, where a lane head
  // goes when the flow runs down.
  for (const track of tracks) {
    const first = new Map(track.map((l) => [l, Math.min(...[...l.cells].filter(([, ids]) => ids.length).map(([d]) => d))]));
    track.sort((a, c) => first.get(a) - first.get(c));
    const starts = track.map((l, i) => (i ? colStart(first.get(l)) - (vertical ? LANE_HEAD : LANE_PAD) : 0));
    track.forEach((l, i) => {
      const end = i + 1 < track.length ? starts[i + 1] - LANE_GAP / 2 : (vertical ? LANE_HEAD + LANE_PAD : LANE_PAD * 2) + depthSpan;
      if (vertical) Object.assign(l, { top: starts[i], height: end - starts[i] }); else Object.assign(l, { left: starts[i], width: end - starts[i] });
    });
  }
  for (const l of lanes) {
    l.total = b.tasks.filter((t) => (l.id ? t.group === l.id : !knownGroups.has(t.group))).length;
    l.done = b.tasks.filter((t) => t.state === "done" && (l.id ? t.group === l.id : !knownGroups.has(t.group))).length;
    l.empty = !tasks.some((t) => laneOfTask(t) === l) && !stubs.some((s) => s.group === l.id);
  }
  const width = vertical ? stacked : LANE_PAD * 2 + depthSpan;
  const height = vertical ? (lanes.length ? LANE_HEAD + depthSpan + LANE_PAD : 0) : stacked;
  const pos = new Map();
  for (const t of tasks) { const k = key(t.id); pos.set(k, P(colStart(depthOf.get(k)), center.get(k) - CA / 2)); }

  const line = (a, c) => [a, { x: a.x + (c.x - a.x) / 3, y: a.y + (c.y - a.y) / 3 }, { x: a.x + (c.x - a.x) * 2 / 3, y: a.y + (c.y - a.y) * 2 / 3 }, c];
  const edges = chains.map(({ from, to, via }) => {
    const first = via[0] || to, last = via[via.length - 1] || from;
    let prev = P(colStart(depthOf.get(from)) + CL, center.get(from) + outOff.get(from).get(first));
    const segs = [];
    for (const w of via) {
      const entry = P(colStart(depthOf.get(w)), center.get(w)), exit = P(colStart(depthOf.get(w)) + CL, center.get(w));
      segs.push(edgeCurve(prev, entry, vertical, 36), line(entry, exit));
      prev = exit;
    }
    segs.push(edgeCurve(prev, P(colStart(depthOf.get(to)), center.get(to) + inOff.get(to).get(last)), vertical, 36, ARROW));
    return { from, to, segs };
  });
  for (const k of implied) {
    const [from, to] = k.split(">");
    edges.push({ from, to, implied: true, segs: [edgeCurve(outPort(pos.get(from), vertical), inPort(pos.get(to), vertical), vertical, 36, ARROW)] });
  }
  const placed = stubs.map((s) => ({ ...s, ...P(colStart(depthOf.get(s.key)), center.get(s.key) - size.get(s.key) / 2) }));
  return { pos, lanes, width, height, depsOf, vertical, edges, stubs: placed, cross: crossings() };
}

const outPort = (p, vertical) => (vertical ? { x: p.x + CW / 2, y: p.y + CH } : { x: p.x + CW, y: p.y + CH / 2 });
const inPort = (p, vertical) => (vertical ? { x: p.x + CW / 2, y: p.y } : { x: p.x, y: p.y + CH / 2 });

// Cubic Bézier from a to b as [start, control, control, end].
function edgeCurve(a, b, vertical, bend, gap = 0) {
  if (vertical) {
    const d = Math.max(bend, Math.abs(b.y - a.y) * 0.5);
    return [a, { x: a.x, y: a.y + d }, { x: b.x, y: b.y - d }, { x: b.x, y: b.y - gap }];
  }
  const d = Math.max(bend, Math.abs(b.x - a.x) * 0.5);
  return [a, { x: a.x + d, y: a.y }, { x: b.x - d, y: b.y }, { x: b.x - gap, y: b.y }];
}

// SVG path of consecutive cubic segments.
const curvePath = (segs) => `M${segs[0][0].x},${segs[0][0].y}` + segs.map(([, c1, c2, q]) => ` C${c1.x},${c1.y} ${c2.x},${c2.y} ${q.x},${q.y}`).join("");
const edgePath = (...args) => curvePath([edgeCurve(...args)]);

function sampleCurve(segs) {
  const pts = [[segs[0][0].x, segs[0][0].y]];
  for (const [p, c1, c2, q] of segs) {
    const n = Math.min(200, Math.max(4, Math.ceil(Math.hypot(q.x - p.x, q.y - p.y) / 8)));
    for (let i = 1; i <= n; i++) {
      const t = i / n, u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
      pts.push([a * p.x + b * c1.x + c * c2.x + d * q.x, a * p.y + b * c1.y + c * c2.y + d * q.y]);
    }
  }
  return pts;
}

// Clutter of a layout's drawn arrows (implied ones are hidden): pairs that cross (arrows
// sharing a task do not count), arrows that run under other cards or stubs, where they disappear,
// arrows drawn as one straight line, bends (runs of curve that shift across the flow), the
// total arrow length, and the space the drawing takes as a multiple of the area of its cards
// and stubs.
function layoutMetrics(L) {
  const shift = ([p, , , q]) => Math.abs(L.vertical ? q.x - p.x : q.y - p.y) >= 0.5;
  const drawn = L.edges.filter((e) => !e.implied);
  const bends = drawn.reduce((n, e) => n + e.segs.filter((s, i) => shift(s) && !(i && shift(e.segs[i - 1]))).length, 0);
  const straight = drawn.filter((e) => !e.segs.some(shift)).length;
  const edges = L.edges.filter((e) => !e.implied).map((e) => {
    const pts = sampleCurve(e.segs), xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    return { ...e, pts, box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] };
  });
  let length = 0;
  const behind = [], boxes = [...[...L.pos].map(([k, p]) => [k, p, CH]), ...L.stubs.map((s) => [s.key, s, STUB])];
  for (const e of edges) {
    for (let i = 1; i < e.pts.length; i++) length += Math.hypot(e.pts[i][0] - e.pts[i - 1][0], e.pts[i][1] - e.pts[i - 1][1]);
    const cards = [];
    for (const [k, p, h] of boxes) {
      if (k === e.from || k === e.to) continue;
      if (e.pts.some(([x, y]) => x > p.x + 2 && x < p.x + CW - 2 && y > p.y + 2 && y < p.y + h - 2)) cards.push(k);
    }
    if (cards.length) behind.push({ from: e.from, to: e.to, cards });
  }
  const side = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
  const cross = (a, b, c, d) => side(a, b, c) * side(a, b, d) < 0 && side(c, d, a) * side(c, d, b) < 0;
  const crossings = [];
  for (let i = 0; i < edges.length; i++) {
    for (let j = i + 1; j < edges.length; j++) {
      const A = edges[i], B = edges[j];
      if ([A.from, A.to].some((k) => k === B.from || k === B.to)) continue;
      if (A.box[0] > B.box[2] || B.box[0] > A.box[2] || A.box[1] > B.box[3] || B.box[1] > A.box[3]) continue;
      let hit = false;
      for (let a = 1; a < A.pts.length && !hit; a++) for (let b = 1; b < B.pts.length && !hit; b++) hit = cross(A.pts[a - 1], A.pts[a], B.pts[b - 1], B.pts[b]);
      if (hit) crossings.push([`${A.from}>${A.to}`, `${B.from}>${B.to}`]);
    }
  }
  const area = L.pos.size * CW * CH + L.stubs.length * CW * STUB;
  const space = area ? Math.round((10 * L.width * L.height) / area) / 10 : 0;
  return { arrows: edges.length, crossings: crossings.length, behind: behind.length, straight, bends, length: Math.round(length), space, detail: { crossings, behind } };
}

// The view of layout L in room r (viewport coordinates) for when the whole graph only fits at a zoom below
// `readable`: the larger of `readable` and the zoom that fits the graph's short side, up to 100%, so a tall graph
// fits its width and scrolls. `tiers` are lists of task keys, the most pressing first. The view centers on the
// first tier with cards on the graph, along with each next tier while they all fit, and shows the start of a
// first tier too large for the room.
function readableView(r, L, tiers, readable) {
  const w = r.right - r.left, h = r.bottom - r.top;
  const k = clamp(Math.max(w / L.width, h / L.height), readable, 1);
  let box = null;
  for (const ids of tiers) {
    const ps = ids.map((id) => L.pos.get(id)).filter(Boolean);
    if (!ps.length) continue;
    const xs = ps.map((p) => p.x), ys = ps.map((p) => p.y);
    // Lane names sit above their cards.
    const next = {
      x0: Math.min(box ? box.x0 : Infinity, ...xs) - LANE_PAD, y0: Math.min(box ? box.y0 : Infinity, ...ys) - LANE_HEAD,
      x1: Math.max(box ? box.x1 : -Infinity, ...xs) + CW + LANE_PAD, y1: Math.max(box ? box.y1 : -Infinity, ...ys) + CH + LANE_PAD,
    };
    if (box && ((next.x1 - next.x0) * k > w || (next.y1 - next.y0) * k > h)) break;
    box = next;
  }
  if (!box) box = { x0: 0, y0: 0, x1: L.width, y1: L.height };
  // Along an axis the graph fits, it goes in the middle. Along one it overflows, the view starts where the graph
  // does if the focus fits in it from there, so lane names stay in sight, else the focus goes in the middle.
  const place = (start, room, size, a0, a1) => {
    if (size * k <= room) return start + (room - size * k) / 2;
    const from = a1 * k <= room ? 0 : (a1 - a0) * k <= room ? ((a0 + a1) * k - room) / 2 : a0 * k;
    return start - clamp(from, 0, size * k - room);
  };
  return { k, x: place(r.left, w, L.width, box.x0, box.x1), y: place(r.top, h, L.height, box.y0, box.y1) };
}

// ---------------------------------------------------------------------------
// App state
// ---------------------------------------------------------------------------

let board = null;       // what the UI shows (may include unsaved optimistic edits)
let confirmed = null;   // last state known to be on disk
let store = null;
let IX = new Map();
let COVER = new Map();
let pending = 0;
let lost = null;        // why the page cannot reach the board, while it cannot; commit() refuses changes meanwhile
let writes = 0;         // saves started, so a poll that overlapped one is dropped
let saveQueue = Promise.resolve();

const LEVEL_GAP = { min: 30, max: 500 };
const MAX_ZOOM = 2, MIN_ZOOM = 0.2;
// The smallest zoom at which card titles stay easy to read. The graph opens at it or larger.
const READABLE_ZOOM = 0.7;
// Phone-sized screens, in portrait or landscape. Keep in step with the media queries of the phone layout.
const phone = matchMedia("(max-width: 640px), (pointer: coarse) and (max-device-width: 480px), (pointer: coarse) and (max-device-height: 480px)");
const coarse = matchMedia("(pointer: coarse)");
// The view chosen on wider screens, and the one chosen on phones, which start on the board.
const prefs = (() => {
  const defaults = { view: "graph", phoneView: "board", orient: "horizontal", arrange: "auto", hideDone: false, theme: null, levelGap: 70 };
  try { return Object.assign(defaults, JSON.parse(localStorage.getItem("kanvas:prefs") || "{}")); } catch (e) { return defaults; }
})();
const savePrefs = () => { try { localStorage.setItem("kanvas:prefs", JSON.stringify(prefs)); } catch (e) { /* storage disabled */ } };

const viewPref = () => (phone.matches ? "phoneView" : "view");
const ui = { view: prefs[viewPref()], selected: null, search: "", states: new Set(), groups: new Set(), hover: null, link: null, editingDesc: false, focusDesc: false, editingNote: null, focusNote: false, panelStale: false, editingTitle: false };
// Unsaved text in the panel survives re-renders caused by agent changes.
// descBase is the description as it was when editing began, to notice an agent changing it meanwhile.
// `back` keeps, per task, the text of saves that failed while another task was open, for when it opens again.
const drafts = { desc: null, descBase: null, note: new Map(), noteEdit: null, title: null, boardTitle: null, back: new Map() };
const view = { x: 40, y: 30, k: 1 };
let fitted = false;

const get = (id) => IX.get(key(id));
const unmet = (t) => unmetIn(IX, t);
const vstate = (t) => vstateIn(IX, t);
const yoloVia = (t) => (t.state === "done" ? null : COVER.get(key(t.id)) || null);
const groupOf = (t) => board.groups.find((g) => g.id === t.group) || null;
const laneId = (t) => (groupOf(t) ? t.group : null); // tasks of unknown groups share the Ungrouped lane
const dependents = (t) => board.tasks.filter((x) => x.deps.some((d) => same(d, t.id)));

function setBoard(b) {
  board = b;
  IX = indexOf(board);
  COVER = yoloCoverIn(board);
}

// ---------------------------------------------------------------------------
// Storage backends: local server, a file opened in the browser, memory, snapshot
// ---------------------------------------------------------------------------

// Every store keeps the version of the board the page last confirmed: load() and save() set it, and
// poll() returns { board, accept } so the version only moves when the page takes that board.
// save(fn, base) returns { board, base }: what was written, and the board fn was applied to.
function serverStore() {
  let etag = null;
  const parse = async (r) => normalize(JSON.parse(await r.text()));
  // Errors that mean the page cannot reach the board carry `lost`.
  const lostError = (message) => Object.assign(new Error(message), { lost: true });
  // A read that hangs (the computer running Kanvas asleep, a dropped network) counts as lost after 10 s. A write may
  // have landed even so, and waits for its answer.
  const ask = async (opts, read = true) => {
    const stop = new AbortController(), timer = read && setTimeout(() => stop.abort(), 10000);
    try { return await fetch("api/board", Object.assign({ signal: stop.signal }, opts)); }
    catch (e) { throw lostError("Kanvas stopped running or cannot be reached"); }
    finally { clearTimeout(timer); }
  };
  const answered = (r) => (r.status === 404 ? lostError("this board is no longer open in Kanvas") : new Error(`server answered ${r.status}`));
  return {
    kind: "server",
    async load() {
      const r = await ask({ cache: "no-store" });
      if (!r.ok) throw answered(r);
      etag = r.headers.get("ETag");
      return parse(r);
    },
    async poll() {
      const r = await ask({ cache: "no-store", headers: etag ? { "If-None-Match": etag } : {} });
      if (r.status === 304) return null;
      if (!r.ok) throw answered(r);
      const tag = r.headers.get("ETag"), board = await parse(r);
      return { board, accept: () => { etag = tag; } };
    },
    async save(fn, base) {
      for (let attempt = 0; attempt < 6; attempt++) {
        const draft = clone(base);
        fn(draft);
        const r = await ask({
          method: "PUT",
          headers: Object.assign({ "Content-Type": "application/json" }, etag ? { "If-Match": etag } : {}),
          body: serialize(draft),
        }, false);
        const text = await r.text();
        if (r.ok || r.status === 409) {
          etag = r.headers.get("ETag");
          const result = normalize(JSON.parse(text));
          if (r.ok) return { board: result, base };
          base = result; // someone else (an agent) wrote first: replay the change on top
          continue;
        }
        let msg = r.statusText;
        try { msg = JSON.parse(text).error || msg; } catch (e) { /* not JSON */ }
        throw new Error(msg);
      }
      throw new Error("the board kept changing; try again");
    },
    // The page lives at /<board>/, so the server's kanvas-files/ for this board is a relative address.
    imageUrl: (ref) => ref,
    async upload(file) {
      let r;
      try { r = await fetch("api/files", { method: "POST", headers: { "Content-Type": file.type }, body: file }); }
      catch (e) { throw new Error("Kanvas stopped running or cannot be reached"); }
      const text = await r.text();
      let info = {};
      try { info = JSON.parse(text); } catch (e) { /* not JSON */ }
      if (!r.ok) throw new Error(info.error || `server answered ${r.status}`);
      return info.path;
    },
  };
}

function fileStore(handle) {
  let lastText = null, lastMod = 0, lastSize = -1;
  const remember = (f, text) => { lastText = text; lastMod = f.lastModified; lastSize = f.size; };
  const read = async () => (await handle.getFile()).text();
  return {
    kind: "file",
    name: handle.name,
    async load() {
      const f = await handle.getFile();
      const text = await f.text();
      remember(f, text);
      return normalize(JSON.parse(text));
    },
    async poll() {
      const f = await handle.getFile();
      if (f.lastModified === lastMod && f.size === lastSize) return null;
      const text = await f.text();
      if (text === lastText) { remember(f, text); return null; }
      return { board: normalize(JSON.parse(text)), accept: () => remember(f, text) };
    },
    // The CLI's lock file is out of reach from a file handle. An agent's write since the file was read is caught by
    // reading it again just before close() puts the new text in place, and the change is made again on top of it.
    async save(fn, base) {
      let current = await read();
      for (let attempt = 0; attempt < 6; attempt++) {
        if (attempt || current !== lastText) base = normalize(JSON.parse(current));
        const draft = clone(base);
        fn(draft);
        const text = serialize(draft);
        const w = await handle.createWritable();
        await w.write(text);
        const again = await read();
        if (again !== current) { await w.abort(); current = again; continue; }
        await w.close();
        const f = await handle.getFile(), now = await f.text();
        // A write that landed right after this one is read at the next poll.
        if (now === text) remember(f, text); else { lastText = text; lastMod = -1; }
        return { board: normalize(JSON.parse(text)), base };
      }
      throw new Error("the board kept changing; try again");
    },
  };
}

function memoryStore(name, initial) {
  return {
    kind: "memory",
    name,
    dirty: false,
    async load() { return normalize(clone(initial)); },
    async poll() { return null; },
    async save(fn, base) { const d = clone(base); fn(d); this.dirty = true; initial = d; return { board: d, base }; },
  };
}

function snapshotStore(el) {
  const data = JSON.parse(el.textContent), files = document.getElementById("kanvas-files");
  const images = files ? JSON.parse(files.textContent) : {};
  return {
    kind: "snapshot", readOnly: true, at: el.dataset.at, boardName: el.dataset.name,
    async load() { return normalize(data); }, async poll() { return null; },
    imageUrl: (ref) => (Object.prototype.hasOwnProperty.call(images, ref) && /^data:image\/(png|jpeg|gif|webp);base64,/.test(images[ref]) ? images[ref] : null),
  };
}

async function open(s) {
  const b = await s.load();
  store = s;
  confirmed = b;
  setBoard(clone(b));
  edits.undo = [];
  edits.redo = [];
  renderUndo();
  document.body.classList.toggle("readonly", !!s.readOnly);
  $("#welcome").hidden = true;
  fitted = false;
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && get(hash)) ui.selected = get(hash).id;
  setSync("ok");
  render();
}

async function commit(fn, { record = true, onFail = null } = {}) {
  if (!store || store.readOnly) { toast("This snapshot is read-only"); return false; }
  // Refused at once, so nothing looks saved and then vanishes; the banner says how to bring Kanvas back.
  if (lost) { toast(`Not saved: ${lost}`, "error"); if (onFail) onFail(new Error(lost)); return false; }
  let draft;
  const before = clone(board);
  try { draft = clone(board); fn(draft); } catch (e) { toast(e.message, "error"); if (onFail) onFail(e); return false; }
  const entry = record ? remember(before, draft) : null;
  setBoard(draft);
  render();
  pending++;
  writes++;
  saveQueue = saveQueue.then(async () => {
    try {
      const saved = await store.save(fn, confirmed);
      confirmed = saved.board;
      // Undo reverts what was written, which differs from the draft when the change was replayed on agent edits.
      if (entry) { entry.before = saved.base; entry.after = saved.board; }
      setSync("ok");
    } catch (e) {
      toast(`Not saved: ${e.message}`, "error");
      if (entry) forget(entry);
      if (onFail) onFail(e);
      try { confirmed = await store.load(); } catch (err) { setSync("bad", err.message, err.lost); }
    } finally {
      pending--;
      if (!pending) { setBoard(clone(confirmed)); render(); }
    }
  });
  return true;
}

async function poll() {
  if (store && !pending && document.visibilityState === "visible") {
    const seen = writes;
    try {
      const fresh = await store.poll();
      if (store.kind !== "memory" && store.kind !== "snapshot") setSync("ok");
      // A board read while a save ran may not match the version that save left: drop it and read again next time.
      if (fresh && !pending && writes === seen) { fresh.accept(); applyRemote(fresh.board); }
    } catch (e) {
      setSync("bad", e.message, e.lost);
    }
  }
  setTimeout(poll, POLL_MS);
}

function applyRemote(fresh) {
  const before = new Map(board.tasks.map((t) => [key(t.id), t]));
  confirmed = fresh;
  setBoard(clone(fresh));
  const changed = board.tasks.filter((t) => !sameJson(before.get(key(t.id)), t)).map((t) => t.id);
  const withdrawn = [...before.values()].filter((t) => t.state === "proposed" && !get(t.id));
  if (ui.selected && !get(ui.selected)) {
    if (!withdrawn.some((t) => same(t.id, ui.selected))) toast(`${ui.selected} was removed`);
    ui.selected = null;
  }
  render();
  flash(changed);
  announce(board.tasks.filter((t) => moved(before.get(key(t.id)), t)).map((t) => [t, before.get(key(t.id))]), withdrawn);
}

const revised = (old, t) => old.state === "proposed" && t.state === "proposed" && ["title", "desc", "group", "deps"].some((k) => !sameJson(old[k], t[k]));
const asked = (old, t) => !!openQuestion(t) && (!old || t.notes.length > old.notes.length);
const moved = (old, t) => !old || old.state !== t.state || revised(old, t) || asked(old, t);

// What agents did since the last poll, as toasts that lead to the task, and in the activity list of the inbox.
// `where` is another board's { name, title }, or null for this one. The author is only known when the move added a note.
const ACTIVITY = { proposed: "proposed", doing: "started", review: "finished", done: "finished", todo: "paused" };
// A plan arrives as many proposals at once, so planning toasts only on the board it happens on.
const PLANNING = new Set(["proposed", "revised", "withdrew"]);
function announce(moves, withdrawn, where = null, b = board) {
  const shown = moves.filter(([t, old]) => ACTIVITY[t.state] && !(t.state === "todo" && (!old || old.state !== "doing")));
  const name = where ? where.name : boardHere(), ix = indexOf(b);
  let events = [
    ...withdrawn.map((t) => ({ id: t.id, title: t.title, verb: "withdrew", state: null, by: null })),
    ...shown.map(([t, old]) => {
      const last = t.notes[t.notes.length - 1], by = last && t.notes.length > (old ? old.notes.length : 0) ? last.by : !old && t.by !== "human" ? t.by || null : null;
      if (asked(old, t)) return { id: t.id, title: t.title, verb: "asks", state: "ask", by };
      const verb = old && revised(old, t) ? "revised" : !old && t.state === "proposed" ? "proposed" : ACTIVITY[t.state];
      return { id: t.id, title: t.title, verb, state: vstateIn(ix, t), by };
    }),
  ];
  if (where) events = events.filter((e) => !PLANNING.has(e.verb));
  if (!events.length) return;
  const there = () => where ? h("span", { class: "where" }, where.title || where.name) : null;
  // Each question has a toast of its own, shown last so the others do not push it out, and it stays longer: the agent
  // is stuck until the human replies.
  const asks = events.filter((e) => e.verb === "asks"), rest = events.filter((e) => e.verb !== "asks");
  if (rest.length > 3) toast([there(), h("span", { class: "msg" }, `${rest.length} tasks changed`)], "activity", 4200, where ? () => goTask(where.name) : null);
  else for (const e of rest) toast([there(), ...activityLine(e)], "activity", 4200, e.state ? () => goTask(name, e.id) : null);
  for (const e of asks) toast([there(), ...activityLine(e)], "activity ask", 10000, () => goTask(name, e.id));
}

// "claude finished BE-02 Fetch forecasts [Review]", or "Finished BE-02 Fetch forecasts" when the author is unknown.
// The verb comes before the title, which long titles cut short.
const SAYS = { asks: "waits for your reply on" };
function activityLine(e) {
  const task = [h("span", { class: "cid" }, e.id), " ", e.title];
  const verb = e.verb === "withdrew" ? "Withdrawn" : e.verb === "asks" ? "Waiting for your reply:" : e.verb[0].toUpperCase() + e.verb.slice(1);
  const words = e.by && e.verb !== "withdrew" ? [h("b", {}, e.by), ` ${SAYS[e.verb] || e.verb} `, task] : [h("b", {}, verb), " ", task];
  return [e.by ? agentMark(e.by) : null, h("span", { class: "msg" }, words), e.state ? h("span", { class: `badge s-${e.state}` }, LABEL[e.state]) : null];
}
// ---------------------------------------------------------------------------
// Undo and redo of the human's own changes
// ---------------------------------------------------------------------------

const edits = { undo: [], redo: [] };
const UNDO_LIMIT = 100;

function remember(before, after) {
  if (serialize(before) === serialize(after)) return null;
  const entry = { before, after, label: describeChange(before, after) };
  edits.undo.push(entry);
  if (edits.undo.length > UNDO_LIMIT) edits.undo.shift();
  edits.redo = [];
  renderUndo();
  return entry;
}

function forget(entry) {
  edits.undo = edits.undo.filter((e) => e !== entry);
  renderUndo();
}

// How a move reads, as [done, doing] with % for the task: "Approved %", "approving %".
const MOVE_WORDS = {
  "proposed>todo": ["Approved %", "approving %"],
  "doing>todo": ["Paused %", "pausing %"],
  "review>todo": ["Sent % back", "sending % back"],
  "done>todo": ["Reopened %", "reopening %"],
  ">doing": ["Started %", "starting %"],
  ">review": ["Sent % to review", "sending % to review"],
  ">done": ["Marked % done", "marking % done"],
};
const moveWords = (from, to) => MOVE_WORDS[`${from}>${to}`] || MOVE_WORDS[`>${to}`] || [`Moved % to ${LABEL[to] || to}`, `moving % to ${LABEL[to] || to}`];
const andList = (items) => (items.length > 1 ? `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}` : items.join(""));

// What a change did, worded to follow "Undo" and "Undid": "approving BE-05", "deleting BE-02 and BE-03".
function describeChange(a, z) {
  const A = new Map(a.tasks.map((t) => [key(t.id), t])), Z = new Map(z.tasks.map((t) => [key(t.id), t]));
  const GA = new Map(a.groups.map((g) => [g.id, g])), GZ = new Map(z.groups.map((g) => [g.id, g]));
  // Deleting a group and turning on YOLO change many tasks along the way.
  const gone = a.groups.find((g) => !GZ.has(g.id));
  if (gone) return `deleting the ${gone.name} group`;
  const yolo = z.tasks.find((t) => t.yolo && A.has(key(t.id)) && !A.get(key(t.id)).yolo);
  if (yolo) return `turning on YOLO up to ${yolo.id}`;
  const acts = new Map();
  const act = (words, id) => { if (!acts.has(words)) acts.set(words, []); if (id) acts.get(words).push(id); };
  for (const [k, t] of Z) if (!A.has(k)) act("adding %", t.id);
  for (const [k, t] of A) {
    const n = Z.get(k);
    if (!n) { act(t.state === "proposed" ? "rejecting %" : "deleting %", t.id); continue; }
    if (t.state !== n.state) { act(moveWords(t.state, n.state)[1], t.id); continue; }
    if (t.yolo && !n.yolo) { act("turning off YOLO on %", t.id); continue; }
    // Dependencies on tasks added or deleted by the same change come and go with them.
    const was = new Set(t.deps.map(key)), now = new Set(n.deps.map(key));
    const added = n.deps.filter((d) => !was.has(key(d)) && A.has(key(d))), dropped = t.deps.filter((d) => !now.has(key(d)) && Z.has(key(d)));
    if (added.length) act(`making % wait for ${andList(added)}`, t.id);
    if (dropped.length) act(`unlinking % from ${andList(dropped)}`, t.id);
    if (added.length || dropped.length) continue;
    const g = GZ.get(n.group);
    if (n.notes.length > t.notes.length && changeRequest(n) === n.notes[n.notes.length - 1]) act("asking for changes to %", t.id);
    else if (!sameJson(t.notes, n.notes)) act(n.notes.length > t.notes.length ? "adding a note to %" : n.notes.length < t.notes.length ? "deleting a note from %" : "editing a note on %", t.id);
    else if (t.title !== n.title) act("renaming %", t.id);
    else if (t.desc !== n.desc) act("editing the description of %", t.id);
    else if (t.group !== n.group) act(g ? `moving % to ${g.name}` : "taking % out of its group", t.id);
    else if (!sameJson({ ...t, deps: null }, { ...n, deps: null })) act("changing %", t.id);
  }
  for (const g of z.groups) if (!GA.has(g.id)) act(`adding the ${g.name} group`);
  for (const g of a.groups) if (GZ.get(g.id).name !== g.name) act(`renaming the ${g.name} group`);
  if (!acts.size && !sameJson(a.groups.map((g) => g.id), z.groups.map((g) => g.id))) act("reordering the groups");
  if (!acts.size && !sameJson(a.tasks.map((t) => t.id), z.tasks.map((t) => t.id))) act("reordering the cards");
  if (a.title !== z.title) act("renaming the board");
  const all = [...acts].map(([words, ids]) => words.replace("%", ids.length > 3 ? `${ids.length} tasks` : andList(ids)));
  return all.length > 2 ? `${all.slice(0, 2).join(", ")} and ${all.length - 2} more` : andList(all) || "a change";
}

// Undoes or redoes the last change, or `entry`: an earlier change is taken back by itself, like the last one.
function step(dir, entry = null) {
  if (!board || !store || store.readOnly) return;
  const from = edits[dir], to = edits[dir === "undo" ? "redo" : "undo"];
  entry = entry || from[from.length - 1];
  if (!entry) return toast(dir === "undo" ? "Nothing to undo" : "Nothing to redo");
  const at = from.indexOf(entry);
  if (at < 0) return toast(dir === "undo" ? "Already undone" : "Already redone");
  const [a, z] = dir === "undo" ? [entry.after, entry.before] : [entry.before, entry.after];
  let result;
  try { result = replay(clone(board), a, z); } catch (e) { toast(`Can't ${dir}: ${e.message}`, "error"); return; }
  from.splice(at, 1);
  if (!result.applied) {
    renderUndo();
    return toast(`Can't ${dir} ${entry.label}: it was changed since`, "error");
  }
  commit((b) => { result = replay(b, a, z); }, { record: false }).then((ok) => {
    if (ok) to.push(entry); else from.splice(Math.min(at, from.length), 0, entry);
    renderUndo();
    if (!ok) return;
    const kept = result.skipped ? ` (${result.skipped} later change${result.skipped > 1 ? "s" : ""} kept)` : "";
    toast(`${dir === "undo" ? "Undid" : "Redid"} ${entry.label}${kept}`);
    if (dir === "undo" && entry.onUndo) entry.onUndo();
  });
}

// Makes a change and confirms it with a toast whose Undo button takes back that change. A failed save takes the toast away.
function undoable(fn, message, { onFail = null } = {}) {
  const before = edits.undo[edits.undo.length - 1];
  let shown = null;
  return commit(fn, { onFail: (e) => { if (shown) shown.remove(); if (onFail) onFail(e); } }).then((ok) => {
    const entry = edits.undo[edits.undo.length - 1];
    if (ok) {
      shown = toast([h("span", { class: "msg" }, message), entry !== before ? h("button", { class: "link", title: keyLabel("Undo (Ctrl+Z)"),
        onclick: (e) => { e.target.closest(".toast").remove(); step("undo", entry); } }, "Undo") : null], "", 5000);
    }
    return ok;
  });
}

function renderUndo() {
  for (const dir of ["undo", "redo"]) {
    const btn = $(`#${dir}`), last = edits[dir][edits[dir].length - 1];
    btn.disabled = !last;
    btn.dataset.tip = last ? `${dir === "undo" ? "Undo" : "Redo"} ${last.label}` : `Nothing to ${dir}`;
  }
}

// `unreachable` marks a "bad" status where the page cannot reach the board at all, which shows the banner.
function setSync(status, detail, unreachable = false) {
  const el = $("#sync");
  let label = "", cls = status;
  if (!store) return;
  setLost(store.kind === "server" && status === "bad" && unreachable ? detail : null);
  if (store.kind === "server") label = status === "ok" ? "Live" : "Disconnected";
  else if (store.kind === "file") label = status === "ok" ? store.name : "File unavailable";
  else if (store.kind === "memory") { label = store.dirty ? "Unsaved" : "Not synced"; cls = "warn"; }
  else if (store.kind === "snapshot") { label = "Read-only snapshot"; cls = ""; }
  el.className = `sync ${cls}`;
  el.querySelector(".label").textContent = label;
  el.dataset.tip = detail || {
    server: "Synced with kanvas.json through the Kanvas server. Agent changes appear within a second.",
    file: "Reading and writing the file directly. Agent changes appear within a second.",
    memory: "Changes live in this tab only. Use Save to download the board.",
    snapshot: store.at ? `Exported ${new Date(store.at).toLocaleString()}` : "Exported board",
  }[store.kind];
  el.setAttribute("aria-label", `${label}. ${el.dataset.tip}`);
  // A Tab stop shows the tooltip to the keyboard, which only matters when the status is more than "Live".
  el.tabIndex = cls === "ok" && store.kind === "server" ? -1 : 0;
  $("#download").hidden = store.kind !== "memory";
}

// Filled only when the reason changes, so screen readers announce the alert once.
function setLost(why) {
  const el = $("#lost");
  lost = why;
  if (el.dataset.why === (why || "")) return;
  el.dataset.why = why || "";
  if (why) el.replaceChildren(h("span", {}, h("strong", {}, `${why[0].toUpperCase()}${why.slice(1)}.`), " ", serveHint("Run "),
    " Until then nothing can be saved, and this page reconnects by itself."));
  el.hidden = !why;
}

// How to start Kanvas for a project, as the welcome screen and the lost connection banner put it.
const serveHint = (lead) => [lead, h("code", {}, "kanvas serve"), " in the project folder, or ",
  h("code", {}, "python .agents/skills/kanvas/kanvas.py serve"), " if the command is not installed."];

// ---------------------------------------------------------------------------
// Changes a human can make (each is replayed on the latest board when saving)
// ---------------------------------------------------------------------------

function mustFind(b, id) {
  const t = b.tasks.find((x) => same(x.id, id));
  if (!t) throw new Error(`${id} no longer exists`);
  return t;
}
// Times are taken when the change is made, so a save that replays it writes what the page showed.
const addNote = (t, text, at) => t.notes.push({ at, by: "human", text });

// What the human saw of a task when they acted on it. Agents may revise proposals until they are
// approved, so approving checks that the proposal still reads the same.
const seenOf = (t) => ({ id: t.id, state: t.state, title: t.title, desc: t.desc, group: t.group, deps: [...t.deps] });
const revisedSince = (t, seen) => ["title", "desc", "group", "deps"].some((k) => !sameJson(t[k], seen[k]));
const FIELD = { title: "the title", desc: "the description", group: "the group" };

const ops = {
  title: (text) => (b) => { b.title = text; },
  // `was` holds the values the human started from, so a replay never overwrites a field an agent changed meanwhile.
  set: (id, patch, was) => (b) => {
    const t = mustFind(b, id);
    for (const k of Object.keys(patch)) {
      if (was && k in was && !sameJson(t[k], was[k]) && !sameJson(t[k], patch[k])) throw new Error(`${FIELD[k] || k} of ${t.id} changed meanwhile`);
    }
    Object.assign(t, patch);
  },
  // A checklist item is known by its text, and its rank tells identical items apart by their order, so a
  // replay still finds it after agents edit the rest of the description. An item already in the wanted state is left alone.
  checkItem: (id, text, rank, checked) => (b) => {
    const t = mustFind(b, id), desc = toggleTask(t.desc, text, rank, checked);
    if (desc == null) throw new Error(`That checklist item in ${t.id} changed meanwhile`);
    t.desc = desc;
  },
  // `seen` is the task as the human saw it, so a replay never undoes a move an agent made meanwhile,
  // nor approves a proposal an agent rewrote.
  state: (id, seen, state, text, at = nowIso()) => (b) => {
    const t = mustFind(b, id), from = seen.state;
    if (t.state !== from && t.state !== state) throw new Error(`${t.id} is in ${LABEL[t.state] || t.state} now, not ${LABEL[from] || from}`);
    if (from === "proposed" && t.state === "proposed" && state !== "proposed" && revisedSince(t, seen)) {
      throw new Error(`${t.id} was revised since you opened it; read the new version first`);
    }
    t.state = state;
    if (text) addNote(t, text, at);
  },
  note: (id, text, at = nowIso()) => (b) => addNote(mustFind(b, id), text, at),
  // Notes are found by author, time and text, so an edit still finds its note after agents add more.
  editNote: (id, n, rank, text, edited = nowIso()) => (b) => { const t = mustFind(b, id), i = noteIndex(t, n, rank); t.notes[i] = { ...t.notes[i], text, edited }; },
  removeNote: (id, n, rank) => (b) => { const t = mustFind(b, id); t.notes.splice(noteIndex(t, n, rank), 1); },
  addTask: (f, out) => (b) => {
    const t = { id: nextId(b, f.group || UNGROUPED), title: f.title, state: "todo", group: f.group || null, deps: [], at: nowIso(), by: "human", desc: f.desc || "", notes: [] };
    const cover = yoloCoverIn(b);
    for (const ref of f.deps || []) t.deps.push(mustFind(b, ref).id);
    b.tasks.push(t);
    for (const ref of f.blocks || []) {
      const x = mustFind(b, ref);
      if (reaches(b, t.id, x.id)) throw new Error(`${x.id} cannot wait for the new task: that would create a cycle`);
      x.deps.push(t.id);
    }
    approveJoining(b, cover);
    out.id = t.id;
  },
  remove: (id) => (b) => {
    mustFind(b, id);
    b.tasks = b.tasks.filter((t) => !same(t.id, id));
    for (const t of b.tasks) t.deps = t.deps.filter((d) => !same(d, id));
  },
  // The manual graph layout shows cards in file order, so moving a card moves its task in the list.
  move: (id, group, before, after) => (b) => {
    const t = mustFind(b, id), i = b.tasks.indexOf(t);
    t.group = group;
    b.tasks.splice(i, 1);
    const j = b.tasks.findIndex((x) => same(x.id, before || after || ""));
    b.tasks.splice(j < 0 ? i : before ? j : j + 1, 0, t);
  },
  order: (ids) => (b) => reorderTasks(b, ids),
  addDep: (id, dep) => (b) => {
    const t = mustFind(b, id), d = mustFind(b, dep);
    if (t === d) throw new Error("A task cannot depend on itself");
    if (t.deps.some((x) => same(x, d.id))) return;
    if (reaches(b, d.id, t.id)) throw new Error(`${t.id} cannot depend on ${d.id}: that would create a cycle`);
    const cover = yoloCoverIn(b);
    t.deps.push(d.id);
    approveJoining(b, cover);
  },
  removeDep: (id, dep) => (b) => { const t = mustFind(b, id); t.deps = t.deps.filter((x) => !same(x, dep)); },
  // Withdrawn proposals are skipped; a revised one stops the whole approval, so the human reads it first.
  approve: (seen) => (b) => {
    const now = seen.map((s) => [b.tasks.find((t) => same(t.id, s.id)), s]).filter(([t]) => t && t.state === "proposed");
    const revised = now.filter(([t, s]) => revisedSince(t, s)).map(([t]) => t.id);
    if (revised.length) throw new Error(`${revised.join(", ")} ${revised.length > 1 ? "were" : "was"} revised since you looked; read the new version first`);
    for (const [t] of now) t.state = "todo";
  },
  yolo: (id, on) => (b) => {
    const t = mustFind(b, id);
    if (!on) { delete t.yolo; return; }
    const via = yoloCoverIn(b).get(key(t.id));
    if (via && !same(via, t.id)) throw new Error(`${t.id} is already covered by YOLO on ${via}`);
    yoloOn(b, t.id);
  },
  addGroup: (name, prefix) => (b) => {
    if (b.groups.some((g) => g.name.toLowerCase() === name.toLowerCase())) throw new Error(`Group "${name}" already exists`);
    if (!PREFIX_RE.test(prefix)) throw new Error("Prefix: 1-6 letters or digits, starting with a letter");
    if (b.groups.some((g) => g.id === prefix)) throw new Error(`Prefix ${prefix} is already used`);
    b.groups.push({ id: prefix, name });
  },
  renameGroup: (gid, name) => (b) => { const g = b.groups.find((x) => x.id === gid); if (g) g.name = name; },
  moveGroup: (gid, delta) => (b) => {
    const i = b.groups.findIndex((g) => g.id === gid), j = i + delta;
    if (i >= 0 && j >= 0 && j < b.groups.length) [b.groups[i], b.groups[j]] = [b.groups[j], b.groups[i]];
  },
  // Puts a group just before another one, or last.
  placeGroup: (gid, before) => (b) => {
    const g = b.groups.find((x) => x.id === gid);
    if (!g) throw new Error(`Group ${gid} no longer exists`);
    b.groups.splice(b.groups.indexOf(g), 1);
    const j = before ? b.groups.findIndex((x) => x.id === before) : -1;
    b.groups.splice(j < 0 ? b.groups.length : j, 0, g);
  },
  deleteGroup: (gid, ids) => (b) => {
    if (!b.groups.some((g) => g.id === gid)) throw new Error(`Group ${gid} no longer exists`);
    removeGroup(b, gid, ids);
  },
};

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function matches(t) {
  if (ui.states.size && !ui.states.has(vstate(t))) return false;
  if (ui.groups.size && !ui.groups.has(laneId(t) || "")) return false;
  const q = ui.search.trim().toLowerCase();
  if (!q) return true;
  const g = groupOf(t);
  return [t.id, t.title, t.desc, g ? g.name : "", ...t.notes.map((n) => n.text || "")].some((s) => s.toLowerCase().includes(q));
}

function render() {
  if (!board) return;
  const focused = document.activeElement;
  renderHeader();
  renderProblems();
  $("#graph-view").hidden = ui.view !== "graph";
  $("#board-view").hidden = ui.view !== "board";
  renderPanel();
  if (ui.view === "graph") renderGraph();
  else renderKanban();
  if (picking) applyPick();
  applyMulti();
  // The board view draws its cards anew, and the focus moves to the new card.
  if (focused?.matches(".kcard") && !focused.isConnected) { const el = shownCard(focused.dataset.id); if (el) focusCard(el); }
}

function renderHeader() {
  const slot = $("#title-slot");
  const titleBtn = slot.querySelector(".board-title");
  if (!ui.editingTitle && titleBtn) {
    titleBtn.querySelector(".t").textContent = titleBtn.title = boardLabel();
  } else if (!ui.editingTitle) {
    slot.replaceChildren(h("button", { class: "board-title", title: boardLabel(), "aria-haspopup": "menu", "aria-expanded": "false", onclick: (e) => dropdown(e.currentTarget, boardMenu()) },
      h("span", { class: "t" }, boardLabel()), icon("chevron")));
  } else if (!slot.querySelector("input")) {
    const input = h("input", { class: "title-input", value: drafts.boardTitle ?? board.title, "aria-label": "Board title" });
    const done = (save) => {
      if (!ui.editingTitle) return;
      ui.editingTitle = false;
      drafts.boardTitle = null;
      const v = input.value.trim();
      if (save && v !== board.title) commit(ops.title(v), { onFail: () => { if (!ui.editingTitle) { ui.editingTitle = true; drafts.boardTitle = v; } } }); else renderHeader();
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); });
    input.addEventListener("blur", () => done(true));
    slot.replaceChildren(input);
    // A title given back by a failed save does not take the focus from whatever the human does now.
    if (drafts.boardTitle == null) {
      input.focus();
      input.select();
    }
  }

  const counts = Object.fromEntries(VIEW_STATES.map((s) => [s, 0]));
  for (const t of board.tasks) counts[vstate(t)] = (counts[vstate(t)] || 0) + 1;
  $("#chips").replaceChildren(...VIEW_STATES.map((s) => {
    const hidden = s === "done" && prefs.hideDone;
    const on = ui.states.has(s);
    return h("button", {
      class: `schip s-${s}${on ? " on" : ""}${counts[s] ? "" : " zero"}${hidden ? " off" : ""}`,
      "data-tip": hidden ? `${counts[s]} finished task${counts[s] === 1 ? " is" : "s are"} hidden. Click to show them.`
        : on ? `Showing only ${LABEL[s].toLowerCase()} tasks. Click to show all.` : `Show only ${LABEL[s].toLowerCase()} tasks. Shift+click to add to the filter.`,
      "data-key": hidden ? "H" : null,
      "aria-pressed": on ? "true" : "false",
      "aria-label": `${LABEL[s]}: ${counts[s]}`,
      onclick: (e) => {
        if (hidden) return toggleDone();
        if (e.shiftKey) on ? ui.states.delete(s) : ui.states.add(s);
        else if (ui.states.size === 1 && on) ui.states.clear();
        else ui.states = new Set([s]);
        render();
      },
    }, h("span", { class: "dot" }), hidden ? icon("eye-off") : null, h("span", { class: "lbl" }, LABEL[s]), h("b", {}, counts[s]));
  }));

  for (const id of ui.groups) if (id && !board.groups.some((g) => g.id === id)) ui.groups.delete(id);
  const gf = $("#group-filter"), only = ui.groups.size === 1 ? [...ui.groups][0] : null;
  const og = only ? board.groups.find((g) => g.id === only) : null;
  const gname = !ui.groups.size ? "Groups" : only === null ? `${ui.groups.size} groups` : og ? og.name : "No group";
  gf.hidden = !board.groups.length && !ui.groups.size;
  gf.classList.toggle("on", ui.groups.size > 0);
  gf.style.setProperty("--g", og ? groupColor(og) : "var(--accent)");
  gf.replaceChildren(groupTag(og ? groupColor(og) : null), h("span", { class: "lbl" }, gname), icon("chevron"));
  gf.dataset.tip = ui.groups.size ? `Showing only ${only === null ? `${ui.groups.size} groups` : gname}. Click to change.` : "Show only some groups";
  gf.setAttribute("aria-label", ui.groups.size ? `Filter by group: ${gname}` : "Filter by group");

  const fb = $("#filter"), filtering = ui.states.size + ui.groups.size + (ui.search ? 1 : 0);
  fb.classList.toggle("on", filtering > 0);
  fb.setAttribute("aria-label", filtering ? "Filters: some tasks are filtered out" : "Filters");

  renderInboxButton();
  const hd = $("#hide-done");
  hd.classList.toggle("on", !!prefs.hideDone);
  hd.setAttribute("aria-pressed", String(!!prefs.hideDone));
  hd.dataset.tip = prefs.hideDone ? `${counts.done} finished task${counts.done === 1 ? " is" : "s are"} hidden. Click to show them.` : "Hide finished tasks";
  hd.setAttribute("aria-label", "Hide finished tasks");
  hd.replaceChildren(icon(prefs.hideDone ? "eye-off" : "eye"));

  const total = board.tasks.length || 1;
  $("#progress").replaceChildren(...["done", "review", "doing", "todo", "blocked", "proposed"].map((s) =>
    h("span", { class: `s-${s}`, style: `flex-grow:${counts[s] / total}` })));
  $("#meter").dataset.tip = `${counts.done} of ${board.tasks.length} tasks done`;
  $("#meter").setAttribute("aria-label", $("#meter").dataset.tip);
  $("#meter-pct").textContent = `${Math.round((100 * counts.done) / total)}%`;
  const targets = board.tasks.filter(isYoloTarget);
  const charged = board.tasks.filter((t) => yoloVia(t) && t.state !== "proposed").length;
  const chip = $("#yolo-chip");
  chip.hidden = !targets.length;
  if (targets.length) {
    chip.replaceChildren(icon("zap"), h("span", { class: "lbl" }, "YOLO"), h("b", {}, charged));
    chip.dataset.tip = `YOLO on ${targets.map((t) => t.id).join(", ")}: agents take on ${charged} task${charged > 1 ? "s" : ""} without approval and send ${targets.length > 1 ? "these" : "it"} to you for review. Click to open ${targets.length > 1 ? "them one by one" : "it"}.`;
    chip.setAttribute("aria-label", `YOLO on ${targets.map((t) => t.id).join(", ")}: ${charged} task${charged > 1 ? "s" : ""} without approval`);
    chip.onclick = () => { const i = targets.findIndex((t) => same(t.id, ui.selected)); select(targets[(i + 1) % targets.length].id); };
  }
  for (const v of ["graph", "board"]) {
    const btn = $(`#view-${v}`);
    btn.classList.toggle("on", ui.view === v);
    btn.setAttribute("aria-pressed", ui.view === v ? "true" : "false");
  }
}

function renderProblems() {
  const { errors, warnings } = problemsOf(board);
  const el = $("#problems");
  const all = [...errors, ...warnings];
  el.hidden = !all.length;
  if (!all.length) return;
  el.className = `banner${errors.length ? " error" : ""}`;
  const expanded = el.dataset.expanded === "1";
  const shown = expanded ? all : all.slice(0, 1);
  const plural = (n, word) => `${n} ${word}${n > 1 ? "s" : ""}`;
  const summary = [errors.length ? plural(errors.length, "error") : "", warnings.length ? plural(warnings.length, "warning") : ""].filter(Boolean).join(", ");
  el.replaceChildren(...compact(
    h("strong", {}, summary),
    h("ul", {}, shown.map((p) => h("li", {}, p))),
    all.length > 1 ? h("button", { onclick: () => { el.dataset.expanded = expanded ? "0" : "1"; renderProblems(); } }, expanded ? "Show less" : `Show all ${all.length}`) : null,
  ));
}

// Graph view ---------------------------------------------------------------

const edgeFor = (hit) => document.querySelector(`#edge-layer path[data-from="${CSS.escape(hit.dataset.from)}"][data-to="${CSS.escape(hit.dataset.to)}"]`);

const cardEls = new Map();
let lastLayout = null;
// For tuning the layout from the browser console.
window.kanvasLayoutStats = () => lastLayout && layoutMetrics(lastLayout);

const agentMark = (by) => h("span", { class: "agent", style: `--a:${by === "human" ? "#64748b" : colorFor(by)}` }, by.slice(0, 1));

// What a screen reader says for a card: its ID and title, its state, and the agent or the tasks its foot names.
function cardLabel(t, vs, waits) {
  const q = openQuestion(t), last = t.notes[t.notes.length - 1];
  const who = q ? q.by : vs === "blocked" ? `waiting on ${waits.join(", ")}` : last && (vs === "doing" || vs === "review") ? last.by : vs === "proposed" ? t.by : null;
  return compact(`${t.id} ${t.title}`, q ? "Waiting for you" : LABEL[vs], who || null).join(", ");
}

function cardFoot(t) {
  const vs = vstate(t), notes = t.notes.length, last = t.notes[notes - 1], q = openQuestion(t);
  let left = null;
  if (q) {
    const by = q.by || "?", text = questionText(q);
    left = h("span", { class: "grow who", title: `${by} waits for your reply in its chat:\n${text}` }, agentMark(by), h("span", { class: "q" }, text.split("\n")[0]));
  } else if (vs === "blocked") {
    const waits = unmet(t);
    left = h("span", { class: "grow", title: `Waiting on ${waits.join(", ")}` }, icon("lock"), ` ${waits[0]}${waits.length > 1 ? ` +${waits.length - 1}` : ""}`);
  } else if (last && (vs === "doing" || vs === "review")) {
    const by = last.by || "?";
    left = h("span", { class: "grow who", title: last.text }, vs === "doing" ? h("i", { class: "live" }) : null, agentMark(by), h("span", { class: "t" }, `${by} · ${ago(last.at)}`));
  } else if (vs === "proposed" && t.by) {
    left = h("span", { class: "grow who", title: `Proposed by ${t.by}` }, agentMark(t.by), h("span", { class: "t" }, t.at ? `${t.by} · ${ago(t.at)}` : t.by));
  } else if (t.deps.length) {
    left = h("span", { class: "grow" }, icon("link"), ` ${t.deps.length - unmet(t).length}/${t.deps.length}`);
  } else {

// Room for the graph on screen, with a margin, in viewport coordinates: the viewport less a task panel lying

  focusCard(el);
}

// One card of the view on screen is in the Tab order, the selected one or else the first, and the arrow keys move the
// focus on from it.
function rove() {
  const cards = ui.view === "graph" ? [...cardEls.values()] : [...document.querySelectorAll("#kanban .kcard")];
  const stubs = ui.view === "graph" ? [...stubEls.values()] : [];
  const stop = cards.find((el) => same(el.dataset.id, ui.selected)) || cards.find((el) => !el.classList.contains("dim")) || cards[0] || stubs[0];
  for (const el of cards) {
    el.tabIndex = el === stop ? 0 : -1;
    el.setAttribute("aria-selected", String(multi.size ? multi.has(key(el.dataset.id)) : same(el.dataset.id, ui.selected)));
  }
  for (const el of stubs) el.tabIndex = el === stop ? 0 : -1;
  for (const list of document.querySelectorAll("#cards, #kanban [role=listbox]")) list.setAttribute("aria-multiselectable", String(multi.size > 0));
}

const shownCard = (id) => (id == null ? null : ui.view === "graph" ? cardEls.get(key(id)) : document.querySelector(`#kanban .kcard[data-id="${CSS.escape(id)}"]`));

// Focus that the page moves itself, which leaves the selection as it is.
let quietFocus = false;
function focusCard(el) {
  quietFocus = true;
  el.focus({ preventScroll: true });
  quietFocus = false;
}

// Where a card dragged across the flow to `across` lands: a lane, and the cards of that lane in
// its own depth it goes between. `line` is the across position of the drop marker; `col` is the
// depth's position along the flow.
function dropTarget(id, across) {
  const L = lastLayout, v = L.vertical, task = get(id);
  if (!task || !L.pos.has(key(id)) || !L.lanes.length) return null;
  const at = (t) => L.pos.get(key(t.id)), along = (p) => (v ? p.y : p.x), side = (p) => (v ? p.x : p.y), CA = v ? CW : CH;
  const col = along(at(task));
  // Lanes that share a track split it along the flow, so one lane of each track holds the card's depth.
  const lanes = L.lanes.filter((l) => (v ? l.top <= col && col < l.top + l.height : l.left <= col && col < l.left + l.width))
    .sort((a, c) => (v ? a.left - c.left : a.top - c.top));
  const lane = lanes.find((l) => across < (v ? l.left + l.width : l.top + l.height) + LANE_GAP / 2) || lanes[lanes.length - 1];
  const peers = board.tasks.filter((t) => !same(t.id, id) && L.pos.has(key(t.id)) && laneId(t) === lane.id && along(at(t)) === col)
    .sort((a, c) => side(at(a)) - side(at(c)));
  const i = peers.findIndex((t) => side(at(t)) + CA / 2 > across);
  const before = i >= 0 ? peers[i] : null, after = !before && peers.length ? peers[peers.length - 1] : null;
  // A lane's stub leads its cell.
  const stub = L.stubs.find((s) => s.group === lane.id && along(s) === col);
  const line = before ? (i ? (side(at(peers[i - 1])) + CA + side(at(before))) / 2 : side(at(before)) - GAP_Y / 2)
    : after ? side(at(after)) + CA + GAP_Y / 2
    : stub ? side(stub) + (v ? CW : STUB) + GAP_Y / 2
    : (v ? lane.left + LANE_PAD : lane.top + LANE_HEAD) + CA / 2;
  return { group: lane.id === laneId(task) ? task.group : lane.id, before: before && before.id, after: after && after.id, col, line };
}

// A swimlane being dragged by its header: its group and how far it has moved across the flow.
let movingLane = null;

function shiftLane() {
  if (!movingLane || !lastLayout) return;
  const v = lastLayout.vertical, { id, shift } = movingLane;
  const el = [...document.querySelectorAll("#lanes .lane")].find((x) => x.dataset.group === id);
  if (el) { el.classList.add("moving"); el.style.transform = v ? `translate(${shift}px, 0)` : `translate(0, ${shift}px)`; }
  for (const t of board.tasks) {
    const c = cardEls.get(key(t.id)), p = lastLayout.pos.get(key(t.id));
    if (c && p && laneId(t) === id) c.style.transform = `translate(${p.x + (v ? shift : 0)}px, ${p.y + (v ? 0 : shift)}px)`;
  }
  const s = lastLayout.stubs.find((x) => x.group === id), stub = s && stubEls.get(s.key);
  if (stub) stub.style.transform = `translate(${s.x + (v ? shift : 0)}px, ${s.y + (v ? 0 : shift)}px)`;
}

// The group a dragged swimlane centered at `across` lands before (null: last), and where the
// marker between lanes goes.
function laneDropTarget(id, across) {
  const L = lastLayout, v = L.vertical;
  const start = (l) => (v ? l.left : l.top), end = (l) => start(l) + (v ? l.width : l.height);
  const from = (l) => (v ? l.top : l.left), to = (l) => from(l) + (v ? l.height : l.width), lane = L.lanes.find((l) => l.id === id);
  // In group order, each lane takes the first track with room for it, so the drop places this lane only among the
  // lanes beside it across the flow. Dropped back between the same two, the group stays where it is.
  const others = L.lanes.filter((l) => l.id && l.id !== id && (!lane || (from(l) < to(lane) && from(lane) < to(l))))
    .sort((a, c) => start(a) - start(c));
  const before = others.find((l) => (start(l) + end(l)) / 2 > across) || null;
  const last = others[others.length - 1], line = before ? start(before) - LANE_GAP / 2 : last ? end(last) + LANE_GAP / 2 : 0;
  const ids = board.groups.map((g) => g.id);
  if (lane && (before ? others.indexOf(before) : others.length) === others.filter((l) => start(l) < start(lane)).length) return { before: ids[ids.indexOf(id) + 1] || null, line };
  return { before: before && before.id, line };
}

// A finger held still on the graph opens the menu of what is under it. `at` is when it last did.
const longPress = { at: 0, cancel: () => {} };
const LONG_PRESS_MS = 500;

function setupGraphInput() {
  const vp = $("#viewport"), world = $("#world");
  let drag = null, pressTimer = 0;
  const touches = new Map(); // fingers on the graph: pointer id -> { clientX, clientY }
  const toWorld = (e) => {
    const r = vp.getBoundingClientRect();
    return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k };
  };
  const at = (e) => ({ clientX: e.clientX, clientY: e.clientY });
  // Two fingers: the distance between them sets the zoom, and the graph point under their midpoint stays under it.
  const pinch = () => {
    const [a, b] = touches.values(), r = vp.getBoundingClientRect();
    return { d: Math.max(1, Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)), x: (a.clientX + b.clientX) / 2 - r.left, y: (a.clientY + b.clientY) / 2 - r.top };
  };
  longPress.cancel = () => {
    clearTimeout(pressTimer);
    if (drag && drag.mode === "pan" && !drag.moved) drag = null;
  };
  // The graph moves by its transform only. Focusing a card out of view would scroll the viewport under it.
  vp.addEventListener("scroll", () => { vp.scrollLeft = vp.scrollTop = 0; });
  vp.addEventListener("pointerdown", (e) => {
    // A stub pans and pinches like a card, and opens when tapped; a key press clicks it.
    if (e.button !== 0 || e.target.closest("button:not(.stub)")) return;
    if (e.pointerType === "touch") {
      touches.set(e.pointerId, at(e));
      try { vp.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
      e.preventDefault();
      if (touches.size > 2) return;
      if (touches.size === 2) {
        clearTimeout(pressTimer);
        if (drag) end({ type: "pointercancel" });
        stopGlide();
        const p = pinch();
        drag = { mode: "pinch", ...p, k: view.k, vx: view.x, vy: view.y };
        return;
      }
      clearTimeout(pressTimer);
      if (!picking) {
        const x = e.clientX, y = e.clientY, el = e.target;
        pressTimer = setTimeout(() => {
          if (!drag || drag.mode !== "pan" || drag.moved || touches.size !== 1) return;
          drag = null;
          longPress.at = Date.now();
          closeMenu();
          if (contextMenuAt(el, x, y) && navigator.vibrate) navigator.vibrate(10);
        }, LONG_PRESS_MS);
      }
    }
    const handle = !picking && e.target.closest(".handle");
    if (handle) {
      const from = handle.parentElement.dataset.id, p = lastLayout.pos.get(key(from)), incoming = handle.classList.contains("in");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "edge temp");
      $("#edge-layer").append(path);
      const start = incoming ? inPort(p, lastLayout.vertical) : outPort(p, lastLayout.vertical);
      drag = { mode: "connect", from, incoming, path, start, target: null };
      world.classList.add("connecting");
    } else {
      drag = { mode: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false, card: e.target.closest(".card"), stub: e.target.closest(".stub"), edge: e.target.closest("#edge-hits path"), head: e.target.closest(".lane-head") };
    }
    try { vp.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
    e.preventDefault();
  });
  vp.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch" && touches.has(e.pointerId)) touches.set(e.pointerId, at(e));
    if (!drag) return;
    if (drag.mode === "pinch") {
      if (touches.size < 2) return;
      const p = pinch(), k = clamp(drag.k * p.d / drag.d, MIN_ZOOM, MAX_ZOOM);
      const wx = (drag.x - drag.vx) / drag.k, wy = (drag.y - drag.vy) / drag.k;
      Object.assign(view, { k, x: p.x - wx * k, y: p.y - wy * k });
      applyView(false);
      return;
    }
    if (drag.mode === "pan") {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      // A finger wobbles while it taps, so it moves further before the tap becomes a pan.
      if (!drag.moved && Math.hypot(dx, dy) < (e.pointerType === "touch" ? 10 : 4)) return;
      clearTimeout(pressTimer);
      const arranging = !drag.moved && prefs.arrange === "manual" && !store.readOnly && !picking;
      const start = toWorld({ clientX: drag.sx, clientY: drag.sy });
      if (arranging && drag.card) {
        const id = drag.card.dataset.id;
        drag = { mode: "move", id, el: drag.card, p: lastLayout.pos.get(key(id)), start, target: null };
        drag.el.classList.add("moving");
        world.classList.add("dragging");
        return;
      }
      const lane = arranging && drag.head && drag.head.closest(".lane");
      if (lane && lane.dataset.group) {
        drag = { mode: "lane", id: lane.dataset.group, start, target: null };
        world.classList.add("dragging");
        return;
      }
      drag.moved = true;
      vp.classList.add("panning");
      view.x = drag.vx + dx;
      view.y = drag.vy + dy;
      applyView(false);
    } else if (drag.mode === "move") {
      const w = toWorld(e), v = lastLayout.vertical;
      const q = v ? { x: drag.p.x + w.x - drag.start.x, y: drag.p.y } : { x: drag.p.x, y: drag.p.y + w.y - drag.start.y };
      drag.el.style.transform = `translate(${q.x}px, ${q.y}px)`;
      drag.target = dropTarget(drag.id, v ? q.x + CW / 2 : q.y + CH / 2);
      const line = $("#drop-line"), t = drag.target;
      line.hidden = !t;
      if (t) Object.assign(line.style, v
        ? { transform: `translate(${t.line - 1.5}px, ${t.col + 10}px)`, width: "3px", height: `${CH - 20}px` }
        : { transform: `translate(${t.col + 10}px, ${t.line - 1.5}px)`, width: `${CW - 20}px`, height: "3px" });
    } else if (drag.mode === "lane") {
      const w = toWorld(e), L = lastLayout, v = L.vertical, l = L.lanes.find((x) => x.id === drag.id);
      if (!l) return;
      movingLane = { id: drag.id, shift: v ? w.x - drag.start.x : w.y - drag.start.y };
      shiftLane();
      drag.target = laneDropTarget(drag.id, (v ? l.left + l.width / 2 : l.top + l.height / 2) + movingLane.shift);
      const line = $("#drop-line");
      line.hidden = false;
      Object.assign(line.style, v
        ? { transform: `translate(${drag.target.line - 1.5}px, ${l.top}px)`, width: "3px", height: `${l.height}px` }
        : { transform: `translate(${l.left}px, ${drag.target.line - 1.5}px)`, width: `${l.width}px`, height: "3px" });
    } else {
      const w = toWorld(e);
      drag.path.setAttribute("d", drag.incoming ? edgePath(w, drag.start, lastLayout.vertical, 30) : edgePath(drag.start, w, lastLayout.vertical, 30));
      const over = document.elementFromPoint(e.clientX, e.clientY);
      const card = over && over.closest(".card");
      const target = card && !same(card.dataset.id, drag.from) ? card : null;
      if (drag.target !== target) {
        if (drag.target) drag.target.classList.remove("drop-target");
        if (target) target.classList.add("drop-target");
        drag.target = target;
      }
    }
  });
  const end = (e) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    vp.classList.remove("panning");
    if (d.mode === "lane") {
      movingLane = null;
      world.classList.remove("dragging");
      $("#drop-line").hidden = true;
      const before = d.target && d.target.before, ids = board.groups.map((g) => g.id);
      const draft = clone(board);
      if (e.type === "pointerup" && d.target) ops.placeGroup(d.id, before)(draft);
      if (sameJson(draft.groups.map((g) => g.id), ids)) return renderGraph();
      commit(ops.placeGroup(d.id, before)).then((ok) => { if (!ok) renderGraph(); });
    } else if (d.mode === "move") {
      d.el.classList.remove("moving");
      world.classList.remove("dragging");
      $("#drop-line").hidden = true;
      const t = d.target, task = get(d.id);
      if (e.type !== "pointerup" || !t || !task) return renderGraph();
      const draft = clone(board);
      ops.move(d.id, t.group, t.before, t.after)(draft);
      if (sameJson(draft.tasks.map((x) => [x.id, x.group]), board.tasks.map((x) => [x.id, x.group]))) return renderGraph();
      const regrouped = t.group !== task.group;
      commit(ops.move(d.id, t.group, t.before, t.after)).then((ok) => {
        if (ok && regrouped) toast(`${d.id} moved to ${t.group ? (board.groups.find((g) => g.id === t.group) || { name: t.group }).name : "Ungrouped"}`);
        if (!ok) renderGraph();
      });
    } else if (d.mode === "connect") {
      d.path.remove();
      world.classList.remove("connecting");
      if (d.target) {
        d.target.classList.remove("drop-target");
        const [task, dep] = d.incoming ? [d.from, d.target.dataset.id] : [d.target.dataset.id, d.from];
        if (e.type === "pointerup") undoable(ops.addDep(task, dep), `${task} now depends on ${dep}`);
      }
    } else if (!d.moved && e.type === "pointerup") {
      const stub = d.stub && lastLayout.stubs.find((s) => stubEls.get(s.key) === d.stub);
      if (stub) toggleFold(stub.group);
      else if (picking) { if (d.card) pickToggle(d.card.dataset.id); }      else if (d.edge && !d.card) showEdgeMenu(d.edge, e.clientX, e.clientY);
      else if (d.card && multiClick(e)) toggleMulti(d.card.dataset.id);
      else if (d.card || !multi.size) select(d.card ? d.card.dataset.id : null);
    }
  };
  const up = (e) => {
    if (e.pointerType === "touch") {
      if (!touches.delete(e.pointerId)) return;
      clearTimeout(pressTimer);
      if (drag && drag.mode === "pinch") {
        const [rest] = touches.values();
        drag = rest ? { mode: "pan", sx: rest.clientX, sy: rest.clientY, vx: view.x, vy: view.y, moved: true } : null;
        return;
      }
      if (touches.size) return;
    }
    end(e);
  };
  vp.addEventListener("pointerup", up);
  vp.addEventListener("pointercancel", up);
  // A finger "hovers" from the moment it touches, which would light up arrows before the tap or long press decides anything.
  $("#edge-hits").addEventListener("pointerover", (e) => { if (e.pointerType !== "touch" && !drag && !menuEl && !picking && e.target.dataset.from) { const p = edgeFor(e.target); if (p) { p.classList.add("hover"); markEdge(p); } } });
  $("#edge-hits").addEventListener("pointerout", (e) => { if (e.target.dataset.from) { const p = edgeFor(e.target); if (p) { p.classList.remove("hover"); markEdge(p); } } });
  vp.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
    else {
      view.x -= e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX;
      view.y -= e.shiftKey && !e.deltaX ? 0 : e.deltaY;
      applyView(false);
    }
  }, { passive: false });
  $("#cards").addEventListener("pointerover", (e) => {
    if (e.pointerType === "touch") return;
    const card = e.target.closest(".card");
    const id = card ? card.dataset.id : null;
    if (id !== ui.hover && !drag && !picking) { ui.hover = id; applyFocus(); }
  });
  $("#cards").addEventListener("pointerleave", () => { if (ui.hover) { ui.hover = null; applyFocus(); } });
  $("#zoom-in").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); };
  $("#zoom-out").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); };
  $("#zoom-fit").onclick = () => fit(true);
  $("#zoom-fill").onclick = fillScreen;
  $("#zoom-pct").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1 / view.k, r.width / 2, r.height / 2); };
}

// Board view ---------------------------------------------------------------

function renderKanban() {
  const columns = VIEW_STATES.filter((s) => !(prefs.hideDone && s === "done") && (!ui.states.size || ui.states.has(s)));
  const tasks = boardOrder(board).filter(matches);
  $("#kanban").replaceChildren(...columns.map((s) => {
    const items = tasks.filter((t) => vstate(t) === s);
    const head = h("div", { class: "col-head" }, h("span", { class: "dot" }), LABEL[s], h("span", { class: "count" }, items.length));
    if (s === "proposed" && items.length && !store.readOnly) {
      head.append(h("button", { title: "Approve every proposal in this column", onclick: () => approveAll(items) }, icon("check"), "Approve all"));
    }
    const body = h("div", { class: "col-body", role: items.length ? "listbox" : null, "aria-label": items.length ? LABEL[s] : null },
      items.length ? items.map(kanbanCard) : h("div", { class: "col-empty" }, s === "blocked" ? "Nothing is blocked" : "Empty"));
    return acceptDrops(h("div", { class: `col s-${s}`, "data-state": s }, head, body), s);
  }));
  renderColTabs(columns, tasks);
  markPress();
}

// Columns, and on phones the states in the row above them, take the cards a mouse drags there.
function acceptDrops(el, s) {
  if (store.readOnly) return el;
  el.addEventListener("dragover", (e) => { if (e.dataTransfer.types.includes("text/kanvas-id")) { e.preventDefault(); el.classList.add("drop"); } });
  el.addEventListener("dragleave", (e) => { if (!el.contains(e.relatedTarget)) el.classList.remove("drop"); });
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("drop");
    dropCard(e.dataTransfer.getData("text/kanvas-id"), s);
  });
  return el;
}

// A card dropped on the column of state `s`, by mouse, finger or pen. The Blocked column stands for To do.
function dropCard(id, s) {
  const t = get(id), target = s === "blocked" ? "todo" : s;
  if (t && t.state !== target) commit(ops.state(t.id, seenOf(t), target));
}

// The column that takes up most of the board's width on screen, the first of equals, or the last column once
// the board is scrolled to its end. An index into `spans` ([left, right] pairs), or -1 when none shows.
function columnInView(spans, from, to, atEnd = false) {
  if (atEnd && spans.length) return spans.length - 1;
  let best = -1, most = 0;
  spans.forEach(([left, right], i) => {
    const seen = Math.min(right, to) - Math.max(left, from);
    if (seen > most) { best = i; most = seen; }
  });
  return best;
}

// The row of states above the columns on phones. A tap scrolls to that column, and the row marks it
// from the start, while the scroll passes the columns between.
let colAim = null;

function renderColTabs(columns, tasks) {
  const count = (s) => tasks.filter((t) => vstate(t) === s).length;
  const tab = (s, n, mark, props) => h("button", { class: `s-${s}${n ? "" : " zero"}`, ...props },
    h("span", { class: "n" }, mark, h("b", {}, n)), h("span", { class: "lbl" }, LABEL[s]));
  const tabs = columns.map((s) => acceptDrops(tab(s, count(s), h("span", { class: "dot" }), { "data-state": s, "aria-label": `${LABEL[s]}: ${count(s)}`, onclick: () => showColumn(s) }), s));
  if (prefs.hideDone && (!ui.states.size || ui.states.has("done"))) {
    const n = count("done");
    tabs.push(tab("done", n, icon("eye-off"), { class: "s-done off", "aria-label": `Done: ${n} hidden. Show finished tasks`, onclick: () => { toggleDone(); showColumn("done"); } }));
  }
  $("#col-tabs").replaceChildren(...tabs);
  markColumn();
}

function showColumn(s) {
  const kb = $("#kanban"), col = kb.querySelector(`.col[data-state="${s}"]`);
  if (!col) return;
  colAim = s;
  const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  kb.scrollTo({ left: col.offsetLeft - (parseFloat(getComputedStyle(kb).scrollPaddingLeft) || 0), behavior: smooth ? "smooth" : "auto" });
  markColumn();
}

function markColumn() {
  const kb = $("#kanban"), r = kb.getBoundingClientRect(), cols = [...kb.children];
  const atEnd = kb.scrollLeft > 0 && kb.scrollLeft >= kb.scrollWidth - kb.clientWidth - 1;
  const i = columnInView(cols.map((c) => { const b = c.getBoundingClientRect(); return [b.left, b.right]; }), r.left, r.right, atEnd);
  const cur = i < 0 ? null : cols[i].dataset.state;
  if (cur === colAim) colAim = null;
  for (const tab of $("#col-tabs").children) {
    const on = !!tab.dataset.state && tab.dataset.state === (colAim || cur);
    tab.classList.toggle("on", on);
    if (on) tab.setAttribute("aria-current", "true");
    else tab.removeAttribute("aria-current");
  }
}

function kanbanCard(t) {
  const vs = vstate(t), g = groupOf(t), asking = !!openQuestion(t);
  const el = h("div", {
    class: `kcard s-${vs}${asking ? " asking" : ""}${same(ui.selected, t.id) ? " sel" : ""}${multi.has(key(t.id)) ? " multi-on" : ""}`, "data-id": t.id, draggable: store.readOnly ? null : "true",
    role: "option", "aria-label": cardLabel(t, vs, unmet(t)),
    onclick: (e) => (picking ? pickToggle(t.id) : multiClick(e) ? toggleMulti(t.id) : select(t.id)),

// Touch and pen, which HTML5 drag and drop leaves out: a card held still lifts, then drags to a column, or on
// a phone to a state in the row above the columns. Let go where it lifted, it opens the card's menu. A finger
// that moves sooner scrolls the board, and a tap opens the card.
let cardPress = null; // { id, pointerId, x, y: where it pressed, cx, cy: where it is, lifted, ghost, over, edge }
const EDGE = 32; // a lifted card this close to the board's side scrolls the board a column at a time
const DRAG_SLOP = 16; // a thumb rolls this far as it lets go, which still opens the menu

const kanbanCardEl = (id) => [...document.querySelectorAll("#kanban .kcard")].find((el) => same(el.dataset.id, id));

// The card under the finger may be drawn anew by a render while it is held.
function markPress() {
  const p = cardPress, el = p && kanbanCardEl(p.id);
  if (!el) return;
  el.draggable = false;
  el.classList.toggle("lifted", p.lifted && !p.ghost);
  el.classList.toggle("dragging", !!p.ghost);
  if (p.ghost) {
    if (p.over) p.over.classList.remove("drop");
    p.over = null;
    dragOver(p);
  }
}

function endPress() {
  const p = cardPress;
  if (!p) return null;
  cardPress = null;
  clearTimeout(p.timer);
  clearTimeout(p.edgeTimer);
  if (p.ghost) p.ghost.remove();
  if (p.over) p.over.classList.remove("drop");
  const el = kanbanCardEl(p.id);
  if (el) { el.draggable = true; el.classList.remove("lifted", "dragging"); }
  return p;
}

function dragOver(p) {
  const el = document.elementFromPoint(p.cx, p.cy), target = el && el.closest("#kanban .col[data-state], #col-tabs [data-state]");
  if (target === p.over) return;
  if (p.over) p.over.classList.remove("drop");
  if (target) target.classList.add("drop");
  p.over = target;
}

function setupBoardInput() {
  const kb = $("#kanban");
  kb.addEventListener("scroll", () => { markColumn(); if (cardPress && cardPress.ghost) dragOver(cardPress); }, { passive: true });
  // A finger or a wheel on the board takes over from a scroll the row started.
  for (const type of ["pointerdown", "wheel"]) kb.addEventListener(type, () => { colAim = null; }, { passive: true });
  window.addEventListener("resize", markColumn);

  // Some browsers follow a long press with a click, which would open the card, or press the menu item that
  // opened under the finger.
  let swallowUntil = 0;
  document.addEventListener("click", (e) => { if (Date.now() < swallowUntil) { swallowUntil = 0; e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener("pointerdown", () => { swallowUntil = 0; }, true);
  kb.addEventListener("pointerdown", (e) => {
    const el = e.target.closest(".kcard");
    if (!e.isPrimary || e.pointerType === "mouse" || !el || store.readOnly || picking || e.target.closest("button, a")) return;
    endPress();
    cardPress = { id: el.dataset.id, pointerId: e.pointerId, x: e.clientX, y: e.clientY, cx: e.clientX, cy: e.clientY, lifted: false, ghost: null, over: null, edge: 0 };
    cardPress.timer = setTimeout(() => {
      if (!cardPress) return;
      cardPress.lifted = true;
      longPress.at = Date.now();
      markPress();
      if (navigator.vibrate) navigator.vibrate(10);

  kb.addEventListener("touchmove", (e) => { if (cardPress && cardPress.lifted) e.preventDefault(); }, { passive: false });
  document.addEventListener("pointermove", (e) => {
    const p = cardPress;
    if (!p || e.pointerId !== p.pointerId) return;
    p.cx = e.clientX;
    p.cy = e.clientY;
    const moved = Math.hypot(p.cx - p.x, p.cy - p.y);
    if (!p.lifted) { if (moved > 10) endPress(); return; }
    if (!p.ghost) {
      const el = kanbanCardEl(p.id);
      if (moved < DRAG_SLOP) return;
      if (!el) { endPress(); return; }
      const r = el.getBoundingClientRect();
      p.ghost = el.cloneNode(true);
      p.ghost.classList.remove("lifted", "sel", "flash", "menu-target");
      p.ghost.classList.add("ghost");
      p.ghost.setAttribute("aria-hidden", "true");
      Object.assign(p.ghost.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px` });
      p.gx = p.cx;
      p.gy = p.cy;
      document.body.append(p.ghost);
      markPress();
    }
    p.ghost.style.transform = `translate(${p.cx - p.gx}px, ${p.cy - p.gy}px)`;
    dragOver(p);
    const r = kb.getBoundingClientRect();
    const edge = p.cy < r.top || p.cy > r.bottom ? 0 : p.cx < r.left + EDGE ? -1 : p.cx > r.right - EDGE ? 1 : 0;
    if (edge === p.edge) return;
    clearTimeout(p.edgeTimer);
